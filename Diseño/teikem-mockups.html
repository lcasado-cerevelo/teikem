<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teikem — Delivery Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1220; --bg-2:#0A0E18; --panel:#141B2E; --panel-2:#182136; --raise:#1F2A44;
  --line:#243252; --line-2:#1C2740;
  --text:#E8ECF5; --muted:#8C97AD; --faint:#5B6680;
  --money:#FF6A1A; --money-2:#FF8B4D; --money-bg:rgba(255,106,26,.13); --money-line:rgba(255,106,26,.35);
  --flow:#1F6FE5; --flow-2:#6EA8FF; --flow-bg:rgba(31,111,229,.14); --flow-line:rgba(31,111,229,.40);
  --ok:#46CE82; --okbg:rgba(70,206,130,.13); --warn:#E6A93E; --warnbg:rgba(230,169,62,.13);
  --danger:#F26A60; --dangerbg:rgba(242,106,96,.13); --info:#6293FF; --infobg:rgba(98,147,255,.13);
  --violet:#9A8CF8; --violetbg:rgba(154,140,248,.13);
  --neutral-fg:#9aa3b2; --neutral-bg:rgba(255,255,255,.06);
  --app-bg:radial-gradient(1200px 600px at 80% -10%,#14203A 0%,#0D1220 55%);
  --label-paper:#fff; --label-ink:#0B2C66;
  --hexd:#0B2C66; --hexl:#1F6FE5;
  --mono:'JetBrains Mono',ui-monospace,monospace; --ui:'Space Grotesk',system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#F0F2F7; --bg-2:#FAFBFD; --panel:#FFFFFF; --panel-2:#F2F5FA; --raise:#E5EAF3;
  --line:#DDE4F0; --line-2:#E9EDF5;
  --text:#182136; --muted:#5B6880; --faint:#8C97AD;
  --money:#E05A0F; --money-2:#B94A0C; --money-bg:rgba(224,90,15,.10); --money-line:rgba(224,90,15,.30);
  --flow:#1F6FE5; --flow-2:#0B4DB8; --flow-bg:rgba(31,111,229,.10); --flow-line:rgba(31,111,229,.30);
  --ok:#1E9457; --okbg:rgba(30,148,87,.12); --warn:#B5811F; --warnbg:rgba(181,129,31,.13);
  --danger:#CC4B41; --dangerbg:rgba(204,75,65,.12); --info:#3C6BE0; --infobg:rgba(60,107,224,.12);
  --violet:#6D5FE0; --violetbg:rgba(109,95,224,.12);
  --neutral-fg:#5B6880; --neutral-bg:rgba(0,0,0,.05);
  --app-bg:radial-gradient(1100px 560px at 82% -12%,#ffffff 0%,#F0F2F7 60%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--app-bg);color:var(--text);font-family:var(--ui);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
svg{width:16px;height:16px;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:var(--flow);color:#fff}

.app{display:grid;grid-template-columns:250px 1fr;height:100vh;transition:grid-template-columns .16s ease}
.app.col{grid-template-columns:66px 1fr}

/* ===== SIDEBAR ===== */
.rail{background:linear-gradient(180deg,var(--panel),var(--bg));border-right:1px solid var(--line-2);display:flex;flex-direction:column;overflow:hidden}
.rbrand{display:block;cursor:pointer;padding:16px 13px 14px;border-bottom:1px solid var(--line-2);background:linear-gradient(135deg,rgba(31,111,229,.14),transparent 65%)}
#brandfull{width:100%}
#brandfull svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 14px rgba(46,124,246,.4))}
#brandmini{display:none;width:44px;margin:0 auto}

.rnav{flex:1;overflow-y:auto;padding:6px 9px}
.grp{margin-bottom:1px}
.grp-h{display:flex;align-items:center;gap:11px;width:100%;padding:9px 9px;border:none;background:transparent;border-radius:9px;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.grp-h:hover{background:var(--panel-2);color:var(--text)}
.grp-h .gi{display:flex;color:var(--faint)}.grp-h .gi svg{width:16px;height:16px}
.grp-h .chev{margin-left:auto;transition:.16s;color:var(--faint)}.grp-h .chev svg{width:14px;height:14px}
.grp.open .grp-h .chev{transform:rotate(90deg)}
.grp.open .grp-h{color:var(--text)}.grp.open .grp-h .gi{color:var(--flow-2)}
.grp-items{display:none;padding:1px 0 5px}
.grp.open .grp-items{display:block}
.navit{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 13px;margin:1px 4px 1px 8px;border-radius:8px;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;position:relative}
.navit::before{content:"";position:absolute;left:-2px;top:8px;bottom:8px;width:2px;border-radius:2px;background:transparent}
.navit .di{width:5px;height:5px;border-radius:50%;background:var(--faint);flex:none;margin-left:2px}
.navit:hover{background:var(--panel-2)}
.navit.on{background:var(--flow-bg);color:var(--flow-2);font-weight:600}
.navit.on::before{background:var(--flow)} .navit.on .di{background:var(--flow)}
.rfoot{padding:9px;border-top:1px solid var(--line-2)}
.collapse{display:flex;align-items:center;gap:10px;width:100%;padding:9px;border:none;background:transparent;border-radius:9px;color:var(--muted);font-size:12.5px;font-weight:500}
.collapse:hover{background:var(--panel-2);color:var(--text)}
.collapse svg{transition:.16s}
.app.col .collapse svg{transform:rotate(180deg)}
.app.col #brandfull,.app.col .grp-h .lbl,.app.col .grp-h .chev,.app.col .navit span,.app.col .collapse span{display:none}
.app.col .grp-items{display:none!important}
.app.col .grp-h{justify-content:center;padding:11px}
.app.col .rbrand{padding:14px 0 12px}
.app.col #brandmini{display:block}
.app.col .navit{display:none}
.app.col .collapse{justify-content:center}

/* ===== MAIN ===== */
.main{display:flex;flex-direction:column;overflow:hidden}
.bar{height:54px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line-2);background:var(--panel);flex:none}
.cmd{display:flex;align-items:center;gap:9px;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;color:var(--muted);font-size:13px;min-width:300px}
.cmd:focus-within{border-color:var(--flow-line);color:var(--text)}
.cmd kbd{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
/* La barra "Buscar o ejecutar" pasó de ser un botón único a un input real (pedido explícito de Luis:
   "si entro debo poder escribir o escanear un barcode") + un botón aparte para abrir el buscador
   completo tal cual funcionaba antes ("si le doy al boton, entonces sale lo que sale ahora"). */
.cmd .cmdinput{flex:1;min-width:0;border:none;background:transparent;color:inherit;font:inherit;outline:none;padding:0}
.cmd .cmdinput::placeholder{color:var(--muted)}
.cmd .cmdgo{border:none;background:transparent;padding:0;margin:0;display:flex;align-items:center;cursor:pointer;color:inherit}
.cmd .cmdgo:hover kbd{border-color:var(--flow-line)}
.bar .sp{flex:1}
.live{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,206,130,.5)}70%{box-shadow:0 0 0 6px rgba(70,206,130,0)}100%{box-shadow:0 0 0 0 rgba(70,206,130,0)}}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.55)}70%{box-shadow:0 0 0 16px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
.livedot{width:16px;height:16px;border-radius:50%;background:var(--flow);border:3px solid #fff;animation:livepulse 1.7s infinite;transition:left 1.2s linear,top 1.2s linear}
.livebadge{display:inline-flex;align-items:center;gap:6px;background:var(--danger-bg,rgba(239,68,68,.12));color:var(--danger);border-radius:20px;padding:4px 11px 4px 8px;font-size:11px;font-weight:700;letter-spacing:.03em}
.livebadge .dot{background:var(--danger);animation:pulse2 1.4s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 6px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.telemrow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line-2)}
.telemcell{padding:12px 16px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px}
.telemcell:last-child{border-right:none}
.telemcell .tl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);display:flex;align-items:center;gap:5px}
.telemcell .tv{font-size:15px;font-weight:700;font-family:var(--mono)}
.tlstop{display:flex;align-items:center;gap:11px;padding:9px 16px;border-bottom:1px solid var(--line-2)}
.tlstop:last-child{border-bottom:none}
.tlseq{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:none;background:transparent;border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.seg button svg{width:14px;height:14px}
.langdd{position:relative}
.langdd>button{display:flex;align-items:center;gap:7px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.langdd>button:hover{border-color:var(--flow-line)}
.langdd .fl{font-size:15px;line-height:1}
.langdd .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);padding:5px;display:none;min-width:170px;z-index:40}
.langdd.open .menu{display:block}
.langdd .menu button{display:flex;align-items:center;gap:9px;width:100%;border:none;background:transparent;border-radius:7px;padding:8px 10px;font-size:13px;font-weight:500;text-align:left}
.langdd .menu button:hover{background:var(--panel-2)}
.langdd .menu button.on{background:var(--flow-bg);color:var(--flow-2);font-weight:600}
.who{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line-2)}
.who .av{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--flow),var(--money));display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff}
.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 90px;min-width:0}
.wrap{width:100%;max-width:1760px;margin:0}
@media(prefers-reduced-motion:reduce){.dot{animation:none}.pipe::after{animation:none!important}}

/* ===== HOME ===== */
.daymeta{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
.daymeta h1{font-size:23px;font-weight:700;letter-spacing:-.01em;margin:0}
.daymeta span{color:var(--muted);font-size:13px}
.subtle{color:var(--faint);font-size:12.5px;margin:0 0 20px}
.streamlabel{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:6px 2px 10px}
.streamlabel .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.streamlabel.money{color:var(--money)} .streamlabel.flow{color:var(--flow-2)}
.river{display:flex;align-items:stretch;margin-bottom:6px}
.node{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;transition:.14s;position:relative;min-width:0}
.node:hover{border-color:var(--flow-line);transform:translateY(-2px)}
.node.sel{border-color:var(--flow);box-shadow:0 0 0 1px var(--flow),0 12px 30px -14px rgba(31,111,229,.5)}
.node.m:hover{border-color:var(--money-line)}
.node.m.sel{border-color:var(--money);box-shadow:0 0 0 1px var(--money),0 12px 30px -14px rgba(255,106,26,.45)}
.node .ph{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.node .ph svg{width:13px;height:13px}
.node .big{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:7px;line-height:1}
.node .sub{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:5px}
.node.flow .big{color:var(--flow-2)} .node.m .big{color:var(--money-2)}
.node .spark{display:flex;gap:2px;align-items:flex-end;height:20px;margin-top:9px}
.node .spark i{flex:1;border-radius:1px;min-height:3px;background:var(--line)}
.node.flow .spark i{background:var(--flow-line)} .node.m .spark i{background:var(--money-line)}
.pipe{width:30px;flex:none;align-self:center;height:3px;border-radius:3px;position:relative;overflow:hidden;background:var(--line)}
.pipe::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--flow) 0 8px,transparent 8px 16px);opacity:.75;animation:flowR 1s linear infinite}
.pipe.m::after{background:repeating-linear-gradient(90deg,var(--money) 0 8px,transparent 8px 16px);animation:flowL 1.1s linear infinite}
@keyframes flowR{to{transform:translateX(16px)}} @keyframes flowL{to{transform:translateX(-16px)}}

.inbox{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-top:22px;overflow:hidden}
.inbox .ih{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2);font-weight:600}
.inbox .ih .ct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.work{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.work:last-child{border-bottom:none}.work:hover{background:var(--panel-2)}
.work .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.work .tx{flex:1;min-width:0}.work .tx b{font-weight:600;font-size:13.5px}.work .tx p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.tone-danger .ico{background:var(--dangerbg);color:var(--danger)}
.tone-warn .ico{background:var(--warnbg);color:var(--warn)}
.tone-money .ico{background:var(--money-bg);color:var(--money)}
.tone-flow .ico{background:var(--flow-bg);color:var(--flow-2)}

/* radar */
.radar{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-top:16px;overflow:hidden}
.radar .rh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2);font-weight:600;flex-wrap:wrap}
.radar .rh svg{color:var(--flow-2)}
.radar .rh .r{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.radar .search{display:flex;align-items:center;gap:10px;margin:14px 16px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:2px 4px 2px 13px}
.radar .search svg{color:var(--faint)}
.radar .search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;padding:10px 0}
.radar .search:focus-within{border-color:var(--flow);box-shadow:0 0 0 3px var(--flow-bg)}
.gchips{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 8px}
.gchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg-2);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text)}
.gchip:hover{border-color:var(--flow-line)}
.gchip b{font-family:var(--mono);color:var(--flow-2)}
.gchip.money b{color:var(--money-2)}
.gtoggle{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:2px;margin-left:auto}
.gtoggle button{border:none;background:transparent;border-radius:6px;padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.gtoggle button.on{background:var(--panel);color:var(--text)}
.rres{border-top:1px solid var(--line-2)}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.rrow:last-child{border-bottom:none}
.rrow:hover,.rrow:focus{background:var(--panel-2);outline:none}
.rrow .meta{color:var(--muted);font-size:12.5px}
.rfoot{display:flex;justify-content:center;padding:11px}
.rowbtn{border:none;background:transparent;color:var(--faint);width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;margin-left:auto;flex:none}
.rowbtn:hover{background:var(--flow-bg);color:var(--flow-2)}

.head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.head h1{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0}
.head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--panel-2)}
.btn svg{width:15px;height:15px}
.btn.flow{background:var(--flow);border-color:var(--flow);color:#fff}.btn.flow:hover{background:var(--flow-2);color:#0B2C66}
.btn.money{background:var(--money);border-color:var(--money);color:#fff}.btn.money:hover{background:var(--money-2)}
.btn.sm{padding:6px 10px;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;min-width:0}
.panel .ph2{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line-2);font-weight:600;font-size:14px}
.panel .ph2 .r{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px;font-family:var(--mono)}
.panel .ph2 svg{width:16px;height:16px;color:var(--flow-2)}
.pb,.panel .pb{padding:16px}
.cols{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;line-height:1.6;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-cap{color:var(--neutral-fg);background:var(--neutral-bg)}
.s-wh{color:var(--violet);background:var(--violetbg)}
.s-disp{color:var(--info);background:var(--infobg)}
.s-route{color:var(--flow-2);background:var(--flow-bg)}
.s-deliv{color:var(--ok);background:var(--okbg)}
.s-cod{color:var(--money-2);background:var(--money-bg)}
.s-fail{color:var(--danger);background:var(--dangerbg)}
.lst{width:100%;border-collapse:collapse;font-size:13px}
.lst th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--panel)}
.lst th.sort{cursor:pointer;user-select:none}
.lst th.sort:hover{color:var(--flow-2)}
.lst th .arr{font-size:9px;margin-left:4px;color:var(--flow-2)}
.lst td{padding:8px 6px;border-bottom:1px solid var(--line-2);overflow-wrap:anywhere;word-break:break-word}
.lst tbody tr{cursor:pointer}
.lst tbody tr:hover td,.lst tbody tr:focus td{background:var(--panel-2)}
.lst tbody tr:focus{outline:none}
.lst td.n,.lst th.n{text-align:right;font-family:var(--mono)}
.lst td.n{white-space:nowrap}
.facttbl td,.facttbl th,.densetbl td,.densetbl th{padding:6px 3px}
.densetbl td input{width:100%;box-sizing:border-box;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;color:var(--text);outline:none}
.densetbl td input:focus{border-color:var(--flow);box-shadow:0 0 0 2px var(--flow-bg)}
.ref{font-family:var(--mono);color:var(--flow-2)}
.cash{font-family:var(--mono);font-weight:600;color:var(--money-2)}
.cash.z{color:var(--faint);font-weight:400}
.dr{font-family:var(--mono);font-size:12px;background:var(--raise);border-radius:5px;padding:1px 7px;color:var(--muted)}
.f{margin-bottom:13px}.f label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;color:var(--text);outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--flow);box-shadow:0 0 0 3px var(--flow-bg)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ===== numeración: orden (inv), factura (clientInvoice), empaque (pickBatch) y paquete (packageNo) =====
   Cuatro identificadores distintos que conviven en cada orden:
   - inv: número de orden. Lo asigna el cliente al someter (campo "Número de orden" en Entrada) o,
     si lo deja en blanco, lo genera Teikem con la nomenclatura configurada para ese cliente.
   - clientInvoice: número de factura. Lo asigna el cliente (su propia numeración de facturación) o,
     si lo deja en blanco, lo genera Teikem con su propia nomenclatura.
   - Cada cliente tiene DOS ajustes independientes (CLIENTS[].orderBy y .invoiceBy, cada uno
     'client'|'system') que deciden, por separado, quién asigna el número de orden y quién asigna
     el número de factura — no es una sola pregunta de either/or, un cliente puede, por ejemplo,
     asignar los dos, ninguno de los dos, o solo uno. El campo que queda en 'system' se deshabilita
     en el formulario y siempre se genera solo. Ver Clientes y contratos → Contrato → "Numeración
     de la orden".
   - Nomenclatura configurable por cliente (CLIENTS[].numFmt: {order,invoice,package}), un patrón de
     texto con '#' marcando cada dígito del consecutivo y '@' como marcador de letra en el patrón de
     ejemplo — lo que se escriba se usa tal cual, con cada '#' final reemplazado por el consecutivo
     con ceros a la izquierda. Configurable en Clientes y contratos y, para que el cliente la vea y
     la pueda ajustar él mismo, también en Portal de clientes → Configuración (mismo dato, mismo
     panel compartido `numFmtPanelHtml`).
   - pickBatch: número de empaque. Identifica el bulto/embarque para el chofer y el almacén. SIEMPRE
     tiene valor: si la orden viene de Recolección y empaque es el id del batch (PK-nnnn); para
     cualquier otra vía de entrada (detallada, rápida, portal, semilla) Teikem lo genera (EMP-nnnnn).
     Nunca lo asigna el cliente, y no tiene nomenclatura configurable — es un identificador interno
     de operación/almacén, no algo que el cliente necesite reconocer o ajustar.
   - packageNo: número de paquete. Identifica cada bulto físico dentro del empaque. Opcional en el
     formulario detallado; si se deja en blanco Teikem lo genera con su propia nomenclatura. En este
     mock es un solo campo por orden — un sistema real necesitaría una lista cuando pcs>1 (una fila
     por bulto). */
const DEFAULT_NUMFMT={order:'AX-#####',invoice:'FAC-####',package:'PQT-####'};
function clientNumFmt(clientId){const c=CLIENTS.find(x=>x.id===clientId);return (c&&c.numFmt)||DEFAULT_NUMFMT}
/* aplica un patrón tipo "AX-#####": el último tramo de '#' se reemplaza por el consecutivo con
   ceros a la izquierda; cualquier '@' que haya quedado en el patrón (marcador de letra) se resuelve
   a 'A' — simplificación deliberada del mock, un generador real dejaría escoger letras rotativas o
   con significado (zona, tipo de servicio, etc.), aquí basta con mostrar que el patrón se respeta. */
function resolveNumberMask(mask,seqNum){
 if(!mask)return String(seqNum);
 const m=mask.match(/#+$/)||mask.match(/#+/);
 let out=mask;
 if(m){const run=m[0];const idx=mask.lastIndexOf(run);
  out=mask.slice(0,idx)+String(seqNum).padStart(run.length,'0')+mask.slice(idx+run.length)}
 else out=mask+seqNum;
 return out.replace(/@/g,'A')}
let EMP_SEQ=20000;
function nextEmpaqueNo(){EMP_SEQ++;return 'EMP-'+EMP_SEQ}
let PKGNO_SEQ=5000;
function nextPackageNo(clientId){PKGNO_SEQ++;return resolveNumberMask(clientNumFmt(clientId).package,PKGNO_SEQ)}
let CLIENTINV_SEQ=9000;
function nextClientInvoiceNo(clientId){CLIENTINV_SEQ++;return resolveNumberMask(clientNumFmt(clientId).invoice,CLIENTINV_SEQ)}
let ORDER_SEQ=48300;
function nextOrderNo(clientId){ORDER_SEQ++;return resolveNumberMask(clientNumFmt(clientId).order,ORDER_SEQ)}

/* ===== qbox: campo de búsqueda libre reutilizable — filtra por CUALQUIER dato mostrado en el item =====

   (case-insensitive) contra un arreglo de valores visibles de cada fila/tarjeta. Cada pantalla mantiene
   su propio string de búsqueda (una variable o llave por sección, para poder buscar independientemente
   en secciones distintas de una misma pantalla, ej. "pendientes" vs "escaneados") y su propio setter que
   re-renderiza. No dispara red ni reindexación — es un filtro en memoria sobre lo que ya está en pantalla. */
function qbox(id,value,placeholder,oninputExpr){
 return `<div class="qbox">${ic('search')}<input type="text" id="${id}" value="${(value||'').replace(/"/g,'&quot;')}" placeholder="${placeholder||t('ui.mselSearch')}" oninput="${oninputExpr}" autocomplete="off"></div>`}

 return parts.some(p=>String(p==null?'':p).toLowerCase().includes(needle))}

/* Sección de indicadores en Pulso del día (pedido explícito de Luis: "los indicadores deben tener
   una opcion, puede ser un switch para decidir si se muestran en pulso del dia, esto condicionaria
   una sección de indicadores en pulso del dia"). Se agrega COMO SECCIÓN ADICIONAL, al lado de los
   dos "ríos" existentes (paquetes en la calle / dinero COD) — no los reemplaza ni compite con ellos,
   son un diseño pulido ya validado. Reusa el mismo lenguaje visual (.streamlabel + .river + .node)
   para que se sienta nativo de Pulso en vez de un widget pegado, y el mismo color-coding que ya
   existe ahí: azul (.node.flow) para indicadores de cantidad, naranja (.node.m) para indicadores en
   dinero — igual que los dos ríos originales. Respeta el permiso individual del indicador
   (canSeeIndicator) y su rango de fecha configurado, calculando el valor con la misma función
   indicatorValue que usa la pantalla de Indicadores. Si el usuario actual no tiene ningún indicador
   marcado para Pulso (o no tiene permiso de ver los que sí lo están), la sección completa no se
   imprime — Pulso no debe mostrar una caja vacía por defecto. */
function pulseIndicatorsHtml(){
  const list=INDICATORS.filter(i=>i.showInPulso&&canSeeIndicator(i,CURRENT_USER_ID));
  if(!list.length)return '';
  const nodes=list.map((ind,i)=>{const money=indicatorIsMoney(ind);const cap=indicatorDateRangeCaption(ind);
    return `${i?`<div class="pipe${money?' m':''}"></div>`:''}<div class="node ${money?'m':'flow'}" onclick="go('indicadores')"><div class="ph">${ic(indicatorModuleIcon(ind.module))} ${ind.name}</div><div class="big">${indicatorFmtValue(indicatorValue(ind),money)}</div><div class="sub">${cap||indicatorModuleLabel(ind.module)}</div></div>`}).join('');
  return `<div class="streamlabel" style="margin-top:18px">${ic('chart')} ${t('home.pulseIndicators')} <span class="ln"></span></div>
   <div class="river">${nodes}</div>`;
}

   diferencia de un indicador, un gráfico no es un solo número — no encaja en un `.node` del río, así
   que se dibuja como una grilla de paneles compactos (mismo componente `chartVizHtml` que usa la
   galería de Gráficos, sin controles de edición/rango aquí — para eso está la pantalla de Gráficos,

   todos, igual que ya pasa en la propia galería de Gráficos. */

}

/* ===== Edición de una orden en Entrada (pedido explícito de Luis: "las ordenes con estatus
   entradas pueden ser editadas") — hasta ahora una orden en estatus Entrada (`st==='cap'`) solo se
   podía eliminar desde la tabla, nunca corregir; el chevron de la fila abre `record()` ("Expediente
   de orden"), que es una pantalla de ejemplo con datos fijos (AX-48217 · Farmacia Las Marías) para
   ilustrar la línea de tiempo de una orden, no un editor real por-orden — así que no servía para
   esto. Se agrega un modal de edición liviano con los mismos campos que ya se capturan en la Entrada
   detallada y que sí viven en el objeto `Order`: consignatario, pueblo, ZIP, servicio, tipo de
   paquete, piezas, COD y comentario. Deliberadamente NO incluye cliente ni los números de
   orden/factura/empaque — esos definen la identidad y numeración de la orden (ligada al cliente en
   el momento de crearla) y cambiarlos después es un problema de re-numeración distinto al de corregir
   un dato de captura; se muestran como referencia de solo lectura en el encabezado del modal. Sigue
   la misma guarda que "Eliminar": solo disponible mientras la orden sigue en Entrada. */
let OB=null; // {inv}: qué orden se está editando; los valores del formulario se leen del ORDERS vivo, no de un borrador aparte
window.openOrderEditor=(inv)=>{const o=ORDERS.find(x=>x.inv===inv);if(!o||o.st!=='cap')return;
 OB={inv};
 const gm=document.getElementById('genModal');gm.style.width='560px';
 gm.innerHTML=renderOrderEditorHtml();document.getElementById('genScrim').classList.add('on')};
window.cancelOrderEdit=()=>{OB=null;closeGenModal()};
window.saveOrderEdit=()=>{const e=t('ordenes');const en=t('entry');
 const o=ORDERS.find(x=>x.inv===OB.inv);if(!o){OB=null;closeGenModal();return}
 const consEl=document.getElementById('oe_cons');const cons=(consEl.value||'').trim();
 if(!cons){toast(en.needConsignee);consEl.focus();return}
 const svcEl=document.getElementById('oe_svc');if(!svcEl.value){toast(en.needSvc);svcEl.focus();return}
 const pkgEl=document.getElementById('oe_pkg');if(!pkgEl.value){toast(en.needPkg);pkgEl.focus();return}
 const townEl=document.getElementById('oe_town'),zipEl=document.getElementById('oe_zip'),pcsEl=document.getElementById('oe_pcs'),codEl=document.getElementById('oe_cod'),noteEl=document.getElementById('oe_note');
 o.cons=cons;o.town=townEl.value;o.zip=zipEl.value||townZip[townEl.value]||o.zip;o.svc=svcEl.value;o.pkg=pkgEl.value;
 o.pcs=parseInt(pcsEl.value)||1;o.cod=parseFloat(codEl.value)||0;o.note=noteEl.value||'';
 toast(e.orderUpdated+': '+o.inv);
 OB=null;closeGenModal();renderTable()};
function renderOrderEditorHtml(){const e=t('ordenes');const en=t('entry');const o=ORDERS.find(x=>x.inv===OB.inv);
 if(!o){return `<div class="pb"><p class="d">—</p></div>`}
 return `<div class="pi" style="justify-content:space-between"><b style="font-size:15px">${ic('pencil')} ${e.editOrder} · <span class="ref">${o.inv}</span></b><button class="x" onclick="cancelOrderEdit()" style="border:none;background:transparent;color:var(--faint);width:28px;height:28px;border-radius:8px">✕</button></div>
 <div class="pb">
  <p class="d" style="margin-top:0">${e.editHint.replace('{client}',o.sender).replace('{pack}',o.pickBatch||'—').replace('{invoice}',o.clientInvoice||'—')}</p>
  <div class="r2"><div class="f"><label>${t('cols.cons')}</label><input id="oe_cons" value="${(o.cons||'').replace(/"/g,'&quot;')}"></div><div class="f"><label>${en.svc}</label><select id="oe_svc">${svcs.map(s=>`<option ${o.svc===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
  <div class="r3" style="margin-bottom:0"><div class="f" style="margin:0"><label>${t('cols.town')}</label><select id="oe_town" onchange="document.getElementById('oe_zip').value=townZip[this.value]||''">${towns.map(x=>`<option ${o.town===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="f" style="margin:0"><label>${t('cols.zip')}</label><input id="oe_zip" class="mono" value="${o.zip||''}"></div><div class="f" style="margin:0"><label>${en.pieces}</label><input id="oe_pcs" class="mono" value="${o.pcs}"></div></div>
  <div class="r2"><div class="f"><label>${en.pkgtype}</label><select id="oe_pkg">${pkgs.map(x=>`<option ${o.pkg===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="f"><label>${t('cols.cod')}</label><input id="oe_cod" class="mono" value="${money(o.cod||0)}"></div></div>
  <div class="f" style="margin-bottom:0"><label>${en.comment}</label><input id="oe_note" value="${(o.note||'').replace(/"/g,'&quot;')}"></div>
 </div>
 <div class="ft" style="justify-content:flex-end;gap:10px"><button class="btn sm" onclick="cancelOrderEdit()">${t('drv.cancel')}</button><button class="btn sm flow" onclick="saveOrderEdit()">${ic('check')} ${t('roles').saveBtn}</button></div>`}

let SCANMODE='out';let PEND=[];let FEED=[];
let SF={client:[],town:[],zip:[],route:[],hascod:[]};
let SCANQ={feed:'',pend:''}; // búsqueda libre independiente por sección (escaneados / pendientes)
window.setScanMode=m=>{SCANMODE=m;go('escaneo',true)};
window.setSF=(k,v)=>{SF[k]=v;refreshScan()};
window.setScanQ=(sec,v)=>{SCANQ[sec]=v;refreshScan()};
function matchScanQ(x,sec){return matchesQ([x.ref,x.client,x.town,x.zip,x.route,x.assigned,x.hascod?'COD':'',x.tm],SCANQ[sec])}
function refreshScan(){const feedEl=document.getElementById('feed');if(!feedEl)return;const s=t('scan');
 const nfAll=PEND.filter(matchSF),nffAll=FEED.filter(matchSF),tot=nfAll.length+nffAll.length;
 const nf=nfAll.filter(x=>matchScanQ(x,'pend')),nff=nffAll.filter(f=>matchScanQ(f,'feed'));
 feedEl.innerHTML=nff.length?nff.map(f=>feedRow(f)).join(''):`<div class="empty" style="min-height:110px"><div><div class="ic">${ic('scan')}</div>${s.emptyfeed}</div></div>`;
 document.getElementById('pgrid').innerHTML=nf.map(x=>pendChip(x)).join('');
 document.getElementById('fcount').textContent=nff.length;document.getElementById('pcount').textContent=nf.length;
 document.getElementById('scount').textContent=nffAll.length;
 document.getElementById('sfill').style.width=(tot?Math.round(100*nffAll.length/tot):0)+'%'}
function initScanData(){if(PEND.length||FEED.length)return;
 const pool = ORDERS.filter(o=>o.st==='wh'&&!o.routeId);
 pool.forEach(o=>PEND.push({ref:o.inv, client:o.sender, town:o.town, zip:o.zip, route:zoneForTown(o.town)||'—', hascod:!!o.cod}))}
function zoneForTown(town){for(const z in ZONE_TOWNS){if(ZONE_TOWNS[z].includes(town))return z}return null}
function matchSF(x){
  const codOk = SCANMODE!=='proc' || SF.hascod.length===0 || SF.hascod.length===2 ||
    (SF.hascod[0]===t('scan.yes')? x.hascod : !x.hascod);
  return (!SF.client.length||SF.client.includes(x.client))&&(!SF.town.length||SF.town.includes(x.town))&&(!SF.zip.length||SF.zip.includes(x.zip))&&(!SF.route.length||SF.route.includes(x.route))&&codOk}
function scan(){const s=t('scan');initScanData();
 const fpAll=PEND.filter(matchSF),ffAll=FEED.filter(matchSF);
 const tot=fpAll.length+ffAll.length;
 const fp=fpAll.filter(x=>matchScanQ(x,'pend')),ff=ffAll.filter(f2=>matchScanQ(f2,'feed'));
 const f=t('entry.f');
 const zips=[...new Set(Object.values(townZip))];
 return `<div class="scanwrap">
  <div class="head"><div><h1>${s.title}</h1><p>${s.sub}</p></div>
   <div class="act"><button class="btn sm" onclick="toggleVoice()" title="${VOICE_ON?s.voiceOn:s.voiceOff}">${ic(VOICE_ON?'volume':'volumeOff')} ${VOICE_ON?s.voiceOn:s.voiceOff}</button><button class="btn sm" onclick="report('waybill')">${ic('doc')} ${s.missing}</button></div></div>
  <div class="scanhero">
   <div class="modes"><button class="${SCANMODE==='out'?'on':''}" onclick="setScanMode('out')">${s.out}</button><button class="${SCANMODE==='in'?'on':''}" onclick="setScanMode('in')">${s.inn}</button><button class="${SCANMODE==='proc'?'on':''}" onclick="setScanMode('proc')">${s.codm}</button></div>
   <div class="scaninput">${ic('scan')}<input id="scanin" placeholder="${s.ph}"><button class="go" onclick="doScan()">${s.go}</button></div>
   <div class="hint">${s.hint}</div>
  </div>
  <div class="scanfilters">
   <div class="f"><label>${f.cons==='Consignatario'?'Cliente':'Client'}</label>${msel('sfclient',senders,SF.client,v=>setSF('client',v),f.all)}</div>
   <div class="f"><label>${t('cols.town')}</label>${msel('sftown',towns,SF.town,v=>setSF('town',v),f.all)}</div>
   <div class="f"><label>${t('cols.zip')}</label>${msel('sfzip',zips,SF.zip,v=>setSF('zip',v),f.all)}</div>
   <div class="f"><label>${t('cols.route')}</label>${msel('sfroute',routes,SF.route,v=>setSF('route',v),f.all)}</div>
   ${SCANMODE==='proc'?`<div class="f"><label>${s.hascod}</label>${msel('sfhascod',[s.yes,s.no],SF.hascod,v=>setSF('hascod',v),f.all)}</div>`:''}
  </div>
  <div class="scanmeter"><div class="nums"><b id="scount">${ffAll.length}</b> <span style="color:var(--faint)">${s.of} ${tot}</span></div><div class="track"><div class="fill" id="sfill" style="width:${tot?Math.round(100*ffAll.length/tot):0}%"></div></div></div>
  <div class="panel" style="margin-bottom:16px"><div class="ph2">${ic('check')} ${s.feed} <span class="r" id="fcount">${ff.length}</span></div>
   <div class="qrow">${qbox('scanq-feed',SCANQ.feed,t('ui.mselSearch'),"setScanQ('feed',this.value)")}</div>
   <div class="feed" id="feed">${ff.length?ff.map(f2=>feedRow(f2)).join(''):`<div class="empty" style="min-height:110px"><div><div class="ic">${ic('scan')}</div>${s.emptyfeed}</div></div>`}</div></div>
  <div class="panel"><div class="ph2">${ic('clock')} ${s.pending} <span class="r" id="pcount">${fp.length}</span></div>
   <div class="qrow">${qbox('scanq-pend',SCANQ.pend,t('ui.mselSearch'),"setScanQ('pend',this.value)")}</div>
   <div class="chipsgrid" id="pgrid">${fp.map(x=>pendChip(x)).join('')}</div></div>
 </div>`}
function pendChip(x){return `<div class="cg" style="cursor:pointer" onclick="openOrderPeek('${x.ref}')">${x.ref}<small>${x.client} \u00b7 ${x.town} ${x.zip} \u00b7 ${x.route}${x.hascod?' \u00b7 <b style="color:var(--money-2)">COD</b>':''}</small></div>`}
function feedRow(f){return `<div class="fi" style="cursor:pointer" onclick="openOrderPeek('${f.ref}')"><div class="ok">${ic('check')}</div><div><span class="ref">${f.ref}</span><div class="meta">${f.client} \u00b7 ${f.town} \u00b7 ${f.route}${f.assigned?` \u00b7 <span class="tag">${f.assigned}</span>`:''}</div></div><span class="tm">${f.tm}</span></div>`}
window.openOrderPeek=(ref)=>{const o=ORDERS.find(x=>x.inv===ref);document.getElementById('genModal').innerHTML=renderOrderPeekHtml(o,ref);document.getElementById('genScrim').classList.add('on')};
function renderOrderPeekHtml(o,ref){const s=t('scan');
 if(!o)return `<div class="pi" style="justify-content:space-between"><b>${ref}</b><button class="x" onclick="closeGenModal()" style="border:none;background:transparent;color:var(--faint);width:28px;height:28px;border-radius:8px">\u2715</button></div><div class="pb"><div class="empty" style="min-height:100px"><div>${ic('box')}</div></div></div>`;
 return `<div class="pi" style="justify-content:space-between"><b style="font-size:15px">${ic('box')} <span class="ref">${o.inv}</span></b><button class="x" onclick="closeGenModal()" style="border:none;background:transparent;color:var(--faint);width:28px;height:28px;border-radius:8px">\u2715</button></div>
 <div class="pb">
  <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--muted)">${t('cols.client')}</span><b>${o.sender}</b></div>
  <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--muted)">${t('cols.cons')}</span><b>${o.cons}</b></div>
  <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--muted)">${t('cols.town')}</span><b>${o.town} \u00b7 ${o.zip}</b></div>
  <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--muted)">${t('cols.svc')}</span><b>${o.svc}</b></div>
  <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--muted)">${t('cols.pkg')}</span><b>${o.pkg} \u00b7 ${o.pcs}</b></div>
  <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--muted)">${t('cols.cod')}</span><b class="cash ${o.cod?'':'z'}">${o.cod?'$'+money(o.cod):'\u2014'}</b></div>
  <div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--muted)">${t('cols.status')}</span><span class="chip ${stcls[o.st]}">${t('st.'+o.st)}</span></div>
  ${o.routeId?`<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--muted)">${t('disp.activeroute')}</span><b class="ref">${o.routeId}</b></div>`:''}
 </div>
 <div class="ft" style="justify-content:flex-end"><button class="btn sm flow" onclick="closeGenModal();go('envio')">${ic('chev')} ${t('ui.openrow')}</button></div>`}
let VOICE_ON=true;
window.toggleVoice=()=>{VOICE_ON=!VOICE_ON;if(!VOICE_ON&&window.speechSynthesis)speechSynthesis.cancel();go('escaneo',true)};
function speak(kind){if(!VOICE_ON||!window.speechSynthesis)return;
 const words={es:{found:'S\u00ed',notfound:'No',dup:'Ya'},en:{found:'Yes',notfound:'No',dup:'Already'}};
 const text=(words[LANG]||words.es)[kind];if(!text)return;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=LANG==='es'?'es-PR':'en-US';u.rate=1.05;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
window.doScan=()=>{const inp=document.getElementById('scanin');const v=(inp.value||'').trim();
 const fp=PEND.filter(matchSF);
 if(!v){if(fp.length===0)return;
   const item=fp[0];PEND.splice(PEND.indexOf(item),1);
   item.tm=new Date().toLocaleTimeString(LANG==='es'?'es-PR':'en-US',{hour:'numeric',minute:'2-digit'});
   if(SCANMODE==='out'){const order=ORDERS.find(x=>x.inv===item.ref);const zone=item.route&&item.route!=='\u2014'?item.route:null;
     const openRoute=zone?ROUTES_TODAY.find(r=>r.zone===zone&&r.status!=='completed'):null;
     if(order&&openRoute){order.routeId=openRoute.id;openRoute.totalStops++;item.assigned=openRoute.id}}
   FEED.unshift(item);speak('found');refreshScan();inp.focus();return}
 if(FEED.find(f=>f.ref===v)){speak('dup');inp.value='';inp.focus();return}
 const hit=fp.find(x=>x.ref===v);
 if(!hit){speak('notfound');inp.focus();return}
 PEND.splice(PEND.indexOf(hit),1);
 hit.tm=new Date().toLocaleTimeString(LANG==='es'?'es-PR':'en-US',{hour:'numeric',minute:'2-digit'});
 if(SCANMODE==='out'){const order=ORDERS.find(x=>x.inv===hit.ref);const zone=hit.route&&hit.route!=='\u2014'?hit.route:null;
   const openRoute=zone?ROUTES_TODAY.find(r=>r.zone===zone&&r.status!=='completed'):null;
   if(order&&openRoute){order.routeId=openRoute.id;openRoute.totalStops++;hit.assigned=openRoute.id}}
 FEED.unshift(hit);inp.value='';speak('found');
 refreshScan();
 inp.focus()};

 function add(key,label,pieces,amount){if(!groups[key]){groups[key]={label,pieces:0,amount:0};order.push(key)}groups[key].pieces+=pieces;groups[key].amount+=amount}
 run.days.forEach(d=>d.lines.forEach(l=>{const svc=svcLabel(l.svc);
   add(svc+'|'+l.pkg+'|item', svc+' · '+l.pkg+' — '+(es?'pieza base':'base piece'), 1, l.priceItem);

   if(l.priceCod>0) add(svc+'|cod', svc+' — '+(es?'cargo COD':'COD fee'), 1, l.priceCod);
 }));

/* ===== TARIFAS DE CHOFERES (maestro) + LIQUIDACIÓN =====
   Modelo abierto por diseño: ATTEMPT_TIERS no está limitado a 2 — "+ Agregar intento" añade
   más niveles en vivo. La fórmula que combina "pago por entrega" con "pago por intento" es
   configurable por tenant (PAYOUT_FORMULA), no una regla fija en el código. */
let PAYOUT_FORMULA = 'stack'; // 'stack' | 'extra' | 'fail' — ver drv.f_stack / f_extra / f_fail
let ATTEMPT_TIERS = [1, 2]; // niveles de intento configurados; abierto, no capado a 2
/* deliveryRates: igual que las tarifas por servicio de un cliente (svcRates) — un chofer puede
   cobrar distinto según el tipo de servicio y el tipo de paquete que entrega, no un monto plano
   único por entrega. */
const DRIVER_RATES = {
 '010': {deliveryRates:[{svc:'Next day',pkg:'Box',rate:6.00},{svc:'Standard',pkg:'Box',rate:5.00}], attempts:{1:0, 2:3.00}, trips:[{label:'Vagón del muelle',amount:75.00},{label:'Traslado especial',amount:50.00}], active:true},
 '001': {deliveryRates:[{svc:'Next day',pkg:'Box',rate:5.50},{svc:'Same day',pkg:'Envelope',rate:6.50}], attempts:{1:0, 2:2.50}, trips:[{label:'Vagón del muelle',amount:70.00}], active:true},
 '814': {deliveryRates:[{svc:'Next day',pkg:'Box',rate:6.00}], attempts:{1:0, 2:3.00}, trips:[], active:true},
 '823': {deliveryRates:[{svc:'Next day',pkg:'Box',rate:5.00}], attempts:{1:0, 2:2.00}, trips:[], active:true},
};
/* provisiona una ficha de tarifas vacía para un chofer que todavía no tiene una — así se puede
   crear el chofer y añadirle su primera tarifa por entrega/viaje/intento en el mismo flujo */
function ensureDriverRate(code){
 if(!DRIVER_RATES[code]){
   const attempts={};ATTEMPT_TIERS.forEach(n=>attempts[n]=0);
   DRIVER_RATES[code]={deliveryRates:[],attempts,trips:[],active:true};
 }
 return DRIVER_RATES[code];
}
function resolveDeliveryRate(driverRate,svc,pkg){const r=driverRate.deliveryRates.find(x=>x.svc===svc&&x.pkg===pkg);return r?r.rate:0}
function driverTripRateFor(code,label){const r=DRIVER_RATES[code];if(!r)return 0;const tr=r.trips.find(x=>x.label===label);return tr?tr.amount:0}
function attemptRate(driverRate,n){
 if(driverRate.attempts[n]!=null) return driverRate.attempts[n];
 const keys=Object.keys(driverRate.attempts).map(Number).filter(k=>k<=n);
 if(!keys.length) return 0;
 return driverRate.attempts[Math.max(...keys)];
}
/* order es opcional: {svc,pkg} de la orden real que se está liquidando, para resolver CUÁL fila de
   deliveryRates aplica. Sin order (ej. la vista previa de ejemplo) se usa la primera tarifa
   configurada del chofer, solo para ilustrar el cálculo. */
function computeAttemptPay(driverRate,attempts,formula,order){
 const es=LANG==='es';
 const sorted=[...attempts].sort((a,b)=>a.n-b.n);
 const delivered=sorted.some(a=>a.outcome==='entregada');
 const breakdown=[];
 const iLabel=n=>(es?'Intento ':'Attempt ')+n;
 const dLabel=es?'Entrega':'Delivery';
 const matched=order?driverRate.deliveryRates.find(x=>x.svc===order.svc&&x.pkg===order.pkg):driverRate.deliveryRates[0];
 const deliveryAmount=matched?matched.rate:0;
 const deliveryNote=(order&&!matched)?(es?' (sin tarifa configurada)':' (no rate configured)'):'';
 if(formula==='extra'){
   sorted.forEach(a=>{if(a.n>=2) breakdown.push({label:iLabel(a.n), amount:attemptRate(driverRate,a.n)})});
   if(delivered) breakdown.push({label:dLabel+(es?' (incl. 1er intento)':' (incl. 1st attempt)')+deliveryNote, amount:deliveryAmount});
 } else if(formula==='fail'){
   sorted.forEach(a=>{
     if(a.outcome==='entregada') breakdown.push({label:dLabel+' ('+iLabel(a.n).toLowerCase()+')'+deliveryNote, amount:deliveryAmount});
     else breakdown.push({label:iLabel(a.n)+(es?' (fallido)':' (failed)'), amount:attemptRate(driverRate,a.n)});
   });
 } else { // 'stack'
   sorted.forEach(a=>breakdown.push({label:iLabel(a.n), amount:attemptRate(driverRate,a.n)}));
   if(delivered) breakdown.push({label:dLabel+deliveryNote, amount:deliveryAmount});
 }
 return {breakdown, delivered};
}

/* Bitácora de intentos de entrega (DeliveryAttempt) — se genera a partir de las órdenes ya
   sembradas: fuente de verdad para pagarle al chofer y, más adelante, para un cargo opcional
   por intento al facturar al cliente (ver nota en Tarifas de choferes). */
const DELIVERY_ATTEMPTS=[];
(function(){
 const failReasons=['Nadie en la dirección','Negocio cerrado','Dirección incompleta','Rechazado por el cliente'];
 let forcedTriple=false;
 ORDERS.forEach(o=>{
   if(!DRIVER_RATES[o.dr]) return; // sin chofer real asignado con maestro de tarifas
   if(o.st==='deliv'){
     if(!forcedTriple){ // al menos un ejemplo con 3 intentos, para demostrar que no está limitado a 2
       forcedTriple=true;
       DELIVERY_ATTEMPTS.push({order:o.inv,n:1,driver:o.dr,date:o.date,outcome:'fallida',reason:rnd(failReasons)});
       DELIVERY_ATTEMPTS.push({order:o.inv,n:2,driver:o.dr,date:o.date,outcome:'fallida',reason:rnd(failReasons)});
       DELIVERY_ATTEMPTS.push({order:o.inv,n:3,driver:o.dr,date:o.date,outcome:'entregada',reason:null});
       return;
     }
     if(Math.random()<0.22){
       DELIVERY_ATTEMPTS.push({order:o.inv,n:1,driver:o.dr,date:o.date,outcome:'fallida',reason:rnd(failReasons)});
       DELIVERY_ATTEMPTS.push({order:o.inv,n:2,driver:o.dr,date:o.date,outcome:'entregada',reason:null});
     } else {
       DELIVERY_ATTEMPTS.push({order:o.inv,n:1,driver:o.dr,date:o.date,outcome:'entregada',reason:null});
     }
   } else if(o.st==='fail'){
     const n=Math.random()<0.5?1:2;
     for(let i=1;i<=n;i++) DELIVERY_ATTEMPTS.push({order:o.inv,n:i,driver:o.dr,date:o.date,outcome:'fallida',reason:rnd(failReasons)});
   }
 });
})();

 const svc=document.getElementById('nsrSvc').value;const pkg=document.getElementById('nsrPkg').value;

window.addPieceRate=()=>{const c=CLIENTS.find(x=>x.id===CLIENTSEL);if(!c)return;
 const svc=document.getElementById('nprSvc').value;const pkg=document.getElementById('nprPkg').value;
 const from=parseInt(document.getElementById('nprFrom').value)||1;const to=parseInt(document.getElementById('nprTo').value)||from;
 const rate=parseFloat(document.getElementById('nprRate').value)||0;
 if(to<from){toast(t('clientes.badRange'));return}
 const overlap=c.extraPieceRates.some(r=>r.svc===svc&&r.pkg===pkg&&pieceRangesOverlap(r,{from,to}));
 if(overlap){toast(t('clientes.overlapRange'));return}

 if(field==='rate') row[field]=parseFloat(val)||0;
 else row[field]=parseInt(val)||0; // from/to
 if(field==='from'||field==='to'){
   if(row.to<row.from){toast(t('clientes.badRange'));row.from=prevFrom;row.to=prevTo;go('clientes',true);return}
   const overlap=c.extraPieceRates.some((r,i)=>i!==idx&&r.svc===row.svc&&r.pkg===row.pkg&&pieceRangesOverlap(r,row));
   if(overlap){toast(t('clientes.overlapRange'));row.from=prevFrom;row.to=prevTo;go('clientes',true);return}
 }
 go('clientes',true)};

/* ===== Importar consignatarios desde CSV — el mapeo lo define una PLANTILLA, por posición de
   columna ("el primer campo es nombre, el segundo es número, el tercero la dirección…", tal como
   lo pidió Luis), no por adivinar el nombre del encabezado. Por eso el flujo es plantilla primero,
   archivo después: sin una plantilla escogida no hay manera de saber qué columna es cuál, así que
   el botón de escoger archivo queda deshabilitado hasta que hay una activa. CONSIMP_SCOPE fija el
   cliente dueño de los importados; cuando no hay alcance fijo (Catálogo con filtro "todos") se
   ofrece además un campo "Cliente" como una columna más a mapear. ===== */
let CONSIMP_SCOPE='',CONSIMP_SHOW_CLIENT_COL=false,CONSIMP_HEADERS=[],CONSIMP_ROWS=[],CONSIMP_FILENAME='';
const CONSIMP_DIACRITICS_RE=new RegExp('[̀-ͯ]','g');
function normConsImp(s){return (s||'').toString().normalize('NFD').replace(CONSIMP_DIACRITICS_RE,'').toLowerCase().trim()}
/* El catálogo de campos destino es fijo — son TODOS los campos que tiene un consignatario (número,
   nombre, dirección, pueblo, teléfono, cliente dueño) — y no depende de en qué contexto se abrió el
   modal, porque una plantilla es un dato reutilizable que debe verse igual sin importar desde dónde
   se creó. El campo "Cliente" siempre aparece como opción de mapeo (junto con "— no importar —" en
   cada columna, ver renderConsImpTplEditorHtml); si el import se ejecuta con un cliente ya fijo
   (Portal, o Catálogo con filtro puesto) ese mapeo simplemente no se usa al importar — ver
   importConsignees(), gateado por CONSIMP_SHOW_CLIENT_COL — el consignatario siempre queda del
   cliente fijo en ese caso, la columna mapeada a Cliente solo se ignora. */
function consImpFields(){return ['number','name','address','town','phone','client']}
function parseConsImpCsv(text){
 const lines=text.split(/\r\n|\n|\r/).filter(l=>l.length>0);
 return lines.map(line=>{
  const cells=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
   if(inQ){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++} else inQ=false } else cur+=ch }
   else { if(ch==='"') inQ=true; else if(ch===','){cells.push(cur);cur=''} else cur+=ch }
  }
  cells.push(cur);
  return cells.map(c=>c.trim());
 })}

 run.days.forEach(d=>d.lines.forEach(l=>{const lt=settleLineTotal(l);adjTot+=l.adj;

   <path d="M46 0 C 50 18, 42 30, 48 46 C 52 60, 44 76, 50 100" fill="none" stroke="${roadCol}" stroke-width="${sat?'.4':'.55'}" opacity="${sat?'.8':'.6'}"/>

let MONITOR_SEL=null;
let MONITORQ=''; // búsqueda libre en Rutas activas
window.selectMonitorRoute=(id)=>{MONITOR_SEL=id;go('monitoreo',true)};
window.setMonitorQ=(v)=>{MONITORQ=v;go('monitoreo',true)};
window.toggleFollow=()=>{MONITOR_FOLLOW=!MONITOR_FOLLOW;go('monitoreo',true)};
let MONITOR_FOLLOW=true;
function tickMonitor(){if(CURRENT!=='monitoreo')return;
  ROUTES_TODAY.forEach(r=>{if(r.status==='dispatched'&&r.done<r.totalStops&&Math.random()<0.35)r.done++});
  go('monitoreo',true)}
setInterval(tickMonitor,4000);
function routePos(route){const frac=Math.min(1,route.done/route.totalStops);const st=route.stops;
  const idx=frac*(st.length-1);const i0=Math.floor(idx),i1=Math.min(st.length-1,i0+1),tt=idx-i0;
  return {x:st[i0][0]+(st[i1][0]-st[i0][0])*tt, y:st[i0][1]+(st[i1][1]-st[i0][1])*tt}}
function monitoreo(){const m=t('monitor');
  const active=ROUTES_TODAY.filter(r=>r.status==='dispatched');
  const activeShown=active.filter(r=>{const dv=DRIVERS.find(x=>x.code===r.driver);return matchesQ([r.id,r.driver,r.zone,dv?dv.name:''],MONITORQ)});
  if(!MONITOR_SEL||!active.find(r=>r.id===MONITOR_SEL))MONITOR_SEL=active[0]?active[0].id:null;
  const route=active.find(r=>r.id===MONITOR_SEL);
  const stopsLeft=active.reduce((s,r)=>s+(r.totalStops-r.done),0);
  const avgPct=active.length?Math.round(active.reduce((s,r)=>s+100*r.done/r.totalStops,0)/active.length):0;
  const nextDone=[...active].sort((a,b)=>(b.done/b.totalStops)-(a.done/a.totalStops))[0];
  const drv=route?DRIVERS.find(x=>x.code===route.driver):null;
  const speed=route?28+Math.floor(Math.random()*27):0;
  const heading=rnd(['N','NE','E','SE','S','SO','O','NO']);
  const pingSec=Math.floor(Math.random()*11)+2;
  const battery=route?[62,78,45,91][active.indexOf(route)%4]:0;
  const bars=Math.floor(Math.random()*2)+3;
  const pos=route?routePos(route):null;
  return `<div class="head"><div><h1>${m.title} <span class="livebadge"><span class="dot"></span>${m.live}</span></h1><p>${m.sub}</p></div></div>
  <div class="river" style="margin-bottom:16px">
   <div class="node flow"><div class="ph">${ic('route')} ${m.activeRoutes}</div><div class="big">${active.length}</div></div><div class="pipe"></div>
   <div class="node flow"><div class="ph">${ic('pin')} ${m.stopsLeft}</div><div class="big">${stopsLeft}</div></div><div class="pipe"></div>
   <div class="node flow"><div class="ph">${ic('chart')} ${m.avgProgress}</div><div class="big">${avgPct}%</div></div><div class="pipe"></div>
   <div class="node m"><div class="ph">${ic('clock')} ${m.nextEta}</div><div class="big" style="font-size:19px">${nextDone?nextDone.eta:'\u2014'}</div></div>
  </div>
  <div class="cols" style="grid-template-columns:300px 1fr">
   <div class="panel"><div class="ph2">${ic('route')} ${m.activeRoutes} <span class="r">${activeShown.length}</span></div>
    <div class="qrow">${qbox('monitorq',MONITORQ,t('ui.mselSearch'),"setMonitorQ(this.value)")}</div>
    ${activeShown.length?activeShown.map(r=>{const pct=Math.round(100*r.done/r.totalStops);const dv=DRIVERS.find(x=>x.code===r.driver);
      return `<div class="routecard ${r.id===MONITOR_SEL?'on':''}" onclick="selectMonitorRoute('${r.id}')"><div class="rt"><div class="rr"><span class="ref">${r.id}</span><span class="dr">${r.driver}</span><span class="tag" style="margin-left:2px">${r.zone}</span><span class="pct" style="margin-left:auto">${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="meta" style="margin-top:5px">${dv?dv.name:''} \u00b7 ${m.ago?m.ago+' ':''}${Math.floor(Math.random()*11)+2}${m.secAbbr}</div></div></div>`}).join(''):`<div class="empty" style="min-height:200px"><div>${ic('route')}<p style="margin-top:8px">${m.noActive}</p></div></div>`}
   </div>
   <div class="panel">${route?`<div class="ph2">${ic('gps')} <span class="ref">${route.id}</span> \u00b7 ${drv?drv.name:route.driver} <span class="r">${route.zone} \u00b7 ${route.done}/${route.totalStops}</span></div>
     <div style="height:340px;position:relative;overflow:hidden">
       ${mapBackdrop()}
       <div style="position:absolute;top:10px;right:10px;z-index:5">${mapModeToggle()}</div>
       ${route.stops.map((p,i)=>{const approx=p[2]===2,done=i/(route.stops.length-1)<=route.done/route.totalStops;const col=approx?'var(--money-2)':(done?'var(--ok)':'var(--flow-2)');
         return `<div style="position:absolute;left:${p[0]}%;top:${p[1]}%;transform:translate(-50%,-100%);color:${col}">${approx?`<span style="display:block;width:18px;height:18px;border-radius:50%;border:2px dashed ${col};box-sizing:border-box"></span>`:ic('pin')}<span class="mono" style="position:absolute;top:${approx?'2px':'1px'};left:50%;transform:translateX(-50%);font-size:8px;color:${approx?col:'#fff'};font-weight:700">${i+1}</span></div>`}).join('')}
       <div class="livedot" style="position:absolute;left:${pos.x}%;top:${pos.y}%;transform:translate(-50%,-50%)"></div>
     </div>
     <div class="telemrow">
       <div class="telemcell"><span class="tl">${ic('gps')}${m.speed}</span><span class="tv">${speed} km/h</span></div>
       <div class="telemcell"><span class="tl">${ic('route')}${m.heading}</span><span class="tv">${heading}</span></div>
       <div class="telemcell"><span class="tl">${ic('signal')}${m.signal}</span><span class="tv">${'\u2588'.repeat(bars)}${'\u2591'.repeat(4-bars)}</span></div>
       <div class="telemcell"><span class="tl">${ic('battery')}${m.battery}</span><span class="tv">${battery}%</span></div>
     </div>
     <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line-2)">
       <span style="font-size:11.5px;color:var(--faint)">${m.lastPing} ${m.ago} ${pingSec}${m.secAbbr}</span>
       <label class="sw" style="margin-left:auto;margin-bottom:0"><input type="checkbox" ${MONITOR_FOLLOW?'checked':''} onchange="toggleFollow()"><span class="tk"></span>${m.follow}</label>
     </div>
     <div style="border-top:1px solid var(--line-2)"><div style="padding:10px 16px 4px;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em">${m.stopsTitle}</div>
      ${route.stops.map((p,i)=>{const fracDone=i/(route.stops.length-1)<=route.done/route.totalStops&&route.done>0;const isCurrent=Math.abs(i/(route.stops.length-1)-route.done/route.totalStops)<0.12&&!fracDone;
        const label=fracDone?m.doneAt:(isCurrent?m.current:m.waiting);const col=fracDone?'var(--ok)':(isCurrent?'var(--flow-2)':'var(--bg-2)');
        return `<div class="tlstop"><span class="tlseq" style="background:${col};color:${fracDone||isCurrent?'#fff':'var(--faint)'}">${i+1}</span><span style="font-size:12.5px;flex:1">${m.stopsTitle} ${i+1}</span><span class="chip ${fracDone?'s-deliv':(isCurrent?'s-route':'s-cap')}">${label}</span></div>`}).join('')}
     </div>`
     :`<div class="empty" style="min-height:400px"><div>${ic('gps')}<p style="margin-top:8px">${m.selectRoute}</p></div></div>`}</div>
  </div>`}

/* El principal se puede combinar con CUALQUIER dataset que tenga una relación muchos-a-uno conocida
   hacia él (pedido explícito de Luis) — no solo con uno. Por eso cada dataset trae aquí todas sus
   asociaciones reales, no solo la primera que se nos ocurrió: Productos y Movimientos, por ejemplo,
   llegan al cliente dueño encadenando por SKU → Producto.client, así que también se listan como
   combinables con Clientes. Clientes es la excepción a propósito: no tiene ninguna entrada como
   principal porque desde Clientes hacia Órdenes/Productos la relación es uno-a-muchos (un cliente
   con muchas órdenes), y eso multiplicaría filas — la misma regla ya documentada arriba. */
const DATASET_JOINS={
 ordenes:{clientes:(row)=>CLIENTS.find(c=>c.id===row.sender)},
 facturacion:{clientes:(row)=>CLIENTS.find(c=>c.id===row.client)},
 productos:{
  inventario:(row)=>({...row,avail:row.total-row.reserved,low:(row.total-row.reserved)<row.reorder}),
  clientes:(row)=>CLIENTS.find(c=>c.id===row.client),
 },
 inventario:{
  productos:(row)=>PRODUCTS.find(p=>p.sku===row.sku),
  clientes:(row)=>CLIENTS.find(c=>c.id===row.client),
 },
 movimientos:{
  productos:(row)=>PRODUCTS.find(p=>p.sku===row.sku),
  inventario:(row)=>{const p=PRODUCTS.find(x=>x.sku===row.sku);return p?{...p,avail:p.total-p.reserved,low:(p.total-p.reserved)<p.reorder}:null},
  clientes:(row)=>{const p=PRODUCTS.find(x=>x.sku===row.sku);return p?CLIENTS.find(c=>c.id===p.client):null},
 },
};
function datasetLabel(dsKey){const ds=DATASETS[dsKey];return ds?ds.label():dsKey}
function datasetFieldLabel(dsKey,fieldKey){const ds=DATASETS[dsKey];if(!ds)return fieldKey;const f=ds.fields.find(x=>x[0]===fieldKey);return f?f[1]():fieldKey}
function joinableSecondaries(primaryKey){return Object.keys(DATASET_JOINS[primaryKey]||{})}
function viewFmtCell(v){
 if(v==null||v==='')return '—';
 if(typeof v==='boolean')return v?(ds_es()?'Sí':'Yes'):'No';
 return String(v)}
/* arma las filas de una vista: cada fila trae la fila del dataset principal más un lookup por cada
   dataset secundario combinado (o null si esa fila principal no tiene relación) */
function viewBuildRows(def){
 const rows=(DATASETS[def.primary]?DATASETS[def.primary].source():[]);
 return rows.map(row=>{const sec={};
  (def.secondary||[]).forEach(sKey=>{const rule=(DATASET_JOINS[def.primary]||{})[sKey];sec[sKey]=rule?rule(row):null});
  return {_row:row,_sec:sec}})}
function viewCellValue(def,rowCtx,col){
 if(col.dataset===def.primary)return rowCtx._row[col.field];
 const sec=rowCtx._sec[col.dataset];return sec?sec[col.field]:null}
function viewRowMatchesQ(def,rowCtx,q){
 if(!q)return true;const ql=q.toLowerCase();
 return def.columns.some(col=>String(viewCellValue(def,rowCtx,col)||'').toLowerCase().includes(ql))}
/* ===== Filtros y agrupación (pedido explícito de Luis: "al crear las vistas debe haber opciones
   para filtrar y para agrupar") — un solo motor sencillo, deliberadamente acotado:
   - Filtros: una lista de condiciones que se combinan siempre con Y (no hay OR ni anidado — el DSL
     completo de FilterJson, ver módulo G, queda para el sistema real). Los operadores trabajan sobre
     el valor convertido a texto (contiene/es igual/es distinto) o a número (mayor/menor que) — no hay
     un tipo de dato formal por campo en el mock, así que la comparación numérica simplemente ignora
     la condición si alguno de los dos lados no es un número.
   - Agrupar: un solo campo de agrupación más una lista de agregados (cantidad/suma/promedio/mínimo/
     máximo) sobre cualquier campo disponible — igual de acotado que GroupJson/ReportChartType de
     ReportDefinition, sin sub-totales anidados ni múltiples niveles de agrupación. ===== */
function viewFilterMatch(def,rowCtx,filter){
 if(filter.value===''||filter.value==null)return true;
 const val=viewCellValue(def,rowCtx,filter);
 const sv=(val==null?'':String(val)).toLowerCase();
 const sq=String(filter.value).toLowerCase();
 switch(filter.op){
  case 'eq': return sv===sq;
  case 'neq': return sv!==sq;
  case 'gt': {const a=parseFloat(val),b=parseFloat(filter.value);return !isNaN(a)&&!isNaN(b)&&a>b}
  case 'lt': {const a=parseFloat(val),b=parseFloat(filter.value);return !isNaN(a)&&!isNaN(b)&&a<b}
  default: return sv.includes(sq); // 'contains'
 }}
function viewApplyFilters(def,rows){
 if(!def.filters||!def.filters.length)return rows;
 return rows.filter(r=>def.filters.every(f=>viewFilterMatch(def,r,f)))}
/* def.groupBy es un ARREGLO de {dataset,field} (pedido explícito de Luis: "los grupos pueden ser
   más de uno") — se agrupa por la combinación de todos los campos listados, no solo el primero. */
function viewGroupRows(def,rows){
 const groups=new Map();
 rows.forEach(r=>{
  const keyParts=(def.groupBy||[]).map(g=>{const v=viewCellValue(def,r,g);return (v==null||v==='')?'—':String(v)});
  const k=keyParts.join(' · ');
  if(!groups.has(k))groups.set(k,{keyParts,rows:[]});
  groups.get(k).rows.push(r)});
 return Array.from(groups.values())}
function viewAggregate(fn,values){
 const nums=values.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
 switch(fn){
  case 'sum': return nums.reduce((a,b)=>a+b,0);
  case 'avg': return nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length):0;
  case 'min': return nums.length?Math.min(...nums):'—';
  case 'max': return nums.length?Math.max(...nums):'—';
  default: return values.length; // 'count'
 }}
function viewAggFnLabel(fn){const m={count:{es:'Cantidad',en:'Count'},sum:{es:'Suma de',en:'Sum of'},avg:{es:'Promedio de',en:'Average of'},min:{es:'Mínimo de',en:'Min of'},max:{es:'Máximo de',en:'Max of'}};return (m[fn]||m.count)[ds_es()?'es':'en']}
function viewAggLabel(a){return a.fn==='count'?viewAggFnLabel('count'):`${viewAggFnLabel(a.fn)} ${datasetFieldLabel(a.dataset,a.field)}`}
function renderViewTableHtml(def,opts){opts=opts||{};const vw=t('views');
 /* El preview limitado (opts.limit, usado solo dentro del modal del constructor de vistas) no vive
    detrás de go() sino de un innerHTML directo sobre el modal — toggleViewSort() no lo repintaría,
    así que ahí los encabezados quedan sin click y sin ordenar; la tabla de resultados real (sin
    límite) sí es completamente interactiva. */
 const interactive=!opts.limit;
 const sTh=(idx,label,numeric)=>interactive?viewSortTh(idx,label,numeric):`<th class="${numeric?'n':''}">${label}</th>`;
 const sApply=(items,getVal)=>interactive?applyViewSort(items,getVal):items;
 let rows=opts.rows||viewBuildRows(def);
 rows=viewApplyFilters(def,rows);
 if(!opts.noFilter&&opts.q)rows=rows.filter(r=>viewRowMatchesQ(def,r,opts.q));
 if(def.groupBy&&def.groupBy.length){
  let groups=viewGroupRows(def,rows);
  if(opts.limit)groups=groups.slice(0,opts.limit);
  const aggs=def.aggregates||[];
  const groupCols=def.groupBy.length;
  /* fila de totales (pedido explícito: "deben tener una opción para totalizar el grupo") — mismos
     agregados pero calculados sobre TODAS las filas filtradas, no por grupo. */
  const totalRow=def.showTotal?`<tr style="font-weight:600;border-top:2px solid var(--line)"><td>${vw.totalLabel}</td>${Array(groupCols-1).fill('<td></td>').join('')}<td>${rows.length}</td>${aggs.map(a=>{const vals=rows.map(r=>viewCellValue(def,r,a));return `<td>${viewFmtCell(viewAggregate(a.fn,vals))}</td>`}).join('')}</tr>`:'';
  const sortedGroups=sApply(groups,(g,idx)=>idx<groupCols?g.keyParts[idx]:idx===groupCols?g.rows.length:viewAggregate(aggs[idx-groupCols-1].fn,g.rows.map(r=>viewCellValue(def,r,aggs[idx-groupCols-1]))));
  return `<div style="overflow:auto;${opts.maxHeight?('max-height:'+opts.maxHeight+';'):''}"><table class="lst densetbl"><thead><tr>${def.groupBy.map((g,i)=>sTh(i,datasetFieldLabel(g.dataset,g.field))).join('')}${sTh(groupCols,ds_es()?'Cantidad':'Count',1)}${aggs.map((a,i)=>sTh(groupCols+1+i,viewAggLabel(a),1)).join('')}</tr></thead><tbody>
   ${sortedGroups.length?sortedGroups.map(g=>`<tr>${g.keyParts.map(k=>`<td>${k.replace(/</g,'&lt;')}</td>`).join('')}<td>${g.rows.length}</td>${aggs.map(a=>{const vals=g.rows.map(r=>viewCellValue(def,r,a));return `<td>${viewFmtCell(viewAggregate(a.fn,vals))}</td>`}).join('')}</tr>`).join(''):`<tr><td colspan="${groupCols+1+aggs.length}" style="color:var(--faint);text-align:center;padding:16px">—</td></tr>`}
   ${totalRow}
  </tbody></table></div>`}
 if(opts.limit)rows=rows.slice(0,opts.limit);
 const sortedRows=sApply(rows,(r,idx)=>viewCellValue(def,r,def.columns[idx]));
 return `<div style="overflow:auto;${opts.maxHeight?('max-height:'+opts.maxHeight+';'):''}"><table class="lst densetbl"><thead><tr>${def.columns.map((col,i)=>sTh(i,datasetLabel(col.dataset)+' · '+datasetFieldLabel(col.dataset,col.field))).join('')}</tr></thead><tbody>
  ${sortedRows.length?sortedRows.map(r=>`<tr>${def.columns.map(col=>`<td>${viewFmtCell(viewCellValue(def,r,col)).toString().replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${def.columns.length}" style="color:var(--faint);text-align:center;padding:16px">—</td></tr>`}
 </tbody></table></div>`}
/* ===== RBAC: permisos, roles y usuarios (pedido explícito de Luis: "Ponle funcionalidad a la
   pantalla de usuarios y roles... lo primero que debe permitir trabajar son los roles. En esta
   pantalla tambien debe haber una manera de asignar los permisos ya sea al rol o al usuario").
   Reusa las categorías del menú lateral (NAV: ops/almacen/money/cat/ana/sys) como categoría de cada
   permiso, en vez de inventar una taxonomía nueva — mismo criterio ya aplicado a los módulos de
   Indicadores/Gráficos. No incluye la categoría 'portal' (son pantallas de cliente, no de personal
   interno con rol). Cada rol es una lista de llaves de `PERMISSIONS`; cada usuario tiene un rol y,
   opcionalmente, permisos extra concedidos directo a él (`extraPermissions`) por encima de lo que ya
   trae su rol — la distinción real entre "asignar al rol" (afecta a todos los que tengan ese rol) y
   "asignar al usuario" (una excepción puntual para una sola persona). */
const PERMISSIONS=[
 {key:'ordenes.view', cat:'ops'},
 {key:'ordenes.manage', cat:'ops'},

 {id:'VIEW-2', name:'Inventario bajo mínimo', primary:'inventario', secondary:['productos'], system:true, filters:[{dataset:'inventario',field:'low',op:'eq',value:'true'}], groupBy:[], aggregates:[], showTotal:false,

 {id:'VIEW-3', name:'Movimientos por tipo y producto', primary:'movimientos', secondary:['productos'], system:true, filters:[], groupBy:[{dataset:'movimientos',field:'type'},{dataset:'productos',field:'cat'}], aggregates:[{dataset:'movimientos',field:'qty',fn:'sum'}], showTotal:true,
  columns:[{dataset:'movimientos',field:'date'},{dataset:'movimientos',field:'time'},{dataset:'movimientos',field:'type'},{dataset:'movimientos',field:'sku'},{dataset:'movimientos',field:'qty'},{dataset:'productos',field:'cat'}]},
 {id:'VIEW-4', name:'Directorio de clientes', primary:'clientes', secondary:[], system:true, filters:[], groupBy:[], aggregates:[], showTotal:false,

/* Lista de campos disponibles para filtrar/agrupar/agregar en el constructor: los del dataset

function vbAvailableCols(vb){
 const keys=[vb.primary].concat(vb.secondary||[]);
 const out=[];
 keys.forEach(k=>{if(!DATASETS[k])return;DATASETS[k].fields.forEach(([fk,fl])=>out.push({dataset:k,field:fk,label:`${datasetLabel(k)} · ${fl()}`}))});

/* ===== Galería de Vistas como paneles colapsables (pedido explícito de Luis): cada panel ES una

function applyViewSort(items,getVal){if(VIEWSORT.idx==null)return items;return [...items].sort((a,b)=>{let va=getVal(a,VIEWSORT.idx),vb=getVal(b,VIEWSORT.idx);if(typeof va==='string')va=va.toLowerCase();if(typeof vb==='string')vb=vb.toLowerCase();return (va<vb?-1:va>vb?1:0)*VIEWSORT.dir})}

/* ===== Galería de Vistas como acordeón de paneles colapsables (pedido explícito de Luis): dos por

function viewDatasetPanelHtml(key){const vw=t('views');

/* ===== Indicadores — KPI de un solo número, definido y guardado por el usuario, sobre UNA fuente
   de datos (reusa el mismo motor de Vistas: DATASETS + viewApplyFilters/viewCellValue/viewAggregate).
   A propósito no combina fuentes secundarias como Vistas — un indicador es un solo valor agregado,
   no una tabla, así que no hace falta traer columnas de otra fuente. Mismas reglas de Vistas:
   informes por default no editables (`system:true`) y los creados por un usuario solo los edita o
   borra ese mismo usuario (`owner`), compartiendo el mismo selector "Viendo como". ===== */
let IND_SEQ=16;
/* INDICATOR_MODULES: la categoría "de pantalla" de un indicador sigue siendo su fuente de datos
   (mismo ícono/nombre de siempre, no se tocó la tarjeta) — pero para efecto de programación cada
   indicador también carga un `module`, uno de los tres módulos de negocio que Luis pidió analizar
   (entrega/almacén/contabilidad). Es una etiqueta de clasificación aparte del dataset a propósito:
   varios indicadores de la fuente "ordenes" son de Entrega (estatus de la orden) pero otros son de
   Contabilidad (el ciclo COD vive ahí también) — un mapeo 1:1 dataset→módulo no alcanzaría para
   distinguir esos casos, por eso el campo se guarda explícito en cada indicador sembrado. */
const INDICATOR_MODULES=['entrega','almacen','contabilidad'];
/* El nombre visible de cada módulo reusa EXACTAMENTE las mismas etiquetas que los grupos del menú
   lateral (t('g').ops/almacen/money — "Operación"/"Almacén"/"Contabilidad") en vez de inventar un
   nombre nuevo ("Entrega de órdenes"/"Almacenaje") — pedido implícito de Luis al pedir la
   agrupación explícita: que el nombre del grupo sea el mismo que ya usa el resto de la app, no una
   paráfrasis. Mismo criterio para el ícono: el mismo que ya lleva ese grupo en `NAV`. */
function indicatorModuleGroupKey(m){return {entrega:'ops',almacen:'almacen',contabilidad:'money'}[m]||'ops'}

   un selector de módulo — pedido explícito de Luis de no tocar la pantalla esta ronda). Es una

   (estatus/chofer de la orden), aunque un indicador de COD armado a mano sobre "ordenes" en realidad
   es de Contabilidad — ese matiz solo se resuelve a mano en los indicadores sembrados de abajo. */
function defaultModuleForDataset(ds){const map={ordenes:'entrega',clientes:'contabilidad',productos:'almacen',inventario:'almacen',movimientos:'almacen',facturacion:'contabilidad',liquidacion:'contabilidad',compras:'contabilidad'};return map[ds]||'entrega'}

/* Rango de fecha en Gráficos (pedido explícito de Luis: "Donde esta el filtro de fecha... en los
   gráficos?" — ver bitácora). Se reusan TAL CUAL las funciones que ya calculan esto para
   Indicadores (indicatorApplyDateRange/indicatorDateFieldFor/indicatorDateRangeCaption): las tres
   son genéricas sobre cualquier objeto con .dataset/.dateRangeMode/.dateFrom/.dateTo, no tienen nada
   específico de un indicador — mismo criterio de reuso ya documentado para INDICATOR_MODULES. */
function chartData(ch){
 let rows=(DATASETS[ch.dataset]?DATASETS[ch.dataset].source():[]);
 rows=indicatorApplyDateRange(ch,rows).map(row=>({_row:row,_sec:{}}));
 const filtered=viewApplyFilters({primary:ch.dataset,filters:ch.filters||[]},rows);
 const groups=viewGroupRows({primary:ch.dataset,groupBy:[ch.groupBy]},filtered);
 let out=groups.map(g=>({label:g.keyParts[0],value:viewAggregate(ch.metric.fn,g.rows.map(r=>viewCellValue({primary:ch.dataset},r,{dataset:ch.metric.dataset,field:ch.metric.field})))}));
 /* Línea = serie de tiempo: se ordena cronológicamente (las fechas ya son strings ISO, el orden de
    texto ya es el orden cronológico) y se limita a los últimos 30 puntos en vez de a los 8 valores
    más altos — para una tendencia, lo relevante es la ventana reciente, no el "top 8". Barra/dona
    siguen ordenando de mayor a menor y recortando a 8, como siempre. */
 if(ch.type==='line'){
  out=out.filter(d=>d.label!=null).sort((a,b)=>String(a.label)<String(b.label)?-1:String(a.label)>String(b.label)?1:0);
  if(out.length>30)out=out.slice(out.length-30);
 } else {
  out=out.sort((a,b)=>(typeof b.value==='number'?b.value:0)-(typeof a.value==='number'?a.value:0)).slice(0,8);
 }
 return out}

/* Cardinalidad de un campo (cuántos valores distintos trae en su fuente) — usada solo para sugerir
   un tipo de gráfico razonable al elegir el campo de agrupación en el constructor (no se usa en
   ningún cálculo de negocio). Fuentes del mock son chicas, así que un Set sobre todas las filas es
   barato; el sistema real, con volúmenes reales, debería hacer esto con un COUNT DISTINCT en SQL. */
function fieldCardinality(dataset,field){const rows=DATASETS[dataset]?DATASETS[dataset].source():[];return new Set(rows.map(r=>r[field])).size}
/* Sugerencia de tipo de gráfico (pedido explícito de Luis de explorar otros tipos, no solo barra —
   ver bitácora "Tipos de gráfico"): línea cuando se agrupa por el campo de fecha de actividad de la
   fuente (una serie de tiempo natural); dona cuando el campo agrupa en pocos valores distintos (2-6,
   el rango donde leer proporciones del total tiene sentido visualmente); barra en cualquier otro
   caso, incluyendo campos de alta cardinalidad (pueblo, chofer, cliente) donde comparar magnitudes
   es más legible que repartir una dona en muchas rebanadas finas. Es solo un default sugerido al
   cambiar de fuente o de campo — el usuario lo puede cambiar a mano en cualquier momento (`setCBType`)
   y esa elección manual se respeta hasta el próximo cambio de fuente/campo. */
function suggestChartType(dataset,field){
 if(indicatorDateFieldFor({dataset})===field)return 'line';
 const card=fieldCardinality(dataset,field);
 if(card>=2&&card<=6)return 'donut';
 return 'bar'}

   editar. `canEditChart` sigue siendo la única compuerta para nombre/fuente/agrupación/filtros. */
