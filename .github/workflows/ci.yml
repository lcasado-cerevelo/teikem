name: ci
on:
  push:
    branches: [ master, main, "claude/**" ]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Teikem_Dev_2026!"
          MSSQL_PID: "Developer"
        ports: [ "1433:1433" ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Teikem_Dev_2026!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore & build
        run: dotnet build Teikem.sln -c Release
      - name: Unit tests
        run: dotnet test Teikem.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: db-init (Identity → estructura → seed → extensiones → seeders)
        run: dotnet run --project src/Teikem.Api -c Release --no-build -- db-init
      - name: db-init de nuevo (idempotencia — rama 'ya existe' de DemoTenantSeeder, seeders por nombre, 0 permisos propagados)
        run: dotnet run --project src/Teikem.Api -c Release --no-build -- db-init
      - name: Smoke test contra el API
        run: |
          sudo apt-get install -y jq >/dev/null
          ASPNETCORE_URLS=http://localhost:5000 ASPNETCORE_ENVIRONMENT=Development dotnet run --project src/Teikem.Api -c Release --no-build &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/health && break; sleep 2; done
          # SMOKE_SQL: sqlcmd dentro del contenedor de SQL Server para los pasos que necesitan datos sin API todavía
          # (pings del chofer del Lote 7, que el monitor del Lote 5 ya lee). Sin esta variable el smoke omite esos pasos.
          export SMOKE_SQL="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Teikem_Dev_2026! -d Teikem -b -h -1 -Q"
          scripts/smoke.sh http://localhost:5000
      # Recorrido Playwright del frontend (Lote F1) contra el mismo API, que sigue arriba desde el paso anterior
      # (los procesos en segundo plano viven hasta el fin del job). Vite sirve la app en :5173 (CORS permitido en appsettings).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Recorrido Playwright del frontend (escritorio y móvil Pixel 7)
        working-directory: web-app
        env:
          API_URL: http://localhost:5000
        run: |
          curl -sf http://localhost:5000/health
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Evidencia del recorrido Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web-app/test-results
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Instalar y verificar (tipos generados, tsc, lint, vitest, build)
        working-directory: web-app
        run: |
          npm ci
          npm run check
