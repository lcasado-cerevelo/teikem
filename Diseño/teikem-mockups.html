<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teikem — Delivery Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1220; --bg-2:#0A0E18; --panel:#141B2E; --panel-2:#182136; --raise:#1F2A44;
  --line:#243252; --line-2:#1C2740;
  --text:#E8ECF5; --muted:#8C97AD; --faint:#5B6680;
  --money:#FF6A1A; --money-2:#FF8B4D; --money-bg:rgba(255,106,26,.13); --money-line:rgba(255,106,26,.35);
  --flow:#1F6FE5; --flow-2:#6EA8FF; --flow-bg:rgba(31,111,229,.14); --flow-line:rgba(31,111,229,.40);
  --ok:#46CE82; --okbg:rgba(70,206,130,.13); --warn:#E6A93E; --warnbg:rgba(230,169,62,.13);
  --danger:#F26A60; --dangerbg:rgba(242,106,96,.13); --info:#6293FF; --infobg:rgba(98,147,255,.13);
  --violet:#9A8CF8; --violetbg:rgba(154,140,248,.13);
  --neutral-fg:#9aa3b2; --neutral-bg:rgba(255,255,255,.06);
  --app-bg:radial-gradient(1200px 600px at 80% -10%,#14203A 0%,#0D1220 55%);
  --label-paper:#fff; --label-ink:#0B2C66;
  --hexd:#0B2C66; --hexl:#1F6FE5;
  --mono:'JetBrains Mono',ui-monospace,monospace; --ui:'Space Grotesk',system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#F0F2F7; --bg-2:#FAFBFD; --panel:#FFFFFF; --panel-2:#F2F5FA; --raise:#E5EAF3;
  --line:#DDE4F0; --line-2:#E9EDF5;
  --text:#182136; --muted:#5B6880; --faint:#8C97AD;
  --money:#E05A0F; --money-2:#B94A0C; --money-bg:rgba(224,90,15,.10); --money-line:rgba(224,90,15,.30);
  --flow:#1F6FE5; --flow-2:#0B4DB8; --flow-bg:rgba(31,111,229,.10); --flow-line:rgba(31,111,229,.30);
  --ok:#1E9457; --okbg:rgba(30,148,87,.12); --warn:#B5811F; --warnbg:rgba(181,129,31,.13);
  --danger:#CC4B41; --dangerbg:rgba(204,75,65,.12); --info:#3C6BE0; --infobg:rgba(60,107,224,.12);
  --violet:#6D5FE0; --violetbg:rgba(109,95,224,.12);
  --neutral-fg:#5B6880; --neutral-bg:rgba(0,0,0,.05);
  --app-bg:radial-gradient(1100px 560px at 82% -12%,#ffffff 0%,#F0F2F7 60%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--app-bg);color:var(--text);font-family:var(--ui);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
svg{width:16px;height:16px;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:var(--flow);color:#fff}

.app{display:grid;grid-template-columns:250px 1fr;height:100vh;transition:grid-template-columns .16s ease}
.app.col{grid-template-columns:66px 1fr}

/* ===== SIDEBAR ===== */
.rail{background:linear-gradient(180deg,var(--panel),var(--bg));border-right:1px solid var(--line-2);display:flex;flex-direction:column;overflow:hidden}
.rbrand{display:block;cursor:pointer;padding:16px 13px 14px;border-bottom:1px solid var(--line-2);background:linear-gradient(135deg,rgba(31,111,229,.14),transparent 65%)}
#brandfull{width:100%}
#brandfull svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 14px rgba(46,124,246,.4))}
#brandmini{display:none;width:44px;margin:0 auto}

.rnav{flex:1;overflow-y:auto;padding:6px 9px}
.grp{margin-bottom:1px}
.grp-h{display:flex;align-items:center;gap:11px;width:100%;padding:9px 9px;border:none;background:transparent;border-radius:9px;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.grp-h:hover{background:var(--panel-2);color:var(--text)}
.grp-h .gi{display:flex;color:var(--faint)}.grp-h .gi svg{width:16px;height:16px}
.grp-h .chev{margin-left:auto;transition:.16s;color:var(--faint)}.grp-h .chev svg{width:14px;height:14px}
.grp.open .grp-h .chev{transform:rotate(90deg)}
.grp.open .grp-h{color:var(--text)}.grp.open .grp-h .gi{color:var(--flow-2)}
.grp-items{display:none;padding:1px 0 5px}
.grp.open .grp-items{display:block}
.navit{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 13px;margin:1px 4px 1px 8px;border-radius:8px;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;position:relative}
.navit::before{content:"";position:absolute;left:-2px;top:8px;bottom:8px;width:2px;border-radius:2px;background:transparent}
.navit .di{width:5px;height:5px;border-radius:50%;background:var(--faint);flex:none;margin-left:2px}
.navit:hover{background:var(--panel-2)}
.navit.on{background:var(--flow-bg);color:var(--flow-2);font-weight:600}
.navit.on::before{background:var(--flow)} .navit.on .di{background:var(--flow)}
.rfoot{padding:9px;border-top:1px solid var(--line-2)}
.collapse{display:flex;align-items:center;gap:10px;width:100%;padding:9px;border:none;background:transparent;border-radius:9px;color:var(--muted);font-size:12.5px;font-weight:500}
.collapse:hover{background:var(--panel-2);color:var(--text)}
.collapse svg{transition:.16s}
.app.col .collapse svg{transform:rotate(180deg)}
.app.col #brandfull,.app.col .grp-h .lbl,.app.col .grp-h .chev,.app.col .navit span,.app.col .collapse span{display:none}
.app.col .grp-items{display:none!important}
.app.col .grp-h{justify-content:center;padding:11px}
.app.col .rbrand{padding:14px 0 12px}
.app.col #brandmini{display:block}
.app.col .navit{display:none}
.app.col .collapse{justify-content:center}

/* ===== MAIN ===== */
.main{display:flex;flex-direction:column;overflow:hidden}
.bar{height:54px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line-2);background:var(--panel);flex:none}
.cmd{display:flex;align-items:center;gap:9px;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;color:var(--muted);font-size:13px;min-width:300px}
.cmd:hover{border-color:var(--flow-line);color:var(--text)}
.cmd kbd{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.bar .sp{flex:1}
.live{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,206,130,.5)}70%{box-shadow:0 0 0 6px rgba(70,206,130,0)}100%{box-shadow:0 0 0 0 rgba(70,206,130,0)}}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.55)}70%{box-shadow:0 0 0 16px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
.livedot{width:16px;height:16px;border-radius:50%;background:var(--flow);border:3px solid #fff;animation:livepulse 1.7s infinite;transition:left 1.2s linear,top 1.2s linear}
.livebadge{display:inline-flex;align-items:center;gap:6px;background:var(--danger-bg,rgba(239,68,68,.12));color:var(--danger);border-radius:20px;padding:4px 11px 4px 8px;font-size:11px;font-weight:700;letter-spacing:.03em}
.livebadge .dot{background:var(--danger);animation:pulse2 1.4s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 6px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.telemrow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line-2)}
.telemcell{padding:12px 16px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px}
.telemcell:last-child{border-right:none}
.telemcell .tl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);display:flex;align-items:center;gap:5px}
.telemcell .tv{font-size:15px;font-weight:700;font-family:var(--mono)}
.tlstop{display:flex;align-items:center;gap:11px;padding:9px 16px;border-bottom:1px solid var(--line-2)}
.tlstop:last-child{border-bottom:none}
.tlseq{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:none;background:transparent;border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.seg button svg{width:14px;height:14px}
.langdd{position:relative}
.langdd>button{display:flex;align-items:center;gap:7px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.langdd>button:hover{border-color:var(--flow-line)}
.langdd .fl{font-size:15px;line-height:1}
.langdd .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);padding:5px;display:none;min-width:170px;z-index:40}
.langdd.open .menu{display:block}
.langdd .menu button{display:flex;align-items:center;gap:9px;width:100%;border:none;background:transparent;border-radius:7px;padding:8px 10px;font-size:13px;font-weight:500;text-align:left}
.langdd .menu button:hover{background:var(--panel-2)}
.langdd .menu button.on{background:var(--flow-bg);color:var(--flow-2);font-weight:600}
.who{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line-2)}
.who .av{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--flow),var(--money));display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff}
.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 90px;min-width:0}
.wrap{width:100%;max-width:1760px;margin:0}
@media(prefers-reduced-motion:reduce){.dot{animation:none}.pipe::after{animation:none!important}}

/* ===== HOME ===== */
.daymeta{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
.daymeta h1{font-size:23px;font-weight:700;letter-spacing:-.01em;margin:0}
.daymeta span{color:var(--muted);font-size:13px}
.subtle{color:var(--faint);font-size:12.5px;margin:0 0 20px}
.streamlabel{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:6px 2px 10px}
.streamlabel .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.streamlabel.money{color:var(--money)} .streamlabel.flow{color:var(--flow-2)}
.river{display:flex;align-items:stretch;margin-bottom:6px}
.node{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;transition:.14s;position:relative;min-width:0}
.node:hover{border-color:var(--flow-line);transform:translateY(-2px)}
.node.sel{border-color:var(--flow);box-shadow:0 0 0 1px var(--flow),0 12px 30px -14px rgba(31,111,229,.5)}
.node.m:hover{border-color:var(--money-line)}
.node.m.sel{border-color:var(--money);box-shadow:0 0 0 1px var(--money),0 12px 30px -14px rgba(255,106,26,.45)}
.node .ph{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.node .ph svg{width:13px;height:13px}
.node .big{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:7px;line-height:1}
.node .sub{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:5px}
.node.flow .big{color:var(--flow-2)} .node.m .big{color:var(--money-2)}
.node .spark{display:flex;gap:2px;align-items:flex-end;height:20px;margin-top:9px}
.node .spark i{flex:1;border-radius:1px;min-height:3px;background:var(--line)}
.node.flow .spark i{background:var(--flow-line)} .node.m .spark i{background:var(--money-line)}
.pipe{width:30px;flex:none;align-self:center;height:3px;border-radius:3px;position:relative;overflow:hidden;background:var(--line)}
.pipe::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--flow) 0 8px,transparent 8px 16px);opacity:.75;animation:flowR 1s linear infinite}
.pipe.m::after{background:repeating-linear-gradient(90deg,var(--money) 0 8px,transparent 8px 16px);animation:flowL 1.1s linear infinite}
@keyframes flowR{to{transform:translateX(16px)}} @keyframes flowL{to{transform:translateX(-16px)}}

.inbox{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-top:22px;overflow:hidden}
.inbox .ih{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2);font-weight:600}
.inbox .ih .ct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.work{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.work:last-child{border-bottom:none}.work:hover{background:var(--panel-2)}
.work .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.work .tx{flex:1;min-width:0}.work .tx b{font-weight:600;font-size:13.5px}.work .tx p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.tone-danger .ico{background:var(--dangerbg);color:var(--danger)}
.tone-warn .ico{background:var(--warnbg);color:var(--warn)}
.tone-money .ico{background:var(--money-bg);color:var(--money)}
.tone-flow .ico{background:var(--flow-bg);color:var(--flow-2)}

/* radar */
.radar{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-top:16px;overflow:hidden}
.radar .rh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2);font-weight:600;flex-wrap:wrap}
.radar .rh svg{color:var(--flow-2)}
.radar .rh .r{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.radar .search{display:flex;align-items:center;gap:10px;margin:14px 16px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:2px 4px 2px 13px}
.radar .search svg{color:var(--faint)}
.radar .search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;padding:10px 0}
.radar .search:focus-within{border-color:var(--flow);box-shadow:0 0 0 3px var(--flow-bg)}
.gchips{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 8px}
.gchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg-2);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text)}
.gchip:hover{border-color:var(--flow-line)}
.gchip b{font-family:var(--mono);color:var(--flow-2)}
.gchip.money b{color:var(--money-2)}
.gtoggle{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:2px;margin-left:auto}
.gtoggle button{border:none;background:transparent;border-radius:6px;padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.gtoggle button.on{background:var(--panel);color:var(--text)}
.rres{border-top:1px solid var(--line-2)}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.rrow:last-child{border-bottom:none}
.rrow:hover,.rrow:focus{background:var(--panel-2);outline:none}
.rrow .meta{color:var(--muted);font-size:12.5px}
.rfoot{display:flex;justify-content:center;padding:11px}
.rowbtn{border:none;background:transparent;color:var(--faint);width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;margin-left:auto;flex:none}
.rowbtn:hover{background:var(--flow-bg);color:var(--flow-2)}

.head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.head h1{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0}
.head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--panel-2)}
.btn svg{width:15px;height:15px}
.btn.flow{background:var(--flow);border-color:var(--flow);color:#fff}.btn.flow:hover{background:var(--flow-2);color:#0B2C66}
.btn.money{background:var(--money);border-color:var(--money);color:#fff}.btn.money:hover{background:var(--money-2)}
.btn.sm{padding:6px 10px;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;min-width:0}
.panel .ph2{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line-2);font-weight:600;font-size:14px}
.panel .ph2 .r{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px;font-family:var(--mono)}
.panel .ph2 svg{width:16px;height:16px;color:var(--flow-2)}
.pb,.panel .pb{padding:16px}
.cols{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;line-height:1.6;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-cap{color:var(--neutral-fg);background:var(--neutral-bg)}
.s-wh{color:var(--violet);background:var(--violetbg)}
.s-disp{color:var(--info);background:var(--infobg)}
.s-route{color:var(--flow-2);background:var(--flow-bg)}
.s-deliv{color:var(--ok);background:var(--okbg)}
.s-cod{color:var(--money-2);background:var(--money-bg)}
.s-fail{color:var(--danger);background:var(--dangerbg)}
.lst{width:100%;border-collapse:collapse;font-size:13px}
.lst th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--panel)}
.lst th.sort{cursor:pointer;user-select:none}
.lst th.sort:hover{color:var(--flow-2)}
.lst th .arr{font-size:9px;margin-left:4px;color:var(--flow-2)}
.lst td{padding:8px 6px;border-bottom:1px solid var(--line-2);overflow-wrap:anywhere;word-break:break-word}
.lst tbody tr{cursor:pointer}
.lst tbody tr:hover td,.lst tbody tr:focus td{background:var(--panel-2)}
.lst tbody tr:focus{outline:none}
.lst td.n,.lst th.n{text-align:right;font-family:var(--mono)}
.lst td.n{white-space:nowrap}
.facttbl td,.facttbl th,.densetbl td,.densetbl th{padding:6px 3px}
.ref{font-family:var(--mono);color:var(--flow-2)}
.cash{font-family:var(--mono);font-weight:600;color:var(--money-2)}
.cash.z{color:var(--faint);font-weight:400}
.dr{font-family:var(--mono);font-size:12px;background:var(--raise);border-radius:5px;padding:1px 7px;color:var(--muted)}
.f{margin-bottom:13px}.f label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;color:var(--text);outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--flow);box-shadow:0 0 0 3px var(--flow-bg)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.sw{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
.sw input{display:none}.sw .tk{width:38px;height:22px;border-radius:20px;background:var(--raise);position:relative;transition:.15s}
.sw .tk::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#cfd6e0;top:2px;left:2px;transition:.15s}
.sw input:checked+.tk{background:var(--ok)}.sw input:checked+.tk::after{left:18px;background:#fff}
.filters{display:grid;grid-template-columns:repeat(8,1fr) auto;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:14px;align-items:end}
.filters .f{margin:0}
.filters .f input,.filters .f select{padding:7px 9px;font-size:12.5px}
@media(max-width:1100px){.filters{grid-template-columns:repeat(4,1fr)}}

function msel(id, options, selected, onchange, allLabel){
  const sel = new Set(selected||[]);
  const label = ()=> sel.size===0 ? allLabel : (sel.size===1 ? [...sel][0] : sel.size+' '+t('ui.selected'));
  window['__msel_'+id] = {sel, onchange, allLabel, options};
  const items = mselItemsHtml(id, options, sel);
  return `<div class="msel" id="msel-${id}">
    <button type="button" onclick="mselOpen('${id}')"><span data-ic="chevD" style="width:12px;height:12px"></span><span id="msel-lbl-${id}">${label()}</span>${sel.size?`<span class="cnt">${sel.size}</span>`:''}</button>
    <div class="mp">
      <div class="msearch">${ic('search')}<input type="text" placeholder="${t('ui.mselSearch')}" oninput="mselFilter('${id}',this.value)" onclick="event.stopPropagation()"></div>
      <div class="milist" id="mlist-${id}">${items}</div>
      <div class="mf"><button onclick="mselAll('${id}')">${t('ui.selAll')}</button><button onclick="mselClear('${id}')">${t('ui.selClear')}</button></div>
    </div>
  </div>`;
}
function mselItemsHtml(id, options, sel){
  return options.map(o=>`<label class="mi"><span class="mck ${sel.has(o)?'on':''}" onclick="event.stopPropagation();mselToggle('${id}','${o.replace(/'/g,"\\'")}')">${ic('check')}</span><span onclick="event.stopPropagation();mselToggle('${id}','${o.replace(/'/g,"\\'")}')">${o}</span></label>`).join('') || `<div class="mnone">${t('ui.mselNone')}</div>`;
}
window.mselOpen=id=>{document.querySelectorAll('.msel.open').forEach(m=>{if(m.id!=='msel-'+id)m.classList.remove('open')});
  const el=document.getElementById('msel-'+id);const willOpen=!el.classList.contains('open');
  el.classList.toggle('open');
  if(willOpen){const inp=el.querySelector('.msearch input');if(inp){inp.value='';setTimeout(()=>inp.focus(),20)}}};
window.mselToggle=(id,val)=>{const st=window['__msel_'+id];if(st.sel.has(val))st.sel.delete(val);else st.sel.add(val);mselRefresh(id)};
window.mselAll=id=>{const st=window['__msel_'+id];const visible=[...document.querySelectorAll('#mlist-'+id+' .mi span:last-child')].map(x=>x.textContent);visible.forEach(v=>st.sel.add(v));mselRefresh(id)};
window.mselClear=id=>{const st=window['__msel_'+id];st.sel.clear();mselRefresh(id)};
window.mselFilter=(id,q)=>{const st=window['__msel_'+id];q=q.toLowerCase();
  const filtered=st.options.filter(o=>o.toLowerCase().includes(q));
  document.getElementById('mlist-'+id).innerHTML=mselItemsHtml(id,filtered,st.sel)};
function mselRefresh(id){const st=window['__msel_'+id];
  document.querySelectorAll('#mlist-'+id+' .mi').forEach(mi=>{const v=mi.querySelector('span:last-child').textContent;mi.querySelector('.mck').classList.toggle('on',st.sel.has(v))});
  const lbl=document.getElementById('msel-lbl-'+id);const btn=document.querySelector('#msel-'+id+' > button');
  const cntEl=btn.querySelector('.cnt');if(cntEl)cntEl.remove();
  if(st.sel.size){const c=document.createElement('span');c.className='cnt';c.textContent=st.sel.size;btn.appendChild(c)}
  lbl.textContent = st.sel.size===0? st.allLabel : (st.sel.size===1?[...st.sel][0]:st.sel.size+' '+t('ui.selected'));
  st.onchange([...st.sel])}

function cacItemsHtml(q){q=(q||'').trim().toLowerCase();

window.cacSelect=(ev,consId)=>{const panel=ev.target.closest('.cac-panel');const id=panel.dataset.forId;const reg=window['__cac_'+id];const c=CONSIGNEES.find(x=>x.id===consId);
  if(!c||!reg)return;reg.justSelected=true;

window.cacBlur=(id)=>{setTimeout(()=>{const reg=window['__cac_'+id];if(!reg)return;
  const panel=document.getElementById('cac-panel-'+id);if(panel)panel.classList.remove('open');
  if(reg.justSelected){reg.justSelected=false;return}

 },160)};

function speak(kind){if(!VOICE_ON||!window.speechSynthesis)return;
 const words={es:{found:'S\u00ed',notfound:'No',dup:'Ya'},en:{found:'Yes',notfound:'No',dup:'Already'}};
 const text=(words[LANG]||words.es)[kind];if(!text)return;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=LANG==='es'?'es-PR':'en-US';u.rate=1.05;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
window.doScan=()=>{const inp=document.getElementById('scanin');const v=(inp.value||'').trim();
 const fp=PEND.filter(matchSF);
 if(!v){if(fp.length===0)return;
   const item=fp[0];PEND.splice(PEND.indexOf(item),1);
   item.tm=new Date().toLocaleTimeString(LANG==='es'?'es-PR':'en-US',{hour:'numeric',minute:'2-digit'});
   if(SCANMODE==='out'){const order=ORDERS.find(x=>x.inv===item.ref);const zone=item.route&&item.route!=='\u2014'?item.route:null;
     const openRoute=zone?ROUTES_TODAY.find(r=>r.zone===zone&&r.status!=='completed'):null;
     if(order&&openRoute){order.routeId=openRoute.id;openRoute.totalStops++;item.assigned=openRoute.id}}
   FEED.unshift(item);speak('found');refreshScan();inp.focus();return}
 if(FEED.find(f=>f.ref===v)){speak('dup');inp.value='';inp.focus();return}
 const hit=fp.find(x=>x.ref===v);
 if(!hit){speak('notfound');inp.focus();return}
 PEND.splice(PEND.indexOf(hit),1);
 hit.tm=new Date().toLocaleTimeString(LANG==='es'?'es-PR':'en-US',{hour:'numeric',minute:'2-digit'});
 if(SCANMODE==='out'){const order=ORDERS.find(x=>x.inv===hit.ref);const zone=hit.route&&hit.route!=='\u2014'?hit.route:null;
   const openRoute=zone?ROUTES_TODAY.find(r=>r.zone===zone&&r.status!=='completed'):null;
   if(order&&openRoute){order.routeId=openRoute.id;openRoute.totalStops++;hit.assigned=openRoute.id}}
 FEED.unshift(hit);inp.value='';speak('found');
 refreshScan();
 inp.focus()};

 run.days.forEach(d=>d.lines.forEach(l=>{const svc=svcLabel(l.svc);
   add(svc+'|'+l.pkg+'|item', svc+' · '+l.pkg+' — '+(es?'pieza base':'base piece'), 1, l.priceItem);

/* ===== TARIFAS DE CHOFERES (maestro) + LIQUIDACIÓN =====
   Modelo abierto por diseño: ATTEMPT_TIERS no está limitado a 2 — "+ Agregar intento" añade
   más niveles en vivo. La fórmula que combina "pago por entrega" con "pago por intento" es
   configurable por tenant (PAYOUT_FORMULA), no una regla fija en el código. */
let PAYOUT_FORMULA = 'stack'; // 'stack' | 'extra' | 'fail' — ver drv.f_stack / f_extra / f_fail
let ATTEMPT_TIERS = [1, 2]; // niveles de intento configurados; abierto, no capado a 2
const DRIVER_RATES = {
 '010': {perDelivery:6.00, attempts:{1:0, 2:3.00}, trips:[{label:'Vagón del muelle',amount:75.00},{label:'Traslado especial',amount:50.00}], active:true},
 '001': {perDelivery:5.50, attempts:{1:0, 2:2.50}, trips:[{label:'Vagón del muelle',amount:70.00}], active:true},
 '814': {perDelivery:6.00, attempts:{1:0, 2:3.00}, trips:[], active:true},
 '823': {perDelivery:5.00, attempts:{1:0, 2:2.00}, trips:[], active:true},
};
function driverTripRateFor(code,label){const r=DRIVER_RATES[code];if(!r)return 0;const tr=r.trips.find(x=>x.label===label);return tr?tr.amount:0}
function attemptRate(driverRate,n){
 if(driverRate.attempts[n]!=null) return driverRate.attempts[n];
 const keys=Object.keys(driverRate.attempts).map(Number).filter(k=>k<=n);
 if(!keys.length) return 0;
 return driverRate.attempts[Math.max(...keys)];
}
function computeAttemptPay(driverRate,attempts,formula){
 const es=LANG==='es';
 const sorted=[...attempts].sort((a,b)=>a.n-b.n);
 const delivered=sorted.some(a=>a.outcome==='entregada');
 const breakdown=[];
 const iLabel=n=>(es?'Intento ':'Attempt ')+n;
 const dLabel=es?'Entrega':'Delivery';
 if(formula==='extra'){
   sorted.forEach(a=>{if(a.n>=2) breakdown.push({label:iLabel(a.n), amount:attemptRate(driverRate,a.n)})});
   if(delivered) breakdown.push({label:dLabel+(es?' (incl. 1er intento)':' (incl. 1st attempt)'), amount:driverRate.perDelivery});
 } else if(formula==='fail'){
   sorted.forEach(a=>{
     if(a.outcome==='entregada') breakdown.push({label:dLabel+' ('+iLabel(a.n).toLowerCase()+')', amount:driverRate.perDelivery});
     else breakdown.push({label:iLabel(a.n)+(es?' (fallido)':' (failed)'), amount:attemptRate(driverRate,a.n)});
   });
 } else { // 'stack'
   sorted.forEach(a=>breakdown.push({label:iLabel(a.n), amount:attemptRate(driverRate,a.n)}));
   if(delivered) breakdown.push({label:dLabel, amount:driverRate.perDelivery});
 }
 return {breakdown, delivered};
}

/* Bitácora de intentos de entrega (DeliveryAttempt) — se genera a partir de las órdenes ya
   sembradas: fuente de verdad para pagarle al chofer y, más adelante, para un cargo opcional
   por intento al facturar al cliente (ver nota en Tarifas de choferes). */
const DELIVERY_ATTEMPTS=[];
(function(){
 const failReasons=['Nadie en la dirección','Negocio cerrado','Dirección incompleta','Rechazado por el cliente'];
 let forcedTriple=false;
 ORDERS.forEach(o=>{
   if(!DRIVER_RATES[o.dr]) return; // sin chofer real asignado con maestro de tarifas
   if(o.st==='deliv'){
     if(!forcedTriple){ // al menos un ejemplo con 3 intentos, para demostrar que no está limitado a 2
       forcedTriple=true;
       DELIVERY_ATTEMPTS.push({order:o.inv,n:1,driver:o.dr,date:o.date,outcome:'fallida',reason:rnd(failReasons)});
       DELIVERY_ATTEMPTS.push({order:o.inv,n:2,driver:o.dr,date:o.date,outcome:'fallida',reason:rnd(failReasons)});
       DELIVERY_ATTEMPTS.push({order:o.inv,n:3,driver:o.dr,date:o.date,outcome:'entregada',reason:null});
       return;
     }
     if(Math.random()<0.22){
       DELIVERY_ATTEMPTS.push({order:o.inv,n:1,driver:o.dr,date:o.date,outcome:'fallida',reason:rnd(failReasons)});
       DELIVERY_ATTEMPTS.push({order:o.inv,n:2,driver:o.dr,date:o.date,outcome:'entregada',reason:null});
     } else {
       DELIVERY_ATTEMPTS.push({order:o.inv,n:1,driver:o.dr,date:o.date,outcome:'entregada',reason:null});
     }
   } else if(o.st==='fail'){
     const n=Math.random()<0.5?1:2;
     for(let i=1;i<=n;i++) DELIVERY_ATTEMPTS.push({order:o.inv,n:i,driver:o.dr,date:o.date,outcome:'fallida',reason:rnd(failReasons)});
   }
 });
})();

/* ===== LIQUIDACIÓN A CHOFERES ===== */
let SETTLE_SEQ=100;
let SETTLERUNS=[];
let SETTLESEL=null;
function settleLineTotal(l){return l.type==='viaje'?(l.amount+l.adj):(l.breakdown.reduce((s,b)=>s+b.amount,0)+l.adj)}
function settleRunTotals(run){
 let entregaCount=0,attemptsCount=0,viajesCount=0,subEntrega=0,subViajes=0,adjTot=0;
 run.days.forEach(d=>d.lines.forEach(l=>{const lt=settleLineTotal(l);adjTot+=l.adj;
   if(l.type==='viaje'){viajesCount++;subViajes+=lt} else {entregaCount++;attemptsCount+=l.attemptsN;subEntrega+=lt}}));
 return {entregaCount,attemptsCount,viajesCount,subEntrega,subViajes,adjTot,total:subEntrega+subViajes};
}
window.selectSettleRun=(id)=>{SETTLESEL=id;go('liquidacion',true)};
window.generateSettleRun=()=>{
 const driver=document.getElementById('nsDriver').value;
 const from=document.getElementById('nsFrom').value, to=document.getElementById('nsTo').value;
 if(!driver||!from||!to){toast(t('settle.fillFields'));return}
 const rate=DRIVER_RATES[driver];
 const ordersMap={};
 DELIVERY_ATTEMPTS.filter(a=>a.driver===driver&&a.date>=from&&a.date<=to).forEach(a=>{(ordersMap[a.order]=ordersMap[a.order]||[]).push(a)});
 const entregaLines=Object.keys(ordersMap).map(inv=>{
   const attempts=ordersMap[inv].sort((a,b)=>a.n-b.n);
   const order=ORDERS.find(o=>o.inv===inv);
   const {breakdown}=computeAttemptPay(rate,attempts,PAYOUT_FORMULA);
   return {type:'entrega',date:attempts[0].date,ref:inv,cons:order?order.cons:inv,city:order?order.town:'',attemptsN:attempts.length,breakdown,adj:0};
 });
 const tripLines=DRIVER_TRIPS.filter(tr=>tr.driver===driver&&tr.date>=from&&tr.date<=to).map(tr=>({type:'viaje',date:tr.date,ref:tr.id,desc:tr.desc,label:tr.label,amount:tr.amount,adj:0}));
 const allLines=[...entregaLines,...tripLines];
 if(!allLines.length){toast(t('settle.noItems'));return}
 const byDate={};allLines.forEach(l=>{(byDate[l.date]=byDate[l.date]||[]).push(l)});
 const days=Object.keys(byDate).sort().map(date=>({date,lines:byDate[date]}));
 SETTLE_SEQ++;const run={id:'LQ-2026-'+SETTLE_SEQ,driver,from,to,status:'generada',genDate:TODAY,formula:PAYOUT_FORMULA,days};
 SETTLERUNS.unshift(run);SETTLESEL=run.id;
 toast(t('settle.generated')+': '+run.id);
 go('liquidacion',true)};
window.markReviewedSettle=(id)=>{const r=SETTLERUNS.find(x=>x.id===id);if(r&&r.status==='generada'){r.status='revisada';go('liquidacion',true)}};
window.approveSettleRun=(id)=>{const r=SETTLERUNS.find(x=>x.id===id);if(r&&r.status==='revisada'){r.status='aprobada';go('liquidacion',true)}};
window.setSettleAdj=(runId,dayIdx,lineIdx,val)=>{const run=SETTLERUNS.find(r=>r.id===runId);
 if(!run||(run.status!=='generada'&&run.status!=='revisada'))return;
 const line=run.days[dayIdx].lines[lineIdx];
 line.adj=parseFloat(val)||0;
 const setTxt=(id,txt)=>{const el=document.getElementById(id);if(el)el.textContent=txt};
 setTxt('slt-'+runId+'-'+dayIdx+'-'+lineIdx,'$'+money(settleLineTotal(line)));
 const dayTotal=run.days[dayIdx].lines.reduce((s,l)=>s+settleLineTotal(l),0);
 setTxt('sds-'+runId+'-'+dayIdx,'$'+money(dayTotal));
 const tot=settleRunTotals(run);
 setTxt('settletot-'+runId,'$'+money(tot.total));
 setTxt('settlesum-entregas-'+runId,'$'+money(tot.subEntrega));
 setTxt('settlesum-viajes-'+runId,'$'+money(tot.subViajes));
};
window.openSettleDoc=(id)=>{const run=SETTLERUNS.find(x=>x.id===id);if(!run)return;const es=LANG==='es';

function applySort(screen,rows,defaultKey){const s=SORTS[screen];const k=s.k||defaultKey;const dir=s.k?s.dir:1;
 return [...rows].sort((a,b)=>{let va=a[k],vb=b[k];if(typeof va==='string')va=va.toLowerCase();if(typeof vb==='string')vb=vb.toLowerCase();return (va<vb?-1:va>vb?1:0)*dir})}

 return `<th class="sort ${numeric?'n':''}" onclick="toggleSort('${screen}','${key}')">${label}${s.k===key?`<span class="arr">${s.dir>0?'\u25b2':'\u25bc'}</span>`:''}</th>`}

function paginate(arr, key){const st=PAGES[key];
  if(st.size==='all') return {rows:arr, total:arr.length, page:1, pages:1};
  const total=arr.length, pages=Math.max(1,Math.ceil(total/st.size));
  st.page=Math.min(Math.max(1,st.page),pages);
  const startI=(st.page-1)*st.size;
  return {rows:arr.slice(startI,startI+st.size), total, page:st.page, pages}}
function pagerHtml(key, total, page, pages){const st=PAGES[key];

 const typeOptions=Object.keys(MOV_TYPES).map(movTypeLabel);
 const binOpts=[...new Set(MOVEMENTS.map(m=>m.bin))].sort();
 const rows = MOVEMENTS
   .filter(m=>{const p=PRODUCTS.find(x=>x.sku===m.sku);return (!LF.type.length||LF.type.includes(movTypeLabel(m.type)))

 });

let CCSEL = CYCLE.length?CYCLE[0].id:null;
window.selectCount=id=>{CCSEL=id;go('conteo',true)};
window.setCounted=(idx,val)=>{const c=CYCLE.find(x=>x.id===CCSEL);if(!c)return;c.lines[idx].counted=parseInt(val)||0;
  const el=document.getElementById('ccvar-'+idx);if(el){const d=c.lines[idx].counted-c.lines[idx].expected;el.textContent=(d>0?'+':'')+d;el.style.color=d===0?'var(--muted)':'var(--danger)'}};
window.confirmCount=()=>{const c=CYCLE.find(x=>x.id===CCSEL);if(!c||c.status==='done')return;
 let adj=0;
 c.lines.forEach(l=>{const d=l.counted-l.expected;if(d!==0){adj++;
   MOVEMENTS.unshift({id:'TXN-'+(9500+MOVEMENTS.length),date:TODAY,time:'—',type:'ADJUST',sku:l.sku,name:l.name,qty:d,bin:c.bin,lot:'—',ref:c.id,user:'Conteo'});
   INV_ADJUSTMENTS.unshift({date:TODAY,sku:l.sku,name:l.name,delta:d,reason:(LANG==='es'?'Conteo cíclico ':'Cycle count ')+c.id,source:c.id});
   const p=PRODUCTS.find(x=>x.sku===l.sku);if(p)p.total+=d;
 }});
 c.status='done';
 toast((LANG==='es'?'Conteo ':'Count ')+c.id+' — '+(adj?adj+(LANG==='es'?' ajuste(s) al ledger':' adjustment(s) to ledger'):(LANG==='es'?'sin varianza':'no variance')));
 go('conteo',true)};

let CCF={wh:[],bin:[],product:[],cat:[]};window.setCCF=(k,v)=>{CCF[k]=v;go('conteo',true)};
function conteo(){const es=LANG==='es';
 const sel = CYCLE.find(x=>x.id===CCSEL);
 const stcls2={pending:'s-cap',done:'s-deliv'};
 const stlbl=s=>s==='done'?(es?'Ajustado':'Adjusted'):(es?'Pendiente':'Pending');
 const ccBinOpts=[...new Set(CYCLE.map(c=>c.bin))];
 const ccList=CYCLE.filter(c=>(!CCF.wh.length||CCF.wh.includes(whOfBin(c.bin)))&&(!CCF.bin.length||CCF.bin.includes(c.bin))&&(!CCF.product.length||c.lines.some(l=>{const p=PRODUCTS.find(x=>x.sku===l.sku);return p&&CCF.product.includes(productLabel(p))}))&&(!CCF.cat.length||c.lines.some(l=>{const p=PRODUCTS.find(x=>x.sku===l.sku);return p&&CCF.cat.includes(p.cat)})));
 return `<div class="head"><div><h1>${t('nav.conteo')[0]}</h1><p>${t('nav.conteo')[1]}</p></div>
   <div class="act"><span class="tag">${es?'Modo: informado':'Mode: informed'}</span></div></div>
  <div class="note" style="margin-bottom:14px">${ic('clip')} ${es?'Conteo informado: el operador ve la cantidad esperada mientras cuenta. La varianza se calcula al vuelo y, al confirmar, la diferencia se registra como ajuste en el ledger (InventoryTransaction) — nada se ajusta fuera de él.':'Informed count: the operator sees the expected quantity while counting. Variance is computed on the fly and, on confirm, the difference is written as an adjustment to the ledger (InventoryTransaction) — nothing is adjusted outside it.'}</div>
  <div class="filters" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
   <div class="f"><label>${es?'Almacén':'Warehouse'}</label>${msel('ccfwh',WAREHOUSES.map(w=>w.name),CCF.wh,v=>setCCF('wh',v),t('entry.f.all'))}</div>
   <div class="f"><label>${es?'Ubicación':'Location'}</label>${msel('ccfbin',ccBinOpts,CCF.bin,v=>setCCF('bin',v),t('entry.f.all'))}</div>
   <div class="f"><label>${es?'Producto':'Product'}</label>${msel('ccfprod',productOptions(),CCF.product,v=>setCCF('product',v),t('entry.f.all'))}</div>
   <div class="f"><label>${es?'Categoría':'Category'}</label>${msel('ccfcat',PRODCATS,CCF.cat,v=>setCCF('cat',v),t('entry.f.all'))}</div>
   <button class="btn sm" style="justify-self:start" onclick="CCF={wh:[],bin:[],product:[],cat:[]};go('conteo',true)">${t('entry.f.clear')}</button>
  </div>
  <div class="cols" style="grid-template-columns:320px 1fr">
   <div class="panel"><div class="ph2">${ic('clip')} ${es?'Tareas de conteo':'Count tasks'} <span class="r">${ccList.length}</span></div>
    <div style="max-height:460px;overflow:auto">${ccList.map(c=>{const varc=c.status==='done'?c.lines.reduce((s,l)=>s+Math.abs(l.counted-l.expected),0):null;
      return `<div class="unrow" style="cursor:pointer;${c.id===CCSEL?'background:var(--flow-bg)':''}" onclick="selectCount('${c.id}')"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><span class="ref">${c.bin}</span><span class="chip ${stcls2[c.status]}" style="margin-left:auto">${stlbl(c.status)}</span></div><div class="meta">${c.id} · ${es?'Zona':'Zone'} ${c.zone} · ${c.lines.length} ${es?'productos':'items'}${varc!=null?' · '+(es?'var ':'var ')+varc:''}</div></div></div>`}).join('')}</div></div>
   <div class="panel">${sel?`<div class="ph2">${ic('clip')} ${es?'Conteo':'Count'} · <span class="ref">${sel.bin}</span> <span class="r">${sel.id}</span></div>
    <div style="overflow:auto;max-height:360px"><table class="lst"><thead><tr><th>SKU</th><th>${es?'Producto':'Product'}</th><th class="n">${es?'Esperado':'Expected'}</th><th class="n">${es?'Contado':'Counted'}</th><th class="n">${es?'Varianza':'Variance'}</th></tr></thead><tbody>
    ${sel.lines.map((l,i)=>{const d=l.counted-l.expected;return `<tr><td><span class="ref">${l.sku}</span></td><td>${l.name}</td><td class="n mono">${l.expected}</td><td class="n"><input class="mono" style="width:74px;text-align:right;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;color:var(--text)" value="${l.counted}" ${sel.status==='done'?'disabled':''} oninput="setCounted(${i},this.value)"></td><td class="n mono" id="ccvar-${i}" style="color:${d===0?'var(--muted)':'var(--danger)'}">${d>0?'+':''}${d}</td></tr>`}).join('')}
    </tbody></table></div>
    ${sel.status==='done'?`<div class="note" style="margin:14px 16px;border-color:var(--money-line);color:var(--money-2)">${ic('check')} ${es?'Conteo cerrado. Los ajustes ya están en el Kárdex de movimientos.':'Count closed. Adjustments are already in the Movement ledger.'}</div>`:`<div class="note" style="margin:14px 16px">${es?('Al confirmar, cada línea con varianza genera un ajuste enlazado a este conteo ('+sel.id+').'):('On confirm, each line with variance generates an adjustment linked to this count ('+sel.id+').')}</div><div style="padding:0 16px 16px"><button class="btn flow" style="width:100%;justify-content:center" onclick="confirmCount()">${ic('check')} ${es?'Confirmar conteo y ajustar':'Confirm count & adjust'}</button></div>`}`
    :`<div class="empty" style="min-height:260px"><div>${ic('clip')}<p style="margin-top:8px">${es?'Selecciona una tarea de conteo':'Select a count task'}</p></div></div>`}</div>
  </div>`}

function xdockAllocated(x){return x.demand.filter(d=>d.done).reduce((s,d)=>s+d.need,0)}
window.allocateXdock=(sku,ref)=>{const x=XDOCK.find(v=>v.sku===sku);if(!x)return;const d=x.demand.find(v=>v.ref===ref);if(!d||d.done)return;
 const remaining=x.inbound-xdockAllocated(x);if(d.need>remaining){toast(LANG==='es'?'No hay suficiente inbound sin asignar':'Not enough unallocated inbound');return}
 d.done=true;
 MOVEMENTS.unshift({id:'TXN-'+(9700+MOVEMENTS.length),date:TODAY,time:'—',type:'CROSSDOCK',sku:x.sku,name:x.name,qty:d.need,bin:'XD-01',lot:'—',ref:d.ref,user:'Cross-dock'});
 toast((LANG==='es'?'Asignado ':'Allocated ')+d.need+' → '+d.ref);
 go('crossdock',true)};

function crossdock(){const es=LANG==='es';
 const dockType=ty=>ty==='inbound'?(es?'Entrada':'Inbound'):ty==='outbound'?(es?'Salida':'Outbound'):(es?'Ambos':'Both');
 const apptSt=s=>({arrived:es?'Llegó':'Arrived',loading:es?'Cargando':'Loading',scheduled:es?'Programada':'Scheduled'})[s];
 const apptCls={arrived:'s-deliv',loading:'s-route',scheduled:'s-cap'};
 return `<div class="head"><div><h1>${t('nav.crossdock')[0]}</h1><p>${t('nav.crossdock')[1]}</p></div>
   <div class="act"><span class="tag" style="color:var(--faint);background:var(--panel-2);border-color:var(--line-2)">${es?'Módulo apagado para Advance · demo':'Module off for Advance · demo'}</span></div></div>
  <div class="note" style="margin-bottom:14px">${ic('swap')} ${es?'De muelle a muelle sin guardar: la mercancía entra por un muelle inbound, se empareja directo con órdenes de salida (sin reserva) y sale por el muelle outbound. Cada emparejamiento escribe un movimiento CROSSDOCK en el ledger. Lo no asignado cae a putaway normal.':'Dock to dock, no put-away: goods enter through an inbound dock, are matched directly to outbound orders (no reservation) and leave through the outbound dock. Each match writes a CROSSDOCK movement to the ledger. Anything unallocated falls to normal putaway.'}</div>
  <div class="streamlabel flow">${ic('warehouse')} ${es?'Muelles':'Docks'} <span class="ln"></span></div>
  <div class="river" style="margin-bottom:8px">${DOCKS.map(d=>`<div class="node ${d.status==='occupied'?'m':''}" style="min-width:150px"><div class="ph">${ic(d.type==='outbound'?'truck':'checkin')} ${d.code}</div><div class="big" style="font-size:15px">${dockType(d.type)}</div><div class="sub"><span class="chip ${d.status==='occupied'?'s-route':'s-deliv'}">${d.status==='occupied'?(es?'Ocupado':'Occupied'):(es?'Libre':'Free')}</span></div><div class="sub" style="margin-top:6px">${d.ref?'<span class="ref" style="font-size:11px">'+d.ref+'</span>':'—'}</div></div>`).join('')}</div>
  <div class="panel" style="margin-bottom:14px"><div class="ph2">${ic('clock')} ${es?'Agenda de citas de muelle':'Dock appointment schedule'} <span class="r">${DOCK_APPTS.length}</span></div>
   <div style="overflow:auto"><table class="lst"><thead><tr><th>${es?'Cita':'Appt'}</th><th>${es?'Muelle':'Dock'}</th><th>${es?'Dirección':'Direction'}</th><th>ETA</th><th>${es?'Referencia':'Reference'}</th><th>${es?'Contraparte':'Party'}</th><th>${es?'Estado':'Status'}</th></tr></thead><tbody>
   ${DOCK_APPTS.map(a=>`<tr><td><span class="ref">${a.id}</span></td><td class="mono">${a.dock}</td><td>${a.dir==='inbound'?(es?'Entrada':'Inbound'):(es?'Salida':'Outbound')}</td><td class="mono">${a.eta}</td><td><span class="ref" style="font-size:11px">${a.ref}</span></td><td>${a.party}</td><td><span class="chip ${apptCls[a.status]}">${apptSt(a.status)}</span></td></tr>`).join('')}
   </tbody></table></div></div>
  <div class="streamlabel money" style="margin-top:4px">${ic('swap')} ${es?'Emparejamiento inbound ↔ outbound':'Inbound ↔ outbound matching'} <span class="ln"></span></div>
  ${XDOCK.map(x=>{const alloc=xdockAllocated(x);const rem=x.inbound-alloc;const pct=Math.round(100*alloc/x.inbound);
    return `<div class="panel" style="margin-bottom:12px"><div class="ph2"><span class="ref">${x.sku}</span> ${x.name} <span class="r">Inbound: ${x.inbound} · ${es?'sin asignar':'unallocated'}: ${rem}</span></div>
     <div style="padding:10px 16px 4px"><div style="height:7px;border-radius:5px;background:var(--bg-2);overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:linear-gradient(90deg,var(--flow),var(--flow-2))"></i></div></div>
     <table class="lst"><thead><tr><th>${es?'Orden de salida':'Outbound order'}</th><th>${t('cols.cons')}</th><th class="n">${es?'Necesita':'Needs'}</th><th></th></tr></thead><tbody>
     ${x.demand.map(d=>`<tr><td><span class="ref">${d.ref}</span></td><td>${d.cons}</td><td class="n mono">${d.need}</td><td style="text-align:right">${d.done?`<span class="chip s-deliv">${es?'Asignado':'Allocated'}</span>`:`<button class="btn sm flow" ${d.need>rem?'disabled':''} onclick="allocateXdock('${x.sku}','${d.ref}')">${ic('swap')} ${es?'Asignar':'Allocate'}</button>`}</td></tr>`).join('')}
     </tbody></table>
     ${rem>0?`<div class="note" style="margin:6px 16px 14px">${rem} ${es?'unidades sin asignar → caen a putaway normal (a reserva).':'units unallocated → fall to normal putaway (to reserve).'}</div>`:''}
    </div>`}).join('')}`}


function stub(v){const n=t('nav.'+v);return `<div class="head"><div><h1>${n[0]}</h1><p>${n[1]}</p></div></div>
  <div class="empty" style="min-height:340px"><div><div class="ic">${ic(ICONOF[v]||'box')}</div><b>${n[0]}</b><p style="margin:6px 0 0;max-width:430px">${t('stub.note')}</p><button class="btn flow" style="margin-top:14px" onclick="openPal()">${t('stub.another')} ${ic('chev')}</button></div></div>`}

const SCREENS={pulso:home,ordenes:ordenes,entrada:entry,escaneo:scan,despacho:dispatch,envio:record,cod:codbox,vistas:views,impresoras:printers,monitoreo:monitoreo,almacenes:almacenes,ubicaciones:ubicaciones,inventario:inventario,compras:compras,recibo:recibo,picking:picking,crossdock:crossdock,conteo:conteo,ledger:ledger,facturacion:facturacion,choferes:choferes,liquidacion:liquidacion,clientes:clientes};
function go(v,keepF){
  if(!keepF){
    if(v==='entrada'&&CURRENT!=='entrada'){F={from:TODAY,to:TODAY,cons:'',client:'',svc:'',pkg:'',town:'',zip:''}}
    if(v==='ordenes'&&CURRENT!=='ordenes'){F={from:'',to:'',cons:'',client:'',svc:'',pkg:'',town:'',zip:''}}
  }
  CURRENT=v;const f=SCREENS[v]||(()=>stub(v));document.getElementById('wrap').innerHTML=f();window.scrollTo(0,0);
  if(v==='entrada'&&ENTRYMODE==='quick')initQuick();
  if(v==='entrada'&&ENTRYMODE==='detail')initDetail();

  if(v==='cod'&&!keepF)setTimeout(()=>{const i=document.getElementById('codscan');if(i)i.focus()},60);
  if(GROUPOF[v])openGroup=GROUPOF[v];
  buildSidebar();hydrate();closePal();refreshAI()}

/* ===== palette ===== */
const scrim=document.getElementById('scrim'),palq=document.getElementById('palq'),pll=document.getElementById('pll');
let flat=[],cur=0;
function renderPal(q=''){pll.innerHTML='';flat=[];q=q.toLowerCase();
  NAV.forEach(([gk,,items])=>{const hits=items.filter(v=>(t('nav.'+v)[0]+t('nav.'+v)[1]+v).toLowerCase().includes(q));if(!hits.length)return;
    const g=document.createElement('div');g.className='pgrp';g.textContent=t('g.'+gk);pll.appendChild(g);
    hits.forEach(v=>{const i=flat.length;flat.push(v);const d=document.createElement('div');d.className='it';d.dataset.i=i;
      d.innerHTML=`<div class="pic">${ic(ICONOF[v])}</div><div><div class="nm">${t('nav.'+v)[0]}</div><div class="ds">${t('nav.'+v)[1]}</div></div><div class="go">↵</div>`;
      d.onclick=()=>go(v);pll.appendChild(d)})});cur=0;mark()}
function mark(){[...pll.querySelectorAll('.it')].forEach(el=>el.classList.toggle('on',+el.dataset.i===cur));const on=pll.querySelector('.it.on');if(on)on.scrollIntoView({block:'nearest'})}
function openPal(){scrim.classList.add('on');palq.value='';palq.placeholder=t('ui.palAsk');renderPal();setTimeout(()=>palq.focus(),30)}
function closePal(){scrim.classList.remove('on')}
window.openPal=openPal;window.closePal=closePal;
document.getElementById('cmdbtn').onclick=openPal;
scrim.onclick=e=>{if(e.target===scrim)closePal()};
document.getElementById('dispScrim').onclick=e=>{if(e.target.id==='dispScrim')closeDispatchModal()};
document.getElementById('genScrim').onclick=e=>{if(e.target.id==='genScrim')closeGenModal()};
palq.addEventListener('input',()=>renderPal(palq.value));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('genScrim').classList.contains('on')){closeGenModal();return}
  if(e.key==='Escape'&&document.getElementById('dispScrim').classList.contains('on')){closeDispatchModal();return}
  if((e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openPal();return}
  if(!scrim.classList.contains('on'))return;
  if(e.key==='Escape')closePal();else if(e.key==='ArrowDown'){e.preventDefault();cur=Math.min(cur+1,flat.length-1);mark()}
  else if(e.key==='ArrowUp'){e.preventDefault();cur=Math.max(cur-1,0);mark()}else if(e.key==='Enter'){e.preventDefault();if(flat[cur])go(flat[cur])}});

const TENANTS=[{code:'ADV',name:'Advance Logistics'},{code:'ISLA',name:'Isla Cargo Solutions'}];
let CURRENT_TENANT='ADV';
function renderTenantMenu(){document.getElementById('tenantMenu').innerHTML=TENANTS.map(x=>`<button data-tenant-set="${x.code}" class="${x.code===CURRENT_TENANT?'on':''}">${x.name}</button>`).join('');
  document.querySelectorAll('#tenantMenu button').forEach(b=>b.onclick=()=>switchTenant(b.dataset.tenantSet))}
window.switchTenant=(code)=>{document.getElementById('tenantdd').classList.remove('open');
  if(code===CURRENT_TENANT)return;
  CURRENT_TENANT=code;const tn=TENANTS.find(x=>x.code===code);
  document.getElementById('tenantName').textContent=tn.name;
