name: ci
on:
  push:
    branches: [ master, main, "claude/**" ]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Teikem_Dev_2026!"
          MSSQL_PID: "Developer"
        ports: [ "1433:1433" ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Teikem_Dev_2026!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore & build
        run: dotnet build Teikem.sln -c Release
      - name: Unit tests
        run: dotnet test Teikem.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: db-init (Identity → estructura → seed → extensiones → seeders)
        run: dotnet run --project src/Teikem.Api -c Release --no-build -- db-init
      - name: db-init de nuevo (idempotencia — rama 'ya existe' de DemoTenantSeeder, seeders por nombre, 0 permisos propagados)
        run: dotnet run --project src/Teikem.Api -c Release --no-build -- db-init
      - name: Smoke test contra el API
        run: |
          sudo apt-get install -y jq >/dev/null
          # El smoke y los recorridos crean usuarios y entran con ellos: el primer ingreso obligatorio (2026-09-30) se apaga aquí
          # (lo cubren OnboardingTests y las pruebas de la web).
          Auth__Onboarding__Enabled=false ASPNETCORE_URLS=http://localhost:5000 ASPNETCORE_ENVIRONMENT=Development dotnet run --project src/Teikem.Api -c Release --no-build &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/health && break; sleep 2; done
          # SMOKE_SQL: sqlcmd dentro del contenedor de SQL Server para los pasos que necesitan datos sin API todavía
          # (pings del chofer del Lote 7, que el monitor del Lote 5 ya lee). Sin esta variable el smoke omite esos pasos.
          export SMOKE_SQL="docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Teikem_Dev_2026! -d Teikem -b -h -1 -Q"
          # Paso de migración (Lote 10): el importador corre con el mismo build Release que el API bajo prueba.
          export SMOKE_MIGRATION_RUN="dotnet run --project src/Teikem.Api -c Release --no-build"
          scripts/smoke.sh http://localhost:5000
      # Recorrido Playwright del frontend (Lote F1) contra el mismo API, que sigue arriba desde el paso anterior
      # (los procesos en segundo plano viven hasta el fin del job). Vite sirve la app en :5173 (CORS permitido en appsettings).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Recorrido Playwright del frontend (escritorio y móvil Pixel 7)
        working-directory: web-app
        env:
          API_URL: http://localhost:5000
        run: |
          curl -sf http://localhost:5000/health
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Evidencia del recorrido Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web-app/test-results
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Instalar y verificar (tipos generados, tsc, lint, vitest, build)
        working-directory: web-app
        run: |
          npm ci
          npm run check

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-almacen/package-lock.json
      - name: Instalar y verificar (tipos generados, tsc, lint, jest)
        working-directory: app-almacen
        run: |
          npm ci --legacy-peer-deps
          npm run check

  android:
    needs: mobile
    runs-on: ubuntu-latest
    # El contexto `secrets` no está permitido en `if:` de un step (GitHub Actions lo rechaza al validar el workflow,
    # "Unrecognized named-value: 'secrets'"); se calcula aquí, en `env:` de job (donde sí está permitido), y el `if:`
    # del step de abajo lee `env.HAS_RELEASE_KEYSTORE` en su lugar.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.TEIKEM_RELEASE_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-almacen/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app-almacen/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Generar el proyecto nativo Android (Continuous Native Generation)
        working-directory: app-almacen
        env:
          APP_VARIANT: development
        run: |
          npm ci --legacy-peer-deps
          npx expo prebuild --platform android --no-install
      - name: Llave propia de firma (si el secreto ya existe; si no, cae a la llave de depuración)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        working-directory: app-almacen/android/app
        env:
          TEIKEM_RELEASE_KEYSTORE_B64: ${{ secrets.TEIKEM_RELEASE_KEYSTORE_B64 }}
        run: base64 -d <<< "$TEIKEM_RELEASE_KEYSTORE_B64" > release.keystore
      - name: Compilar el APK release (llave propia si el secreto existe; si no, firma de depuración)
        working-directory: app-almacen/android
        env:
          TEIKEM_RELEASE_KEYSTORE: ${{ env.HAS_RELEASE_KEYSTORE == 'true' && 'release.keystore' || '' }}
          TEIKEM_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TEIKEM_RELEASE_KEYSTORE_PASSWORD }}
          TEIKEM_RELEASE_KEY_ALIAS: ${{ secrets.TEIKEM_RELEASE_KEY_ALIAS }}
          TEIKEM_RELEASE_KEY_PASSWORD: ${{ secrets.TEIKEM_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-almacen-release-apk
          path: app-almacen/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  android-e2e:
    needs: android
    runs-on: ubuntu-latest
    # Nuevo, primera ejecución: continuar si falla para iterar sin bloquear otros jobs.
    # Remover continue-on-error cuando los flujos Maestro sean estables.
    continue-on-error: true
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Teikem_Dev_2026!"
          MSSQL_PID: "Developer"
        ports: [ "1433:1433" ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Teikem_Dev_2026!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar backend
        run: dotnet build Teikem.sln -c Release
      - name: db-init
        run: dotnet run --project src/Teikem.Api -c Release --no-build -- db-init
      - name: Iniciar API en segundo plano
        run: |
          sudo apt-get install -y jq >/dev/null
          # El smoke y los recorridos crean usuarios y entran con ellos: el primer ingreso obligatorio (2026-09-30) se apaga aquí
          # (lo cubren OnboardingTests y las pruebas de la web).
          Auth__Onboarding__Enabled=false ASPNETCORE_URLS=http://localhost:5000 ASPNETCORE_ENVIRONMENT=Development dotnet run --project src/Teikem.Api -c Release --no-build &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/health && break; sleep 2; done
      - name: Crear fixtures para Maestro
        run: |
          chmod +x scripts/e2e-mobile-fixtures.sh
          scripts/e2e-mobile-fixtures.sh http://localhost:5000
      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: app-almacen-release-apk
          path: /tmp/apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ejecutar Maestro E2E contra emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -euo pipefail
            # Instalar Maestro CLI
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$HOME/.maestro/bin:$PATH"

            # Instalar APK en emulador
            adb install -r /tmp/apk/app-release.apk

            FLOWS="app-almacen/e2e-maestro"
            ENV_ARGS=(-e "E2E_ENROLL_CODE=$E2E_ENROLL_CODE" -e "E2E_CONSIGNEE_LABEL=$E2E_CONSIGNEE_LABEL" -e "E2E_SERVER_URL=$E2E_SERVER_URL")

            maestro test "$FLOWS/01-registrar-y-entrar.yaml" "${ENV_ARGS[@]}"
            maestro test "$FLOWS/02-recibir.yaml" "${ENV_ARGS[@]}"
            maestro test "$FLOWS/03-despacho.yaml" "${ENV_ARGS[@]}"

            # 04: recibo sin señal (verifica que queda pendiente) y, ya con señal, que se manda solo. Maestro no
            # tiene un comando confiable para cortar la red del emulador, así que se hace con adb alrededor de los
            # dos flujos (ver comentario en 04a-recibo-sin-senal.yaml).
            adb shell svc wifi disable
            adb shell svc data disable
            maestro test "$FLOWS/04a-recibo-sin-senal.yaml" "${ENV_ARGS[@]}"
            adb shell svc wifi enable
            adb shell svc data enable
            maestro test "$FLOWS/04b-verificar-envio.yaml" "${ENV_ARGS[@]}"
