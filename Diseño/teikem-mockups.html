/* ===== Impresoras y labels: paneles compartidos entre Sistema > Impresoras y labels y
   Portal de clientes > Configuración (el cliente configura la impresora de SU estación/oficina
   igual que lo hace un usuario interno — mismo componente, ver bitácora "Configuración del portal"). ===== */
/* ===== Impresoras: un solo componente parametrizado por tipo (kind: 'label'|'doc') — usado tanto
   por Sistema > Impresoras y labels como por Portal de clientes > Configuración, para que ambas
   pantallas luzcan exactamente igual. La configuración es por estación (esta estación) y cada tipo
   de impresora (label vs. documentos) se guarda por separado. ===== */
function printerConfigPanelHtml(kind){const pr=t('pr');const isLabel=kind!=='doc';
 const title=isLabel?pr.stationLabel:pr.stationDoc;
 const tplLabel=isLabel?pr.tpl:pr.tplDoc;
 const tplOpts=isLabel?['4×6 — COD','4×6 — Estándar','4×4 — Estándar','2×4 — Sobre']:['Carta — Factura','Carta — BOL','Carta — Recibo'];
 const testLabel=isLabel?pr.test:pr.testDoc;
 const testAction=isLabel?"report('label')":"report('waybill')";
 return `<div class="panel"><div class="ph2">${ic('print')} ${title}</div><div class="pb">
     <div class="f"><label>${pr.def}</label><select><option>Zebra ZD420 — Mostrador 1</option><option>Zebra ZT230 — Almacén</option><option>PDF</option></select></div>
     <div class="f"><label>${tplLabel}</label><select>${tplOpts.map(o=>`<option>${o}</option>`).join('')}</select></div>
     <div class="r2"><label class="sw"><input type="checkbox" checked><span class="tk"></span>${pr.onsave}</label><label class="sw"><input type="checkbox"><span class="tk"></span>${pr.confirm}</label></div>
     <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="${testAction}">${ic('print')} ${testLabel}</button><button class="btn flow">${pr.save}</button></div></div></div>`}
/* ===== Constructor de label: cada elemento tiene si se muestra (on), posición en una cuadrícula de
   9 zonas (pos) y tamaño (size); invoice y waybill además pueden mostrarse como código de barras. ===== */
const LABEL_POS=['tl','tc','tr','ml','mc','mr','bl','bc','br'];
const LABEL_SIZE_PX={sm:10.5,md:12.5,lg:15.5};
let LABEL_FIELDS={
 logo:{on:true,pos:'tl',size:'md'},
 service:{on:true,pos:'tr',size:'sm'},
 sender:{on:false,pos:'tc',size:'sm'},
 consignee:{on:true,pos:'ml',size:'md'},
 address:{on:true,pos:'ml',size:'sm'},
 barcode:{on:true,pos:'mc',size:'md'},
 waybill:{on:false,pos:'bl',size:'sm',barcode:false},
 invoice:{on:true,pos:'bl',size:'sm',barcode:false},
 cod:{on:true,pos:'br',size:'md'}
};
window.setLabelOn=(k,v)=>{LABEL_FIELDS[k].on=v;go(CURRENT,true)};
window.setLabelPos=(k,v)=>{LABEL_FIELDS[k].pos=v;go(CURRENT,true)};
window.setLabelSize=(k,v)=>{LABEL_FIELDS[k].size=v;go(CURRENT,true)};
window.setLabelBarcode=(k,v)=>{LABEL_FIELDS[k].barcode=v;go(CURRENT,true)};
function labelBarHtml(sz){return `<div style="height:${sz==='lg'?30:sz==='sm'?16:22}px;background:repeating-linear-gradient(90deg,#111 0 1.5px,#fff 1.5px 4px)"></div>`}
function labelElementContentHtml(k,cfg){const szStyle=`font-size:${LABEL_SIZE_PX[cfg.size]||12.5}px`;
 switch(k){
  case 'logo': return `<b style="${szStyle};color:#0B2C66">TEIKEM</b>`;
  case 'service': return `<span style="${szStyle}">NEXT DAY</span>`;
  case 'sender': return `<span style="${szStyle}">De: Advance Solutions</span>`;
  case 'consignee': return `<span style="${szStyle}">A: Farmacia Las Marías</span>`;
  case 'address': return `<span style="${szStyle}">Toa Baja, PR 00949</span>`;
  case 'barcode': return `<div style="height:${cfg.size==='lg'?42:cfg.size==='sm'?24:34}px;width:100%;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 5px)"></div>`;
  case 'waybill': return cfg.barcode?labelBarHtml(cfg.size):`<span style="${szStyle}">WB-88213</span>`;
  case 'invoice': return cfg.barcode?labelBarHtml(cfg.size):`<span style="${szStyle}">AX-48217</span>`;
  case 'cod': return `<b style="${szStyle};background:#FF6A1A;color:#fff;padding:1px 7px;border-radius:4px">COD $125.82</b>`;
  default: return '';
 }}
function labelPreviewCanvasHtml(){
 const zones={};LABEL_POS.forEach(p=>zones[p]=[]);
 Object.keys(LABEL_FIELDS).forEach(k=>{const cfg=LABEL_FIELDS[k];if(cfg.on)zones[cfg.pos].push(labelElementContentHtml(k,cfg))});
 const justifyFor=(p)=>p.startsWith('t')?'flex-start':p.startsWith('b')?'flex-end':'center';
 const alignFor=(p)=>p.endsWith('l')?'flex-start':p.endsWith('r')?'flex-end':'center';
 const textAlignFor=(p)=>p.endsWith('l')?'left':p.endsWith('r')?'right':'center';
 return `<div class="lblcanvas" style="background:var(--label-paper);color:#111;border-radius:8px;padding:10px;font-family:var(--mono);max-width:340px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(3,minmax(34px,auto));gap:4px;min-height:190px">
  ${LABEL_POS.map(p=>`<div style="display:flex;flex-direction:column;gap:3px;align-items:${alignFor(p)};justify-content:${justifyFor(p)};text-align:${textAlignFor(p)}">${zones[p].join('')}</div>`).join('')}
 </div>`}
function labelBuilderPanelHtml(){const pr=t('pr');
 const els=[['logo',pr.lb_logo,false],['service',pr.lb_service,false],['sender',pr.lb_sender,false],['consignee',pr.lb_consignee,false],['address',pr.lb_address,false],['barcode',pr.lb_barcode,false],['waybill',pr.lb_waybill,true],['invoice',pr.lb_invoice,true],['cod',pr.lb_cod,false]];
 return `<div class="panel"><div class="ph2">${ic('tag')} ${pr.buildLabel}</div><div class="pb">
   <p class="d" style="margin-top:0">${pr.buildLabelHint}</p>
   <div style="overflow:auto;margin-bottom:16px"><table class="lst densetbl"><thead><tr><th>${pr.lb_on}</th><th>${pr.lb_element}</th><th>${pr.lb_position}</th><th>${pr.lb_size}</th><th>${pr.lb_asBarcode}</th></tr></thead><tbody>
   ${els.map(([k,lbl,canBarcode])=>{const cfg=LABEL_FIELDS[k];
     return `<tr>
      <td><label class="mi" style="padding:0"><input type="checkbox" ${cfg.on?'checked':''} onchange="setLabelOn('${k}',this.checked)"></label></td>
      <td>${lbl}</td>
      <td><select style="min-width:112px" onchange="setLabelPos('${k}',this.value)">${LABEL_POS.map(p=>`<option value="${p}" ${cfg.pos===p?'selected':''}>${pr['pos_'+p]}</option>`).join('')}</select></td>
      <td><select style="min-width:88px" onchange="setLabelSize('${k}',this.value)"><option value="sm" ${cfg.size==='sm'?'selected':''}>${pr.size_sm}</option><option value="md" ${cfg.size==='md'?'selected':''}>${pr.size_md}</option><option value="lg" ${cfg.size==='lg'?'selected':''}>${pr.size_lg}</option></select></td>
      <td>${canBarcode?`<label class="mi" style="padding:0"><input type="checkbox" ${cfg.barcode?'checked':''} onchange="setLabelBarcode('${k}',this.checked)"></label>`:'<span style="color:var(--faint)">—</span>'}</td>
     </tr>`}).join('')}
   </tbody></table></div>
   ${labelPreviewCanvasHtml()}
   <div style="margin-top:14px;display:flex;gap:8px"><button class="btn flow">${ic('swap')} ${pr.updateLabel}</button></div>
  </div></div>`}

function applySort(screen,rows,defaultKey){const s=SORTS[screen];const k=s.k||defaultKey;const dir=s.k?s.dir:1;
 return [...rows].sort((a,b)=>{let va=a[k],vb=b[k];if(typeof va==='string')va=va.toLowerCase();if(typeof vb==='string')vb=vb.toLowerCase();return (va<vb?-1:va>vb?1:0)*dir})}

function paginate(arr, key){const st=PAGES[key];
  if(st.size==='all') return {rows:arr, total:arr.length, page:1, pages:1};
  const total=arr.length, pages=Math.max(1,Math.ceil(total/st.size));
  st.page=Math.min(Math.max(1,st.page),pages);
  const startI=(st.page-1)*st.size;
  return {rows:arr.slice(startI,startI+st.size), total, page:st.page, pages}}

function productWarehouses(sku){const set=new Set();BINS.forEach(b=>{if(b.stock.some(s=>s.sku===sku)){const z=ZONES.find(z2=>z2.code===b.zone);if(z){const w=WAREHOUSES.find(x=>x.code===z.wh);set.add(w?w.name:z.wh)}}});const pp=PRODUCTS.find(x=>x.sku===sku);if(!set.size){const pw=pp&&pp.prefWh?WAREHOUSES.find(x=>x.code===pp.prefWh):WAREHOUSES[0];set.add(pw?pw.name:WAREHOUSES[0].name)}return [...set]}
function inventario(){const v=t('inv2');
 let filtered = PRODUCTS.filter(p=>!IF.cat.length||IF.cat.includes(p.cat)).map(p=>({...p, avail:p.total-p.reserved, low:(p.total-p.reserved)<p.reorder}));
 filtered = filtered.filter(p=>!IF.product.length||IF.product.includes(productLabel(p)));
 filtered = filtered.filter(p=>!IF.state.length||IF.state.includes(p.low?v.low:v.ok));
 filtered = filtered.filter(p=>!IF.wh.length||productWarehouses(p.sku).some(w=>IF.wh.includes(w)));
 filtered = filtered.filter(p=>!IF.bin.length||productBins(p.sku).some(bc=>IF.bin.includes(bc)));
 filtered.sort((a,b)=>{let va=a[ISORT.k],vb=b[ISORT.k];if(typeof va==='string')va=va.toLowerCase();if(typeof vb==='string')vb=vb.toLowerCase();return (va<vb?-1:va>vb?1:0)*ISORT.dir});
 const {rows, total, page, pages} = paginate(filtered,'prod');
 const lowCount = PRODUCTS.filter(p=>(p.total-p.reserved)<p.reorder).length;
 const serialCount = PRODUCTS.filter(p=>p.track==='serial').length;
 const totalUnits = PRODUCTS.reduce((s,p)=>s+p.total,0);
 const cols=[['sku','sku',0],['name','product',0],['cat','cat',0],['client','owner',0],['avail','avail',1],['reserved','reserved',1],['total','total',1],['track','track',0],['low','state',0]];
 return `<div class="head"><div><h1>${v.title}</h1><p>${v.sub}</p></div><div class="act"><button class="btn" onclick="openReportModal('invReport')">${ic('doc')} ${v.invReport}</button><button class="btn" onclick="openReportModal('adjReport')">${ic('doc')} ${v.adjReport}</button><button class="btn flow" onclick="openProductModal()">${ic('plus')} ${v.newProduct}</button></div></div>
  <div class="river" style="margin-bottom:16px">
   <div class="node flow"><div class="ph">${ic('layers')} ${v.totalSkus}</div><div class="big">${PRODUCTS.length}</div></div><div class="pipe"></div>
   <div class="node flow"><div class="ph">${ic('box')} ${v.totalUnits}</div><div class="big">${totalUnits.toLocaleString()}</div></div><div class="pipe"></div>
   <div class="node m"><div class="ph">${ic('alert')} ${v.lowCount}</div><div class="big">${lowCount}</div></div><div class="pipe"></div>
   <div class="node flow"><div class="ph">${ic('tag')} ${v.serialCount}</div><div class="big">${serialCount}</div></div>
  </div>
  <div class="filters" style="grid-template-columns:repeat(auto-fit,minmax(158px,1fr))">
   <div class="f"><label>${v.warehouse}</label>${msel('ifwh',WAREHOUSES.map(w=>w.name),IF.wh,x=>setIF('wh',x),t('entry.f.all'))}</div>
   <div class="f"><label>${v.location}</label>${msel('ifbin',BINS.map(b=>b.code),IF.bin,x=>setIF('bin',x),t('entry.f.all'))}</div>
   <div class="f"><label>${v.product}</label>${msel('ifprod',productOptions(),IF.product,x=>setIF('product',x),t('entry.f.all'))}</div>
   <div class="f"><label>${v.cat}</label>${msel('ifcat',PRODCATS,IF.cat,x=>setIF('cat',x),t('entry.f.all'))}</div>
   <div class="f"><label>${v.state}</label>${msel('ifstate',[v.low,v.ok],IF.state,x=>setIF('state',x),t('entry.f.all'))}</div>
   <button class="btn sm" style="justify-self:start" onclick="IF={cat:[],product:[],state:[],wh:[],bin:[]};PAGES.prod.page=1;go('inventario',true)">${t('entry.f.clear')}</button>
  </div>
  <div class="panel"><div class="ph2">${ic('layers')} ${v.title} <span class="r">${total}</span></div>
   <table class="lst"><thead><tr>
    ${cols.map(([k,lk,num])=>`<th class="sort ${num?'n':''}" onclick="sortInv('${k}')">${v[lk]}${ISORT.k===k?`<span class="arr">${ISORT.dir>0?'\u25b2':'\u25bc'}</span>`:''}</th>`).join('')}
   </tr></thead><tbody>
   ${rows.map(p=>`<tr style="cursor:pointer;${p.active===false?'opacity:.55':''}" onclick="openProductModal('${p.sku}')"><td><span class="ref">${p.sku}</span></td><td>${p.name}</td><td>${p.cat}</td><td>${p.client?p.client:'<span style=\'color:var(--faint)\'>'+v.own+'</span>'}</td><td class="n mono">${p.avail}</td><td class="n mono">${p.reserved||'\u2014'}</td><td class="n mono">${p.total}</td><td>${p.track==='none'?v.none:(p.track==='lot'?v.lot:v.serial)}</td><td>${p.active===false?`<span class="chip s-cap">${v.inactive}</span>`:`<span class="chip ${p.low?'s-fail':'s-deliv'}">${p.low?v.low:v.ok}</span>`}</td></tr>`).join('')}
   </tbody></table>
   ${pagerHtml('prod', total, page, pages)}
  </div>`}

 BIN_EDIT_CODE = code||null;

function renderBinModalHtml(code){const u=t('ubic');const b=code?BINS.find(x=>x.code===code):null;
 return `<div class="pi" style="justify-content:space-between"><b style="font-size:15px">${ic('grid')} ${b?u.editTitle:u.modalTitle}</b><button class="x" onclick="closeGenModal()" style="border:none;background:transparent;color:var(--faint);width:28px;height:28px;border-radius:8px">\u2715</button></div>
 <div class="pb">
  <div class="f"><label>${u.zona}</label><select id="nb_zona">${ZONES.filter(z=>z.wh===CURRENT_WH).map(z=>`<option value="${z.code}" ${b&&b.zone===z.code?'selected':''}>${z.code} \u00b7 ${z.name}</option>`).join('')}</select></div>
  <div class="r2"><div class="f"><label>${u.code}</label><input id="nb_code" placeholder="07" value="${b?b.code.split('-')[1]:''}"></div><div class="f"><label>${u.cap}</label><input id="nb_cap" class="mono" value="${b?b.cap:100}"></div></div>
  <div class="f"><label>${u.stockLines}</label></div>
  ${BIN_LINES_TMP.map((l,i)=>`<div class="r2" style="margin-bottom:8px"><select onchange="setBinLine(${i},'sku',this.value)"><option value="">${u.none}</option>${PRODUCTS.filter(p=>p.active!==false).map(p=>`<option value="${p.sku}" ${l.sku===p.sku?'selected':''}>${p.sku} \u00b7 ${p.name}</option>`).join('')}</select><input class="mono" placeholder="${u.qty}" value="${l.qty||''}" oninput="setBinLine(${i},'qty',this.value)"></div>`).join('')}
  <button class="btn sm" onclick="addBinLine()" style="margin-bottom:0">${ic('plus')} ${u.addLine}</button>
 </div>
 <div class="ft" style="justify-content:flex-end;gap:10px"><button class="btn sm" onclick="closeGenModal()">${u.cancel}</button><button class="btn sm flow" onclick="saveBin()">${ic('check')} ${u.save}</button></div>`}
window.saveBin=()=>{const editCode=BIN_EDIT_CODE;
 const zone=document.getElementById('nb_zona').value;const codeSuffix=(document.getElementById('nb_code').value||'').trim();
 if(!codeSuffix)return;
 const cap=parseInt(document.getElementById('nb_cap').value)||100;
 const stock=BIN_LINES_TMP.filter(l=>l.sku&&l.qty>0).map(l=>({sku:l.sku,qty:l.qty}));
 const newCode=zone+'-'+codeSuffix;
 if(editCode){const b=BINS.find(x=>x.code===editCode);if(b){b.zone=zone;b.code=newCode;b.cap=cap;b.stock=stock}toast(t('ubic.updated')+': '+newCode)}
 else{BINS.push({code:newCode, zone, cap, stock});const z=ZONES.find(x=>x.code===zone);if(z)z.bins++;if(z&&stock.length)z.used++;toast(t('ubic.created')+': '+newCode)}
 closeGenModal();PAGES.bin.page=1;go('ubicaciones',true)};

 </div>

window.saveProduct=(editSku)=>{const sku=editSku||(document.getElementById('np_sku').value||'').trim();const name=(document.getElementById('np_name').value||'').trim();
 if(!sku||!name)return;
 const cat=document.getElementById('np_cat').value, uom=document.getElementById('np_uom').value||'ea', track=document.getElementById('np_track').value, reorder=parseInt(document.getElementById('np_reorder').value)||0;
 const purchaseCost=parseFloat(document.getElementById('np_pcost').value)||0, salePrice=parseFloat(document.getElementById('np_sprice').value)||0;
 const prefWh=document.getElementById('np_prefwh').value, prefBin=document.getElementById('np_prefbin').value;
 if(editSku){const p=PRODUCTS.find(x=>x.sku===editSku);if(p){p.name=name;p.cat=cat;p.uom=uom;p.track=track;p.reorder=reorder;p.purchaseCost=purchaseCost;p.salePrice=salePrice;p.prefWh=prefWh;p.prefBin=prefBin;const _ow=document.getElementById('np_owner');if(_ow)p.client=_ow.value||null;
   const activeEl=document.getElementById('np_active');if(activeEl&&!activeEl.disabled)p.active=activeEl.checked;
   toast(t('inv2.updated')+': '+sku)}}
 else{PRODUCTS.push({sku, name, cat, uom, total:parseInt(document.getElementById('np_total').value)||0, reserved:0, track, reorder, active:true, purchaseCost, salePrice, prefWh, prefBin, client:(document.getElementById('np_owner')?(document.getElementById('np_owner').value||null):null)});
   toast(t('inv2.created')+': '+sku)}
 PROD_MODAL_WH=null;
 closeGenModal();PAGES.prod.page=1;go('inventario',true)};
window.applyAdjustment=(sku)=>{const p=PRODUCTS.find(x=>x.sku===sku);if(!p)return;
 const delta=parseInt(document.getElementById('adj_qty').value)||0;const reason=(document.getElementById('adj_reason').value||'').trim();
 if(!delta)return;
 p.total=Math.max(0,p.total+delta);
 INV_ADJUSTMENTS.unshift({date:TODAY, sku, name:p.name, delta, reason:reason||'—', source:'manual'});
 closeGenModal();toast(t('inv2.adjustApplied')+': '+(delta>0?'+':'')+delta+' '+sku);PAGES.prod.page=1;go('inventario',true)};

/* ===== AJUSTES DE ALMACÉN: compras recibidas parcialmente =====
   No vuelve a tocar el inventario recibido (eso ya quedó correcto en confirmReceipt — se recibió lo
   que físicamente entró). Esto resuelve el FALTANTE contra la orden de compra: cerrarlo (aceptarlo
   como final), reordenarlo con el mismo proveedor, o un ajuste manual con motivo (ej. aparece luego
   en un recuento) — que sí escribe al ledger. Cada resolución descuenta del faltante pendiente. */
function poReceivedTotals(poId){const totals={};
 RECEIPTS.filter(r=>r.origin==='po'&&r.ref===poId&&r.status==='done').forEach(r=>r.lines.forEach(l=>{totals[l.sku]=(totals[l.sku]||0)+l.rec}));
 return totals}
let PO_ADJUSTMENTS=[];
function poShortageLines(po){const recv=poReceivedTotals(po.id);
 return po.lines.map(l=>{const received=recv[l.sku]||0;
   const resolved=PO_ADJUSTMENTS.filter(a=>a.poId===po.id&&a.sku===l.sku).reduce((s,a)=>s+a.qty,0);
   const shortage=Math.max(0,l.qty-received-resolved);
   return {sku:l.sku,name:l.name,ordered:l.qty,received,cost:l.cost,shortage}}).filter(l=>l.shortage>0)}
function posWithShortage(){return PURCHASE_ORDERS.filter(po=>RECEIPTS.some(r=>r.origin==='po'&&r.ref===po.id&&r.status==='done')&&poShortageLines(po).length>0)}
let ADJSEL=null;
window.selectAdjPO=(id)=>{ADJSEL=id;go('ajustealm',true)};
window.resolveShortageClose=(poId,sku)=>{const po=PURCHASE_ORDERS.find(x=>x.id===poId);const line=po&&po.lines.find(l=>l.sku===sku);if(!line)return;
 const lines=poShortageLines(po);const l=lines.find(x=>x.sku===sku);if(!l)return;
 PO_ADJUSTMENTS.unshift({id:'ADJ-'+(9000+PO_ADJUSTMENTS.length),poId,sku,name:line.name,type:'closed',qty:l.shortage,note:(LANG==='es'?'Cerrado corto':'Closed short'),date:TODAY});
 toast((LANG==='es'?'Faltante cerrado: ':'Shortage closed: ')+sku);go('ajustealm',true)};
window.resolveShortageReorder=(poId,sku)=>{const po=PURCHASE_ORDERS.find(x=>x.id===poId);const line=po&&po.lines.find(l=>l.sku===sku);if(!line)return;
 const lines=poShortageLines(po);const l=lines.find(x=>x.sku===sku);if(!l)return;
 const newId='PO-'+(1040+PURCHASE_ORDERS.length+7);
 PURCHASE_ORDERS.unshift({id:newId,supplier:po.supplier,date:TODAY,expected:isoDaysAgo(-5),warehouse:po.warehouse,status:'draft',lines:[{sku,name:line.name,qty:l.shortage,cost:line.cost}]});
 PO_ADJUSTMENTS.unshift({id:'ADJ-'+(9000+PO_ADJUSTMENTS.length),poId,sku,name:line.name,type:'reorder',qty:l.shortage,note:(LANG==='es'?'Reordenado en ':'Reordered as ')+newId,date:TODAY,reorderPO:newId});
 toast((LANG==='es'?'Reorden creada: ':'Reorder created: ')+newId);go('ajustealm',true)};
window.resolveShortageManual=(poId,sku)=>{const po=PURCHASE_ORDERS.find(x=>x.id===poId);const line=po&&po.lines.find(l=>l.sku===sku);if(!line)return;
 const qtyEl=document.getElementById('adjm_qty_'+poId+'_'+sku);const reasonEl=document.getElementById('adjm_reason_'+poId+'_'+sku);
 const qty=parseInt(qtyEl?qtyEl.value:0)||0;const reason=(reasonEl?reasonEl.value:'').trim();
 if(!qty)return;
 const p=PRODUCTS.find(x=>x.sku===sku);if(p)p.total+=qty;
 MOVEMENTS.unshift({id:'TXN-'+(9900+MOVEMENTS.length),date:TODAY,time:'—',type:'ADJUST',sku,name:line.name,qty,bin:'—',lot:'—',ref:poId,user:(LANG==='es'?'Ajuste':'Adjustment')});
 INV_ADJUSTMENTS.unshift({date:TODAY,sku,name:line.name,delta:qty,reason:reason||((LANG==='es'?'Ajuste manual · ':'Manual adjustment · ')+poId),source:poId});
 PO_ADJUSTMENTS.unshift({id:'ADJ-'+(9000+PO_ADJUSTMENTS.length),poId,sku,name:line.name,type:'manual',qty,note:reason||'—',date:TODAY});
 toast((LANG==='es'?'Ajuste aplicado: ':'Adjustment applied: ')+(qty>0?'+':'')+qty+' '+sku);go('ajustealm',true)};

/* ===== RECOLECCIÓN Y EMPAQUE =====
   Modelo ad hoc: no parte de una orden existente. Se escogen uno o más productos (multi-select
   buscable, mismo componente `msel` que el resto de los filtros del producto — pedido explícito de
   Luis) y se procesan como recolectados (baja el inventario al momento, MOVEMENTS tipo Despacho).
   Un solo listado (sin pestañas: Luis pidió quitar la de Empaque) trae cada recolección con su
   propia acción "Empacar" — un modal que es, literalmente, crear una orden en Operación (cliente,
   consignatario, servicio, tipo/cantidad de paquete y COD), reusando el mismo autocompletar de
   consignatario y las mismas listas svcs/pkgs de Entrada de órdenes. La orden nace en `ORDERS` — la
   misma tabla que usa Operación — así que aparece de inmediato en Órdenes/Entrada, sin una segunda
   implementación. Cada item ya empacado muestra el número de la orden; eliminar un item (recolección
   sin empacar, o empaque cuya orden sigue en "Entrada") restaura el inventario con un movimiento
   compensatorio — nunca se edita ni se borra el ledger, mismo principio del resto del sistema. */
let PICK_BATCH_SEQ=7700;
let PICK_BATCHES=[
 {id:'PK-7701', date:isoDaysAgo(1), lines:[{sku:'GLU-STR',name:'Tiras reactivas Accu-Trend',qty:2}], status:'packed', orderInv:'AX-48217', clientInvoice:'FAC-8801', packedDate:isoDaysAgo(1)},

 if(!lines.length){toast(LANG==='es'?'Agrega al menos un producto':'Add at least one product');return}

 PICK_BATCH_SEQ++;const id='PK-'+PICK_BATCH_SEQ;
 lines.forEach(l=>{const pr=PRODUCTS.find(x=>x.sku===l.sku);if(pr)pr.total=Math.max(0,pr.total-l.qty);
  MOVEMENTS.unshift({id:'TXN-'+(9800+MOVEMENTS.length),date:TODAY,time:'—',type:'DISPATCH',sku:l.sku,name:l.name,qty:-l.qty,bin:'—',lot:'—',ref:id,user:(LANG==='es'?'Recolección':'Picking')})});
 PICK_BATCHES.unshift({id,date:TODAY,lines,status:'collected',orderInv:null,packedDate:null});
 PICK_DRAFT=[];

 go('picking',true)};

/* --- eliminar una recoleccion (todavia sin empacar) o su empaque, si la orden sigue en "Entrada" ---
   Mismo principio del modulo 2 (Ordenes): una orden solo se puede eliminar en su estatus inicial
   ("cap" = Entrada, antes de escanearse/asignarse a un trip). Eliminar aqui, ademas, restaura el
   inventario que la recoleccion habia descontado -- nunca se edita el ledger, se compensa con un
   movimiento nuevo. */
window.deletePickBatch=(id)=>{const b=PICK_BATCHES.find(x=>x.id===id);if(!b)return;
 if(b.status==='packed'){
  const ord=ORDERS.find(o=>o.inv===b.orderInv);
  if(!ord||ord.st!=='cap'){toast(LANG==='es'?'Ya no se puede eliminar \u2014 la orden avanz\u00f3 de estatus':'Can\u2019t delete anymore \u2014 the order moved past its initial status');return}
  ORDERS.splice(ORDERS.indexOf(ord),1);
 }
 b.lines.forEach(l=>{const pr=PRODUCTS.find(x=>x.sku===l.sku);if(pr)pr.total+=l.qty;
  MOVEMENTS.unshift({id:'TXN-'+(9800+MOVEMENTS.length),date:TODAY,time:'\u2014',type:'ADJUST',sku:l.sku,name:l.name,qty:l.qty,bin:'\u2014',lot:'\u2014',ref:b.id,user:(LANG==='es'?'Recolecci\u00f3n eliminada':'Pick deleted')})});
 PICK_BATCHES=PICK_BATCHES.filter(x=>x.id!==id);
 toast((LANG==='es'?'Eliminado: ':'Deleted: ')+id);
 renderTable();
 go('picking',true)};

 const ord=ORDERS.find(o=>o.inv===b.orderInv);return !!ord&&ord.st==='cap'}

/* ===== CONTABILIZACIÓN DE COMPRAS Y DE DESPACHOS =====
   Primeras dos pantallas del grupo Contabilidad (pedido explícito de Luis: "la primera opción debe ser
   para ver, aceptar/guardar y exportar esa información de contabilidad"). Fuente de cada una:
   (a) Compras — recepciones ya confirmadas contra una orden de compra real (RECEIPTS origin='po',
       status='done'), es decir inventario que Advance de verdad compró para revender, no carga de un
       cliente de paso.
   (b) Despachos — lotes de Recolección y empaque ya empacados (PICK_BATCHES status='packed'), es decir
       inventario propio de Advance que salió por una orden.
   Mismo principio de "la plataforma calcula y exporta" que Facturación/Liquidación/Remesa, con un flujo
   más corto porque aquí no hay tarifas que reconciliar, solo costo ya congelado en la recepción/PO:
   Generada → Aceptada → Exportada. El archivo de exportación es configurable (columnas, formato,
   delimitador, formato de fecha) y la configuración se guarda como plantilla reusable entre corridas
   futuras — pedido explícito de Luis ("el archivo de exportación debe ser configurable y estas
   configuraciones deberá poder ser guardada para uso futuro"). */
const ACCT_FIELDS={
 compras:[{k:'date',es:'Fecha',en:'Date'},{k:'ref',es:'Compra (PO)',en:'Purchase (PO)'},{k:'party',es:'Proveedor',en:'Supplier'},{k:'sku',es:'SKU',en:'SKU'},{k:'product',es:'Producto',en:'Product'},{k:'qty',es:'Cantidad recibida',en:'Qty received'},{k:'unitCost',es:'Costo unitario',en:'Unit cost'},{k:'totalCost',es:'Costo total',en:'Total cost'},{k:'warehouse',es:'Almacén',en:'Warehouse'}],
 despacho:[{k:'date',es:'Fecha',en:'Date'},{k:'ref',es:'Empaque / Orden',en:'Pack / Order'},{k:'party',es:'Cliente',en:'Client'},{k:'sku',es:'SKU',en:'SKU'},{k:'product',es:'Producto',en:'Product'},{k:'qty',es:'Cantidad despachada',en:'Qty dispatched'},{k:'unitCost',es:'Costo unitario',en:'Unit cost'},{k:'totalCost',es:'Costo total',en:'Total cost'},{k:'warehouse',es:'Almacén',en:'Warehouse'}],
 facturacion:[{k:'date',es:'Fecha',en:'Date'},{k:'ref',es:'Orden',en:'Order'},{k:'cons',es:'Consignatario',en:'Consignee'},{k:'city',es:'Ciudad',en:'City'},{k:'pkg',es:'Paquete',en:'Package'},{k:'svc',es:'Servicio',en:'Service'},{k:'items',es:'Piezas',en:'Pieces'},{k:'priceItem',es:'Base',en:'Base'},{k:'priceOver',es:'Extra',en:'Extra'},{k:'priceCod',es:'Cargo COD',en:'COD fee'},{k:'priceAdj',es:'Ajuste',en:'Adjustment'},{k:'total',es:'Total',en:'Total'}],
 liquidacion:[{k:'date',es:'Fecha',en:'Date'},{k:'ref',es:'Referencia',en:'Reference'},{k:'type',es:'Tipo',en:'Type'},{k:'desc',es:'Detalle',en:'Detail'},{k:'adj',es:'Ajuste',en:'Adjustment'},{k:'total',es:'Total',en:'Total'}],
};
let ACCT_TEMPLATES=[
 {id:'TPL-COMP-1',scope:'compras',name:'Formato estándar',format:'CSV',delim:',',dateFmt:'YYYY-MM-DD',header:true,cols:['date','ref','party','sku','product','qty','unitCost','totalCost','warehouse']},
 {id:'TPL-DISP-1',scope:'despacho',name:'Formato estándar',format:'CSV',delim:',',dateFmt:'YYYY-MM-DD',header:true,cols:['date','ref','party','sku','product','qty','unitCost','totalCost','warehouse']},
 {id:'TPL-FACT-1',scope:'facturacion',name:'Formato estándar',format:'CSV',delim:',',dateFmt:'YYYY-MM-DD',header:true,cols:['date','ref','cons','pkg','svc','items','priceItem','priceOver','priceCod','priceAdj','total']},
 {id:'TPL-LIQ-1',scope:'liquidacion',name:'Formato estándar',format:'CSV',delim:',',dateFmt:'YYYY-MM-DD',header:true,cols:['date','ref','type','desc','adj','total']},
];
let ACCT_TPL_SEQ=4;
let ACCT_TPL_SEL={compras:'TPL-COMP-1',despacho:'TPL-DISP-1',facturacion:'TPL-FACT-1',liquidacion:'TPL-LIQ-1'};
const ACCT_SCREEN_OF={compras:'comprascont',despacho:'despachocont',facturacion:'facturacion',liquidacion:'liquidacion'};
window.setAcctTpl=(scope,id)=>{ACCT_TPL_SEL[scope]=id;go(ACCT_SCREEN_OF[scope],true)};
function acctFmtDate(iso,fmt){if(!iso)return '';const parts=iso.split('-');const y=parts[0],m=parts[1],d=parts[2];
 if(fmt==='MM/DD/YYYY')return m+'/'+d+'/'+y; if(fmt==='DD/MM/YYYY')return d+'/'+m+'/'+y; return iso}
function acctRowValue(row,key,tpl){if(key==='date')return acctFmtDate(row.date,tpl.dateFmt);
 if(key==='unitCost')return row.unitCost.toFixed(2); if(key==='totalCost')return (row.qty*row.unitCost).toFixed(2);
 const v=row[key]; return typeof v==='number'?v.toFixed(2):v}
function acctFileText(rows,tpl){const fields=ACCT_FIELDS[tpl.scope];const cols=tpl.cols.map(k=>fields.find(f=>f.k===k)).filter(Boolean);
 const sep=tpl.format==='TXT'?'\t':tpl.delim;
 const lines=[];
 if(tpl.header)lines.push(cols.map(f=>LANG==='es'?f.es:f.en).join(sep));
 rows.forEach(r=>lines.push(cols.map(f=>acctRowValue(r,f.k,tpl)).join(sep)));
 return lines.join('\n')}
window.openAcctExportDoc=(kind,id)=>{const runs=kind==='compras'?ACCTPURCH_RUNS:ACCTDESP_RUNS;const run=runs.find(x=>x.id===id);if(!run)return;
 const es=LANG==='es';const tpl=ACCT_TEMPLATES.find(x=>x.id===ACCT_TPL_SEL[kind]);
 const total=run.rows.reduce((s,r)=>s+r.qty*r.unitCost,0);
 document.getElementById('genModal').style.width='620px';
 document.getElementById('genModal').innerHTML=`<div class="pi" style="justify-content:space-between"><b style="font-size:15px">${ic('doc')} ${es?'Exportar a contabilidad':'Export to accounting'}</b><button class="x" onclick="closeGenModal()" style="border:none;background:transparent;color:var(--faint);width:28px;height:28px;border-radius:8px">✕</button></div>
 <div class="pb">
  <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">${es?'Corrida':'Run'} <span class="ref">${run.id}</span> · ${run.from} → ${run.to} · ${es?'Plantilla':'Template'}: <b style="color:var(--text)">${tpl.name}</b> (${tpl.format})</div>
  <pre style="background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:11.5px;line-height:1.6;overflow:auto;max-height:260px;white-space:pre">${acctFileText(run.rows,tpl)}</pre>

const MOV_TYPES = {

function movTypeLabel(k){const m=MOV_TYPES[k];return m?(LANG==='es'?m.es:m.en):k}

 const nm=sku=>{const p=PRODUCTS.find(x=>x.sku===sku);return p?p.name:sku};

 push(2,'16:48','DISPATCH','GLU-100',-3,'A-01','—','AX-48216','Auto');
 push(3,'11:15','ADJUST','LBL-4X6',2,'A-03','—','manual','Luis C.');
})();
let LF = {type:[], product:[], from:'', to:'', wh:[], bin:[], cat:[]};
window.setLF=(k,v)=>{LF[k]=v;go('ledger',true)};

function whOfBin(bin){const b=BINS.find(x=>x.code===bin);if(b){const z=ZONES.find(z2=>z2.code===b.zone);if(z){const w=WAREHOUSES.find(x=>x.code===z.wh);return w?w.name:z.wh}}return WAREHOUSES[0].name}
function ledger(){const es=LANG==='es';
 const typeOptions=Object.keys(MOV_TYPES).map(movTypeLabel);
 const binOpts=[...new Set(MOVEMENTS.map(m=>m.bin))].sort();
 const rows = MOVEMENTS
   .filter(m=>{const p=PRODUCTS.find(x=>x.sku===m.sku);return (!LF.type.length||LF.type.includes(movTypeLabel(m.type)))
     &&(!LF.product.length||productMatchesSku(m.sku,LF.product))
     &&(!LF.wh.length||LF.wh.includes(whOfBin(m.bin)))
     &&(!LF.bin.length||LF.bin.includes(m.bin))
     &&(!LF.cat.length||(p&&LF.cat.includes(p.cat)))
     &&(!LF.from||m.date>=LF.from)&&(!LF.to||m.date<=LF.to)})
   .sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 const inTot=rows.filter(m=>m.qty>0).reduce((s,m)=>s+m.qty,0);
 const outTot=rows.filter(m=>m.qty<0).reduce((s,m)=>s+m.qty,0);
 return `<div class="head"><div><h1>${t('nav.ledger')[0]}</h1><p>${t('nav.ledger')[1]}</p></div></div>
  <div class="note" style="margin-bottom:14px">${ic('doc')} ${es?'El ledger es la fuente de verdad del stock: cada recepción, despacho, transferencia, ajuste y cross-dock escribe aquí. El balance de inventario siempre se reconstruye de estos movimientos — esta vista es de solo lectura.':'The ledger is the single source of truth for stock: every receipt, dispatch, transfer, adjustment and cross-dock writes here. Inventory balance is always rebuilt from these movements — this view is read-only.'}</div>
  <div class="filters" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
   <div class="f"><label>${es?'Desde':'From'}</label><input type="date" value="${LF.from}" onchange="setLF('from',this.value)"></div>
   <div class="f"><label>${es?'Hasta':'To'}</label><input type="date" value="${LF.to}" onchange="setLF('to',this.value)"></div>
   <div class="f"><label>${es?'Almacén':'Warehouse'}</label>${msel('lfwh',WAREHOUSES.map(w=>w.name),LF.wh,v=>setLF('wh',v),t('entry.f.all'))}</div>
   <div class="f"><label>${es?'Ubicación':'Location'}</label>${msel('lfbin',binOpts,LF.bin,v=>setLF('bin',v),t('entry.f.all'))}</div>
   <div class="f"><label>${es?'Producto':'Product'}</label>${msel('lfprod',productOptions(),LF.product,v=>setLF('product',v),t('entry.f.all'))}</div>
   <div class="f"><label>${es?'Categoría':'Category'}</label>${msel('lfcat',PRODCATS,LF.cat,v=>setLF('cat',v),t('entry.f.all'))}</div>
   <div class="f"><label>${es?'Tipo':'Type'}</label>${msel('lftype',typeOptions,LF.type,v=>setLF('type',v),t('entry.f.all'))}</div>
   <button class="btn sm" style="justify-self:start" onclick="LF={type:[],product:[],from:'',to:'',wh:[],bin:[],cat:[]};go('ledger',true)">${t('entry.f.clear')}</button>
  </div>
  <div class="burst" style="margin-bottom:14px">
    <div class="t"><small>${es?'Movimientos':'Movements'}</small><b>${rows.length}</b></div><div class="vr"></div>
    <div class="t"><small>${es?'Entradas (uds)':'In (units)'}</small><b style="color:var(--flow-2)">+${inTot}</b></div><div class="vr"></div>
    <div class="t"><small>${es?'Salidas (uds)':'Out (units)'}</small><b style="color:var(--danger)">${outTot}</b></div>
  </div>
  <div class="panel"><div class="ph2">${ic('doc')} ${t('nav.ledger')[0]} <span class="r">${rows.length}</span></div>
   <div style="overflow:auto;max-height:460px"><table class="lst"><thead><tr>
    ${sortTh('ledger','date',es?'Fecha':'Date')}${sortTh('ledger','time',es?'Hora':'Time')}${sortTh('ledger','type',es?'Tipo':'Type')}${sortTh('ledger','sku','SKU')}${sortTh('ledger','name',es?'Producto':'Product')}${sortTh('ledger','qty',es?'Cantidad':'Qty',1)}${sortTh('ledger','bin',es?'Posición':'Bin')}${sortTh('ledger','lot',es?'Lote/Serie':'Lot/Serial')}${sortTh('ledger','ref',es?'Origen':'Source')}${sortTh('ledger','user',es?'Usuario':'User')}
   </tr></thead><tbody>
   ${applySort('ledger',rows,'date').map(m=>`<tr><td class="mono">${m.date.slice(5)}</td><td class="mono">${m.time}</td><td><span class="chip ${MOV_TYPES[m.type].cls}">${movTypeLabel(m.type)}</span></td><td><span class="ref">${m.sku}</span></td><td>${m.name}</td><td class="n mono" style="color:${m.qty<0?'var(--danger)':'var(--flow-2)'};font-weight:600">${m.qty>0?'+':''}${m.qty}</td><td class="mono">${m.bin}</td><td class="mono">${m.lot}</td><td><span class="ref" style="font-size:11px">${m.ref}</span></td><td style="color:var(--muted);font-size:12px">${m.user}</td></tr>`).join('')}
   </tbody></table></div>
   ${rows.length?'':`<div class="empty" style="min-height:160px"><div>${ic('doc')}<p style="margin-top:8px">${t('ui.mselNone')}</p></div></div>`}
  </div>`}

/* --- Conteo cíclico (modo informado) --- */
let CYCLE = [];
(function(){let seq=3400;
 BINS.filter(b=>b.stock.length).slice(0,6).forEach(b=>{
   CYCLE.push({id:'CC-'+(seq++),bin:b.code,zone:b.zone,status:'pending',
     lines:b.stock.map(s=>{const p=PRODUCTS.find(x=>x.sku===s.sku);return {sku:s.sku,name:p?p.name:s.sku,expected:s.qty,counted:s.qty}})});
 });
})();
let CCSEL = CYCLE.length?CYCLE[0].id:null;
window.selectCount=id=>{CCSEL=id;go('conteo',true)};
window.setCounted=(idx,val)=>{const c=CYCLE.find(x=>x.id===CCSEL);if(!c)return;c.lines[idx].counted=parseInt(val)||0;
  const el=document.getElementById('ccvar-'+idx);if(el){const d=c.lines[idx].counted-c.lines[idx].expected;el.textContent=(d>0?'+':'')+d;el.style.color=d===0?'var(--muted)':'var(--danger)'}};
window.confirmCount=()=>{const c=CYCLE.find(x=>x.id===CCSEL);if(!c||c.status==='done')return;
 let adj=0;
 c.lines.forEach(l=>{const d=l.counted-l.expected;if(d!==0){adj++;
   MOVEMENTS.unshift({id:'TXN-'+(9500+MOVEMENTS.length),date:TODAY,time:'—',type:'ADJUST',sku:l.sku,name:l.name,qty:d,bin:c.bin,lot:'—',ref:c.id,user:'Conteo'});
   INV_ADJUSTMENTS.unshift({date:TODAY,sku:l.sku,name:l.name,delta:d,reason:(LANG==='es'?'Conteo cíclico ':'Cycle count ')+c.id,source:c.id});
   const p=PRODUCTS.find(x=>x.sku===l.sku);if(p)p.total+=d;
 }});
 c.status='done';
 toast((LANG==='es'?'Conteo ':'Count ')+c.id+' — '+(adj?adj+(LANG==='es'?' ajuste(s) al ledger':' adjustment(s) to ledger'):(LANG==='es'?'sin varianza':'no variance')));
 go('conteo',true)};

let CCF={wh:[],bin:[],product:[],cat:[]};window.setCCF=(k,v)=>{CCF[k]=v;go('conteo',true)};
let CCQ=''; // búsqueda libre en tareas de conteo
window.setCCQ=(v)=>{CCQ=v;go('conteo',true)};
function conteo(){const es=LANG==='es';
 const sel = CYCLE.find(x=>x.id===CCSEL);
 const stcls2={pending:'s-cap',done:'s-deliv'};
 const stlbl=s=>s==='done'?(es?'Ajustado':'Adjusted'):(es?'Pendiente':'Pending');
 const ccBinOpts=[...new Set(CYCLE.map(c=>c.bin))];
 const ccListF=CYCLE.filter(c=>(!CCF.wh.length||CCF.wh.includes(whOfBin(c.bin)))&&(!CCF.bin.length||CCF.bin.includes(c.bin))&&(!CCF.product.length||c.lines.some(l=>{const p=PRODUCTS.find(x=>x.sku===l.sku);return p&&CCF.product.includes(productLabel(p))}))&&(!CCF.cat.length||c.lines.some(l=>{const p=PRODUCTS.find(x=>x.sku===l.sku);return p&&CCF.cat.includes(p.cat)})));
 const ccList=ccListF.filter(c=>matchesQ([c.id,c.bin,c.zone,stlbl(c.status),c.lines.length,...c.lines.map(l=>l.sku+' '+l.name)],CCQ));
 return `<div class="head"><div><h1>${t('nav.conteo')[0]}</h1><p>${t('nav.conteo')[1]}</p></div>
   <div class="act"><span class="tag">${es?'Modo: informado':'Mode: informed'}</span></div></div>
  <div class="note" style="margin-bottom:14px">${ic('clip')} ${es?'Conteo informado: el operador ve la cantidad esperada mientras cuenta. La varianza se calcula al vuelo y, al confirmar, la diferencia se registra como ajuste en el ledger (InventoryTransaction) — nada se ajusta fuera de él.':'Informed count: the operator sees the expected quantity while counting. Variance is computed on the fly and, on confirm, the difference is written as an adjustment to the ledger (InventoryTransaction) — nothing is adjusted outside it.'}</div>
  <div class="filters" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
   <div class="f"><label>${es?'Almacén':'Warehouse'}</label>${msel('ccfwh',WAREHOUSES.map(w=>w.name),CCF.wh,v=>setCCF('wh',v),t('entry.f.all'))}</div>
   <div class="f"><label>${es?'Ubicación':'Location'}</label>${msel('ccfbin',ccBinOpts,CCF.bin,v=>setCCF('bin',v),t('entry.f.all'))}</div>
   <div class="f"><label>${es?'Producto':'Product'}</label>${msel('ccfprod',productOptions(),CCF.product,v=>setCCF('product',v),t('entry.f.all'))}</div>
   <div class="f"><label>${es?'Categoría':'Category'}</label>${msel('ccfcat',PRODCATS,CCF.cat,v=>setCCF('cat',v),t('entry.f.all'))}</div>
   <button class="btn sm" style="justify-self:start" onclick="CCF={wh:[],bin:[],product:[],cat:[]};go('conteo',true)">${t('entry.f.clear')}</button>
  </div>
  <div class="cols" style="grid-template-columns:320px 1fr">
   <div class="panel"><div class="ph2">${ic('clip')} ${es?'Tareas de conteo':'Count tasks'} <span class="r">${ccList.length}</span></div>
    <div class="qrow">${qbox('ccq',CCQ,t('ui.mselSearch'),"setCCQ(this.value)")}</div>
    <div style="max-height:460px;overflow:auto">${ccList.map(c=>{const varc=c.status==='done'?c.lines.reduce((s,l)=>s+Math.abs(l.counted-l.expected),0):null;
      return `<div class="unrow" style="cursor:pointer;${c.id===CCSEL?'background:var(--flow-bg)':''}" onclick="selectCount('${c.id}')"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><span class="ref">${c.bin}</span><span class="chip ${stcls2[c.status]}" style="margin-left:auto">${stlbl(c.status)}</span></div><div class="meta">${c.id} · ${es?'Zona':'Zone'} ${c.zone} · ${c.lines.length} ${es?'productos':'items'}${varc!=null?' · '+(es?'var ':'var ')+varc:''}</div></div></div>`}).join('')}</div></div>
   <div class="panel">${sel?`<div class="ph2">${ic('clip')} ${es?'Conteo':'Count'} · <span class="ref">${sel.bin}</span> <span class="r">${sel.id}</span></div>
    <div style="overflow:auto;max-height:360px"><table class="lst"><thead><tr><th>SKU</th><th>${es?'Producto':'Product'}</th><th class="n">${es?'Esperado':'Expected'}</th><th class="n">${es?'Contado':'Counted'}</th><th class="n">${es?'Varianza':'Variance'}</th></tr></thead><tbody>
    ${sel.lines.map((l,i)=>{const d=l.counted-l.expected;return `<tr><td><span class="ref">${l.sku}</span></td><td>${l.name}</td><td class="n mono">${l.expected}</td><td class="n"><input class="mono" style="width:74px;text-align:right;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;color:var(--text)" value="${l.counted}" ${sel.status==='done'?'disabled':''} oninput="setCounted(${i},this.value)"></td><td class="n mono" id="ccvar-${i}" style="color:${d===0?'var(--muted)':'var(--danger)'}">${d>0?'+':''}${d}</td></tr>`}).join('')}
    </tbody></table></div>
    ${sel.status==='done'?`<div class="note" style="margin:14px 16px;border-color:var(--money-line);color:var(--money-2)">${ic('check')} ${es?'Conteo cerrado. Los ajustes ya están en el Kárdex de movimientos.':'Count closed. Adjustments are already in the Movement ledger.'}</div>`:`<div class="note" style="margin:14px 16px">${es?('Al confirmar, cada línea con varianza genera un ajuste enlazado a este conteo ('+sel.id+').'):('On confirm, each line with variance generates an adjustment linked to this count ('+sel.id+').')}</div><div style="padding:0 16px 16px"><button class="btn flow" style="width:100%;justify-content:center" onclick="confirmCount()">${ic('check')} ${es?'Confirmar conteo y ajustar':'Confirm count & adjust'}</button></div>`}`
    :`<div class="empty" style="min-height:260px"><div>${ic('clip')}<p style="margin-top:8px">${es?'Selecciona una tarea de conteo':'Select a count task'}</p></div></div>`}</div>
  </div>`}

function crossdock(){const es=LANG==='es';
 const dockType=ty=>ty==='inbound'?(es?'Entrada':'Inbound'):ty==='outbound'?(es?'Salida':'Outbound'):(es?'Ambos':'Both');
 const apptSt=s=>({arrived:es?'Llegó':'Arrived',loading:es?'Cargando':'Loading',scheduled:es?'Programada':'Scheduled'})[s];

     return {fu,v,km,date:fu.date,plate:v?v.plate:fu.vehicle,liters:fu.liters,cost:fu.cost,kml:km!=null?km/fu.liters:null,costKm:km!=null?fu.cost/km:null}}),'date').map(({fu,v,km,kml,costKm})=>`<tr><td class="mono">${fu.date}</td><td>${v?v.plate:fu.vehicle}</td><td class="n mono">${fu.liters}</td><td class="n mono">$${money(fu.cost)}</td><td class="n mono">${km!=null?km.toLocaleString():'—'}</td><td class="n mono">${kml!=null?kml.toFixed(1):'—'}</td><td class="n mono">${costKm!=null?'$'+costKm.toFixed(2):'—'}</td></tr>`).join('')}

 } else {

/* El secreto completo (mock: 28 caracteres alfanuméricos con prefijo tk_live_) solo se genera y se
   muestra UNA vez, justo al crear la key — mismo patrón que cualquier proveedor real de API keys.
   Después solo se guarda un prefijo enmascarado (`prefix`); nadie, ni el propio dueño, lo puede
   volver a ver completo desde la pantalla — tendría que revocarla y crear una nueva. */
function genApiKeySecret(){const chars='abcdefghijklmnopqrstuvwxyz0123456789';let s='';for(let i=0;i<28;i++)s+=chars[Math.floor(Math.random()*chars.length)];return 'tk_live_'+s}
let REVEAL_SECRET=null;
window.saveApiKey=()=>{const it=t('integ');
 const nameEl=document.getElementById('akb_name');const name=(nameEl?nameEl.value:'').trim();
 if(!name){toast(it.needName);return}
 if(!AKB.scopes.length){toast(it.needScope);return}
 const secret=genApiKeySecret();
 API_KEY_SEQ++;const id='KEY-'+API_KEY_SEQ;
 API_KEYS.unshift({id,name,prefix:secret.slice(0,14),createdAt:TODAY,lastUsed:null,status:'active',scopes:AKB.scopes.slice()});
 AKB=null;REVEAL_SECRET={id,secret};
 document.getElementById('genModal').innerHTML=renderApiKeyRevealHtml()};
window.copyApiKeySecret=()=>{const it=t('integ');
 if(REVEAL_SECRET&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(REVEAL_SECRET.secret).catch(()=>{});
 toast(it.copiedMsg)};
window.closeApiKeyReveal=()=>{REVEAL_SECRET=null;closeGenModal();go('integraciones',true)};

/* ===== SEGURIDAD Y AUDITORÍA (pedido explícito de Luis: "Llena esas dos partes" sobre la propuesta
   — módulos D y E del diseño maestro: bitácora de cambios, eventos de seguridad, sesiones activas y
   política de MFA del tenant). Dos pestañas: "Actividad" unifica en una sola tabla filtrable lo que
   en el esquema real son dos bitácoras separadas (`AuditLog` = qué cambió, `SecurityEvent` = quién
   intentó qué) — cada fila conserva de cuál de las dos vino con una etiqueta de tipo. Se referencian
   a propósito nombres reales ya sembrados en otras pantallas (Roles y usuarios, Integraciones,
   Choferes, Clientes) para que la bitácora se sienta conectada al resto del mock, y las API keys de
   Integraciones se leen en vivo — revocar una ahí aparece aquí sin duplicar el dato. La segunda
   pestaña, "Sesiones y MFA", cubre las "sesiones revocables" y la política de MFA del tenant. */
let AUDIT_CHANGES=[
 {id:'AC-1', entity:'Cliente', label:'Advance Solutions', field:'Límite de crédito', from:'$5,000.00', to:'$8,000.00', user:'u1', at:isoDaysAgo(1)+'T09:14'},
 {id:'AC-2', entity:'Rol', label:'Despachador', field:'Permisos', from:'ordenes.view, ordenes.manage, despacho.manage', to:'ordenes.view, ordenes.manage, despacho.manage, almacen.view', user:'u1', at:isoDaysAgo(2)+'T11:02'},
 {id:'AC-3', entity:'Chofer', label:'Ramón Díaz', field:'Tarifa por entrega', from:'$3.25', to:'$3.50', user:'u1', at:isoDaysAgo(3)+'T15:40'},
 {id:'AC-4', entity:'Cliente', label:'TRUSS PUERTO RICO', field:'Cargo por COD', from:'Fijo $2.00', to:'2.5% del monto COD', user:'u4', at:isoDaysAgo(5)+'T10:20'},
 {id:'AC-5', entity:'Usuario', label:'Carlos Rivera', field:'Rol', from:'Chofer', to:'Despachador', user:'u1', at:isoDaysAgo(6)+'T08:55'},
 {id:'AC-6', entity:'Plantilla de exportación', label:'Formato estándar (Facturación)', field:'Columnas', from:'10 columnas', to:'12 columnas', user:'u4', at:isoDaysAgo(8)+'T13:12'},
];
let SECURITY_EVENTS=[
 {id:'SE-1', type:'login_ok', user:'u1', detail:null, at:isoDaysAgo(0)+'T08:02'},
 {id:'SE-2', type:'login_fail', user:null, detail:'carlos.rivera@advancelogistics.com', at:isoDaysAgo(0)+'T07:58'},
 {id:'SE-3', type:'perm_denied', user:'u3', detail:'contabilidad.export', at:isoDaysAgo(1)+'T16:20'},
 {id:'SE-4', type:'mfa_enrolled', user:'u4', detail:null, at:isoDaysAgo(15)+'T12:30'},
 {id:'SE-5', type:'role_changed', user:'u1', detail:'Carlos Rivera → Despachador', at:isoDaysAgo(6)+'T08:55'},
 {id:'SE-6', type:'logout', user:'u5', detail:null, at:isoDaysAgo(2)+'T18:10'},
];
function securityEventText(e){const es=LANG==='es';const map={
 login_ok:es?'Inicio de sesión exitoso':'Successful login',
 login_fail:(es?'Intento de inicio de sesión fallido: ':'Failed login attempt: ')+(e.detail||''),
 logout:es?'Cierre de sesión':'Logout',
 perm_denied:(es?'Permiso denegado: ':'Permission denied: ')+pmLabel(e.detail),
 mfa_enrolled:es?'Activó autenticación en dos pasos (MFA)':'Enabled two-factor authentication (MFA)',
 role_changed:(es?'Cambio de rol: ':'Role change: ')+e.detail,
 apikey_created:es?'Se creó la API key: ':'API key created: ',
 apikey_revoked:es?'Se revocó la API key: ':'API key revoked: ',
};return map[e.type]||e.type}
/* Filas derivadas EN VIVO de API_KEYS (Integraciones) en vez de sembradas aparte — revocar una key
   ahí se refleja aquí de inmediato, sin mantener dos copias del mismo hecho. */
function securityActivityRows(){const rows=[];
 AUDIT_CHANGES.forEach(c=>rows.push({id:'chg-'+c.id, type:'change', at:c.at, userId:c.user, userLabel:userName(c.user),
  text:`${c.entity} · ${c.label}: ${c.field} ${LANG==='es'?'de':'from'} ${c.from} ${LANG==='es'?'a':'to'} ${c.to}`}));
 SECURITY_EVENTS.forEach(e=>rows.push({id:'sec-'+e.id, type:'security', subtype:e.type, at:e.at, userId:e.user, userLabel:e.user?userName(e.user):'', text:securityEventText(e)}));
 API_KEYS.forEach(k=>{
  rows.push({id:'key-c-'+k.id, type:'security', subtype:'apikey_created', at:k.createdAt+'T00:00', userId:null, userLabel:'', text:securityEventText({type:'apikey_created'})+k.name});
  if(k.status==='revoked'&&k.revokedAt)rows.push({id:'key-r-'+k.id, type:'security', subtype:'apikey_revoked', at:k.revokedAt+'T00:00', userId:null, userLabel:'', text:securityEventText({type:'apikey_revoked'})+k.name});
 });
 return rows}
/* Exportar Actividad (pedido explícito de Luis: "En Seguridad y auditoria, permite exportar el
   listado del audit log que sale") — a diferencia de los "exportar" de Contabilidad (que simulan el
   archivo con un modal de vista previa porque tienen un ciclo de vida generada→aceptada→exportada
   que demostrar), aquí no hay ningún estado que avanzar: es una descarga real de un CSV con las
   filas actualmente filtradas (respeta el filtro de tipo y el buscador), vía Blob — sigue siendo
   cero-dependencias, es una API nativa del navegador. */
function csvEscape(v){const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
window.exportAuditLog=()=>{const at=t('audit');const es=LANG==='es';
 let rows=applySort('auditact',securityActivityRows(),'at');
 if(SEC_TYPE_FILTER!=='all')rows=rows.filter(r=>r.type===SEC_TYPE_FILTER);
 if(SEC_Q)rows=rows.filter(r=>matchesQ([r.text,r.userLabel],SEC_Q));
 const header=[at.colWhen,at.colType,at.colUser,at.colDetail];
 const lines=[header.map(csvEscape).join(',')];
 rows.forEach(r=>{const typeLabel=r.type==='change'?at.badgeChange:at.badgeEvent;
  lines.push([r.at.replace('T',' '),typeLabel,r.userLabel,r.text].map(csvEscape).join(','))});
 const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='auditoria-'+TODAY+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 toast((es?'Descargando ':'Downloading ')+rows.length+(es?' filas':' rows'))};
function secRowBadge(row){const at=t('audit');
 if(row.type==='change')return `<span class="chip s-disp">${at.badgeChange}</span>`;
 if(['login_fail','perm_denied','apikey_revoked'].includes(row.subtype))return `<span class="chip s-fail">${at.badgeAlert}</span>`;
 return `<span class="chip s-deliv">${at.badgeEvent}</span>`}

   <tbody>${rows.length?rows.map(r=>`<tr><td class="mono" style="font-size:11.5px;white-space:nowrap">${r.at.replace('T',' ')}</td><td>${secRowBadge(r)}</td><td>${r.userId?userName(r.userId):'—'}</td><td style="font-size:12.5px">${r.text}</td></tr>`).join(''):`<tr><td colspan="4" style="text-align:center;color:var(--faint);padding:16px">${at.noneYet}</td></tr>`}</tbody>
  </table></div></div></div>`}

/* ===== AJUSTES DEL TENANT (pedido explícito de Luis: "Llena esas dos partes" — módulo 0B del
   diseño maestro: catálogo de módulos por tenant, más los valores operativos que módulo 2 ya
   documenta como configuración del tenant). Tres bloques: (1) módulos encendidos/apagados
   (`TenantModule`) — cinco de ellos SÍ ocultan/muestran de verdad su pantalla del menú lateral y del
   buscador (`/`) al apagarse/encenderse (WMS, Cross-dock formal, COD, Campos personalizados, Portal
   de clientes) — es la demostración viva de "mostrar/ocultar una capacidad es una fila en una tabla,
   no un deploy"; los demás (Marítimo, Equipos en alquiler, Facturación de alquiler) no tienen
   pantalla propia construida todavía en este mock, así que su toggle solo queda guardado en estado,
   igual que "Última milla" que es el núcleo y no se apaga. (2) valores por defecto — tipo de
   servicio/paquete (`TENANT_DEFAULTS`, ya existían y alimentan Entrada rápida/detallada, ahora
   editables aquí) y máximo de paradas por ruta (`TENANT_MAX_STOPS`, ya usado por `maxStopsFor` en
   Choferes y Monitoreo). (3) pipeline de estatus de órdenes (`StatusCapability`) — ilustrativo: el
   mock no bloquea todavía ninguna acción según esta tabla, solo demuestra que es configurable por
   tenant y no una regla fija en el código. */
/* Pedido explícito de Luis: "En ajustes del tenant pon todos los modulos, no solo los de ejemplo" —
   la primera versión solo traía el catálogo ilustrativo del módulo 0B (8 capacidades de negocio).
   Ahora CADA grupo del menú lateral (`NAV`) tiene su propio módulo — el catálogo completo de "todo
   lo que se puede prender o apagar" en la plataforma, no un subconjunto de ejemplo. "Operación diaria"
   y "Sistema" quedan bloqueados como núcleo (sin Operación no hay nada que ver; sin Sistema no habría
   forma de volver a prender nada) — los demás cinco grupos sí se pueden apagar. Tres módulos viven
   DENTRO de un grupo que sigue encendido (Cross-dock formal dentro de Almacén, COD dentro de
   Contabilidad, Campos personalizados dentro de Análisis) y dependen de que su grupo esté encendido
   primero — mismo mecanismo de dependencia que ya existía para Facturación de alquiler. */
let TENANT_MODULES=[
 {key:'lastmile', dependsOn:null, on:true, locked:true, live:false},
 {key:'wms', dependsOn:null, on:true, locked:false, live:true},
 {key:'crossdock', dependsOn:'wms', on:false, locked:false, live:true},
 {key:'accounting', dependsOn:null, on:true, locked:false, live:true},
 {key:'cod', dependsOn:'accounting', on:true, locked:false, live:true},
 {key:'catalog', dependsOn:null, on:true, locked:false, live:true},
 {key:'analytics', dependsOn:null, on:true, locked:false, live:true},
 {key:'customFields', dependsOn:'analytics', on:true, locked:false, live:true},
 {key:'system', dependsOn:null, on:true, locked:true, live:false},
 {key:'rentalTracking', dependsOn:null, on:true, locked:false, live:false},
 {key:'rentalBilling', dependsOn:'rentalTracking', on:false, locked:false, live:false},
 {key:'maritime', dependsOn:null, on:false, locked:false, live:false},
 {key:'portal', dependsOn:null, on:true, locked:false, live:true},

const NAV_GROUP_MODULE={ops:'lastmile', almacen:'wms', money:'accounting', cat:'catalog', ana:'analytics', sys:'system', portal:'portal'};
const NAV_ITEM_MODULE={crossdock:'crossdock', cod:'cod', campos:'customFields'};
function moduleOn(key){if(!key)return true;const m=TENANT_MODULES.find(x=>x.key===key);return m?m.on:true}
function tenantModuleLabel(key){return t('tenantset').modLabels[key]||key}
window.setTenantModule=(key,on)=>{const at=t('tenantset');const m=TENANT_MODULES.find(x=>x.key===key);if(!m||m.locked)return;
 if(on&&m.dependsOn&&!moduleOn(m.dependsOn)){toast(at.needDependency.replace('{name}',tenantModuleLabel(m.dependsOn)));return}
 m.on=!!on;
 if(!m.on)TENANT_MODULES.filter(x=>x.dependsOn===key).forEach(x=>x.on=false);
 const curGroupMod=NAV_GROUP_MODULE[GROUPOF[CURRENT]];const curItemMod=NAV_ITEM_MODULE[CURRENT];
 const hidden=(curGroupMod&&!moduleOn(curGroupMod))||(curItemMod&&!moduleOn(curItemMod));
 if(hidden){go('pulso');return}
 go('ajustes',true)};

const SCREENS={pulso:home,ordenes:ordenes,entrada:entry,escaneo:scan,despacho:dispatch,envio:record,cod:codbox,vistas:views,campos:camposScreen,indicadores:indicadoresScreen,graficos:graficosScreen,impresoras:printers,monitoreo:monitoreo,almacenes:almacenes,ubicaciones:ubicaciones,inventario:inventario,compras:compras,recibo:recibo,ajustealm:ajustesAlmacen,picking:picking,crossdock:crossdock,conteo:conteo,ledger:ledger,facturacion:facturacion,choferes:choferes,liquidacion:liquidacion,clientes:clientes,consignatarios:consignatarios,flota:flota,portalHome:portalHome,portalEntrada:portalEntrada,portalCons:portalConsignatarios,portalConfig:portalConfig,portalPerfil:portalPerfil,comprascont:comprasContabilidad,despachocont:despachoContabilidad,usuarios:usuariosScreen,integraciones:integracionesScreen,auditoria:auditoriaScreen,ajustes:ajustesScreen};
function go(v,keepF){
  /* changingScreen distingue una NAVEGACIÓN real de un re-render en el mismo lugar (edición de un
     campo, un refresh periódico como tickMonitor, o un filtro/búsqueda en vivo). Solo en una
     navegación real tiene sentido saltar al tope de la página y forzar qué grupo del menú lateral
     está expandido — de lo contrario un refresh periódico (ej. monitoreo cada 4s) le cierra al
     usuario un grupo del menú que había abierto manualmente a mitad de sesión. */
  const changingScreen = v!==CURRENT;
  const active=document.activeElement;
  const focusId=(active&&active.id&&/^(INPUT|TEXTAREA)$/.test(active.tagName))?active.id:null;
  const selStart=focusId&&active.selectionStart!=null?active.selectionStart:null;
  const selEnd=focusId&&active.selectionEnd!=null?active.selectionEnd:null;
  if(!keepF){
    if(v==='portalEntrada'&&CURRENT!=='portalEntrada'){F={from:TODAY,to:TODAY,inv:'',cons:'',client:'',svc:'',pkg:'',town:'',zip:'',invoice:'',pack:''}}
    if(v==='ordenes'&&CURRENT!=='ordenes'){F={from:'',to:'',inv:'',cons:'',client:'',svc:'',pkg:'',town:'',zip:'',invoice:'',pack:''};ORD_ENTRY_OPEN=false}
  }
  if(changingScreen&&v!=='portalEntrada')ENTRY_SCOPE_CLIENT=null; // salir de la entrada del portal limpia el alcance por cliente
  CURRENT=v;const f=SCREENS[v]||(()=>stub(v));document.getElementById('wrap').innerHTML=f();
  if(changingScreen)window.scrollTo(0,0);
  /* El editor de entrada (quick/detail) inicializa su propio DOM vivo (#bbody con inputs para el modo
     rápido, o el ticket en vivo del modo detallado) — se dispara tanto en el Portal (pantalla propia,
     `portalEntrada`) como en Órdenes cuando su sección de "Nueva orden" está abierta (ver
     ORD_ENTRY_OPEN, consolidación de Órdenes + Entrada de órdenes). */
  if((v==='portalEntrada'||(v==='ordenes'&&ORD_ENTRY_OPEN))&&ENTRYMODE==='quick')initQuick();
  if((v==='portalEntrada'||(v==='ordenes'&&ORD_ENTRY_OPEN))&&ENTRYMODE==='detail')initDetail();
  if(v==='escaneo')setTimeout(()=>{const i=document.getElementById('scanin');if(i){i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doScan()}})}},60);
  if(v==='cod'&&!keepF)setTimeout(()=>{const i=document.getElementById('codscan');if(i)i.focus()},60);
  /* restaura el foco + posición del cursor en el campo que el usuario estaba escribiendo (ej. un
     qbox de búsqueda en vivo) para que un re-render en el mismo lugar no le "coma" cada letra */
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus({preventScroll:true});if(selStart!=null&&el.setSelectionRange){try{el.setSelectionRange(selStart,selEnd)}catch(e){}}}}
  if(changingScreen&&GROUPOF[v])openGroup=GROUPOF[v];
  buildSidebar();hydrate();closePal();refreshAI()}
window.go=go;

/* ===== sidebar ===== */
/* Filtrado por módulo del tenant (pedido explícito de Luis, "Ajustes del tenant" — ver
   TENANT_MODULES/NAV_GROUP_MODULE/NAV_ITEM_MODULE más abajo): un grupo o un ítem cuyo módulo está
   apagado desaparece del menú lateral y del buscador — "mostrar/ocultar una capacidad es una fila en
   una tabla, no un deploy" (módulo 0B del diseño maestro). Un grupo se oculta completo cuando su
   módulo está apagado (WMS→almacen, Portal→portal); dentro de un grupo que sigue visible, un ítem
   puntual también puede ocultarse solo (Cross-dock, COD, Campos personalizados). Las pantallas en sí
   no se bloquean si se llega a ellas por otro medio (ej. un enlace directo) — solo la navegación. */
function navGroupVisible(gk){return moduleOn(NAV_GROUP_MODULE[gk])}
function navItemVisible(v){return moduleOn(NAV_ITEM_MODULE[v])}
function buildSidebar(){const nav=document.getElementById('rnav');nav.innerHTML=NAV.filter(([gk])=>navGroupVisible(gk)).map(([gk,gi,items])=>{
  const vis=items.filter(navItemVisible);if(!vis.length)return '';
  return `<div class="grp ${openGroup===gk?'open':''}">
    <button class="grp-h" onclick="toggleGroup('${gk}')"><span class="gi">${ic(gi)}</span><span class="lbl">${t('g.'+gk)}</span><span class="chev">${ic('chev')}</span></button>
    <div class="grp-items">${vis.map(v=>`<div class="navit ${CURRENT===v?'on':''}" onclick="go('${v}')"><span class="di"></span><span>${t('nav.'+v)[0]}</span></div>`).join('')}</div>
  </div>`}).join('')}
window.toggleGroup=gk=>{const app=document.getElementById('app');if(app.classList.contains('col')){app.classList.remove('col')}openGroup=openGroup===gk?'':gk;buildSidebar();hydrate()}

/* ===== palette ===== */
const scrim=document.getElementById('scrim'),palq=document.getElementById('palq'),pll=document.getElementById('pll');
let flat=[],cur=0;
function renderPal(q=''){pll.innerHTML='';flat=[];q=q.toLowerCase();
  NAV.filter(([gk])=>navGroupVisible(gk)).forEach(([gk,,items])=>{const hits=items.filter(v=>navItemVisible(v)&&(t('nav.'+v)[0]+t('nav.'+v)[1]+v).toLowerCase().includes(q));if(!hits.length)return;
    const g=document.createElement('div');g.className='pgrp';g.textContent=t('g.'+gk);pll.appendChild(g);
    hits.forEach(v=>{const i=flat.length;flat.push(v);const d=document.createElement('div');d.className='it';d.dataset.i=i;
      d.innerHTML=`<div class="pic">${ic(ICONOF[v])}</div><div><div class="nm">${t('nav.'+v)[0]}</div><div class="ds">${t('nav.'+v)[1]}</div></div><div class="go">↵</div>`;
      d.onclick=()=>go(v);pll.appendChild(d)})});cur=0;mark()}
function mark(){[...pll.querySelectorAll('.it')].forEach(el=>el.classList.toggle('on',+el.dataset.i===cur));const on=pll.querySelector('.it.on');if(on)on.scrollIntoView({block:'nearest'})}
/* `seed` precarga el buscador con un texto ya escrito (lo usa el input de la barra superior cuando
   lo que se tecleó/escaneó no fue un número de orden reconocido, ver #cmdinput más abajo) — se
   valida que sea string porque el botón cmdbtn llama a openPal() directo desde un onclick, que le
   pasaría el propio evento del clic como primer argumento si no se filtrara. */
function openPal(seed){const s=typeof seed==='string'?seed:'';scrim.classList.add('on');palq.value=s;palq.placeholder=t('ui.palAsk');renderPal(s);
 setTimeout(()=>{palq.focus();if(s){try{palq.setSelectionRange(s.length,s.length)}catch(e){}}},30)}
function closePal(){scrim.classList.remove('on')}
window.openPal=openPal;window.closePal=closePal;
document.getElementById('cmdbtn').onclick=openPal;
/* Pedido explícito de Luis: "en buscar o ejecutar, si entro debo poder escribir o escanear un
   barcode, si le doy al boton, entonces sale lo que sale ahora" — la barra superior dejó de ser un
   solo botón (ver #cmdbar) para tener un input real (#cmdinput, escribible y compatible con
   lectores de código de barras: escriben el texto y disparan Enter solos) más un botón aparte
   (#cmdbtn, con el atajo "/") que sigue abriendo el buscador completo exactamente como antes. Al
   presionar Enter en el input: si el texto coincide con el número de orden, empaque o factura de
   una orden existente, se salta directo a Órdenes filtrado a esa orden (mismo mecanismo que ya usa
   el radar de Pulso, `goOrdersWith`) y, si esa orden sigue en Entrada, abre de una vez su editor
   (ver openOrderEditor) — el flujo típico de "escaneo el paquete que tengo en la mano para
   corregirlo". Si no matchea ninguna orden, se asume que es una búsqueda de texto normal y cae al
   comportamiento de siempre: abre el buscador completo, ya precargado con lo que se escribió. */
document.getElementById('cmdinput').addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;
 e.preventDefault();
 const raw=(e.target.value||'').trim();
 if(!raw)return;
 const q=raw.toLowerCase();
 const match=ORDERS.find(o=>o.inv.toLowerCase()===q||(o.pickBatch&&o.pickBatch.toLowerCase()===q)||(o.clientInvoice&&o.clientInvoice.toLowerCase()===q));
 if(match){
   e.target.value='';
   goOrdersWith('inv',match.inv);
   if(match.st==='cap')openOrderEditor(match.inv);
   toast((LANG==='es'?'Orden encontrada: ':'Order found: ')+match.inv);
   return;
 }
 openPal(raw);
});
scrim.onclick=e=>{if(e.target===scrim)closePal()};
document.getElementById('dispScrim').onclick=e=>{if(e.target.id==='dispScrim')closeDispatchModal()};
document.getElementById('genScrim').onclick=e=>{if(e.target.id==='genScrim')closeGenModal()};
palq.addEventListener('input',()=>renderPal(palq.value));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('genScrim').classList.contains('on')){closeGenModal();return}
  if(e.key==='Escape'&&document.getElementById('dispScrim').classList.contains('on')){closeDispatchModal();return}
  if((e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openPal();return}
  if(!scrim.classList.contains('on'))return;
  if(e.key==='Escape')closePal();else if(e.key==='ArrowDown'){e.preventDefault();cur=Math.min(cur+1,flat.length-1);mark()}
  else if(e.key==='ArrowUp'){e.preventDefault();cur=Math.max(cur-1,0);mark()}else if(e.key==='Enter'){e.preventDefault();if(flat[cur])go(flat[cur])}});

const aip=document.getElementById('aip');
/* La llave 'entrada' de ai.sug sigue viva aunque ya no exista una pantalla propia con esa clave
   (ver consolidación de Órdenes + Entrada de órdenes, ORD_ENTRY_OPEN): son las sugerencias que
   tienen sentido mientras se está capturando una orden, así que se muestran cuando la sección de
   "Nueva orden" está abierta dentro de Órdenes, y las de 'ordenes' (enfocadas en buscar/filtrar)
   el resto del tiempo. */
function aiSugs(){const s=t('ai.sug');if(CURRENT==='ordenes'&&ORD_ENTRY_OPEN)return s.entrada||s.ordenes||s.default;return s[CURRENT]||s.default}
function refreshAI(){
  document.getElementById('aisub').textContent=t('ai.sub')+' · '+(t('nav.'+CURRENT)[0]||'');
  document.getElementById('aiq').placeholder=t('ai.ph');
  document.getElementById('aisug').innerHTML=aiSugs().map(s=>`<button onclick="aiAsk('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('')}
function aiMsg(txt,who){const m=document.getElementById('aimsgs');const d=document.createElement('div');d.className='m '+who;d.textContent=txt;m.appendChild(d);m.scrollTop=m.scrollHeight}
window.aiAsk=q=>{aiMsg(q,'usr');setTimeout(()=>aiMsg(t('ai.ans'),'bot'),450)};
document.getElementById('fab').onclick=()=>{const on=aip.classList.toggle('on');
  if(on&&!aip.dataset.greeted){aiMsg(t('ai.hi'),'bot');aip.dataset.greeted=1}
  if(on){refreshAI();setTimeout(()=>document.getElementById('aiq').focus(),60)}};
document.getElementById('aix').onclick=()=>aip.classList.remove('on');
document.getElementById('aigo').onclick=()=>{const i=document.getElementById('aiq');if(i.value.trim()){aiAsk(i.value.trim());i.value=''}};
document.getElementById('aiq').addEventListener('keydown',e=>{if(e.key==='Enter'){const i=e.target;if(i.value.trim()){aiAsk(i.value.trim());i.value=''}}});

/* ===== theme + lang ===== */
function setTheme(th){document.documentElement.dataset.theme=th;document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.themeSet===th))}
const FLAGS={es:'🇵🇷',en:'🇺🇸'};
function setLang(l){LANG=l;
  document.getElementById('langFlag').textContent=FLAGS[l];
  document.getElementById('langCode').textContent=l.toUpperCase();
  document.querySelectorAll('#langdd .menu button').forEach(b=>b.classList.toggle('on',b.dataset.langSet===l));
  document.getElementById('langdd').classList.remove('open');
  document.getElementById('brandfull').innerHTML=teikemLockup();
  const _og=openGroup;applyStatic();tickClock();go(CURRENT,true);openGroup=_og;buildSidebar()}
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeSet));
document.getElementById('langBtn').onclick=e=>{e.stopPropagation();document.getElementById('langdd').classList.toggle('open')};
document.querySelectorAll('#langdd .menu button').forEach(b=>b.onclick=()=>setLang(b.dataset.langSet));
document.addEventListener('click',e=>{const dd=document.getElementById('langdd');if(!dd.contains(e.target))dd.classList.remove('open');
  const td=document.getElementById('tenantdd');if(td&&!td.contains(e.target))td.classList.remove('open')});
document.getElementById('collapseBtn').onclick=()=>document.getElementById('app').classList.toggle('col');
/* Selector de compañía: solo tiene sentido si el usuario está asignado a más de un tenant (UserTenant).
   Este login demo trae 2 para poder mostrar cómo se ve — con uno solo, este bloque ni se pintaría. */
const TENANTS=[{code:'ADV',name:'Advance Logistics'},{code:'ISLA',name:'Isla Cargo Solutions'}];
let CURRENT_TENANT='ADV';
function renderTenantMenu(){document.getElementById('tenantMenu').innerHTML=TENANTS.map(x=>`<button data-tenant-set="${x.code}" class="${x.code===CURRENT_TENANT?'on':''}">${x.name}</button>`).join('');
  document.querySelectorAll('#tenantMenu button').forEach(b=>b.onclick=()=>switchTenant(b.dataset.tenantSet))}
window.switchTenant=(code)=>{document.getElementById('tenantdd').classList.remove('open');
  if(code===CURRENT_TENANT)return;
  CURRENT_TENANT=code;const tn=TENANTS.find(x=>x.code===code);
  document.getElementById('tenantName').textContent=tn.name;
  renderTenantMenu();
  toast(t('ui.switchingTenant')+' '+tn.name+'\u2026');
  go('pulso')};
renderTenantMenu();

/* ===== boot ===== */
function hydrate(){document.querySelectorAll('[data-ic]').forEach(el=>{if(!el.dataset.done){el.innerHTML=ic(el.dataset.ic);el.dataset.done=1}})}
function applyStatic(){document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t)});
 document.querySelectorAll('[data-t-ph]').forEach(el=>{el.placeholder=t(el.dataset.tPh)})}
document.getElementById('brandfull').innerHTML=teikemLockup();
document.getElementById('brandmini').innerHTML=teikemLogo(44);
document.getElementById('fabmascot').innerHTML=teikoMascot(38);
document.getElementById('aimascot').innerHTML=teikoMascot(30);
setTheme('dark');applyStatic();buildSidebar();hydrate();tickClock();go('pulso');
</script>
