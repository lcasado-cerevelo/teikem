# Flujo Maestro: completar un despacho de punta a punta (recolectar y empacar).
# Home → Despacho → escanear producto → (posición sin cantidad: aviso, no agrega) → escribir la cantidad → escanear
# posición (agrega la línea) → Empacar → elegir consignatario → Confirmar despacho → Home.
# Lote A5 (decisión del dueño 5): la cantidad va primero; ya no hay cantidad 1 por omisión ni botón "Agregar".
# Corre después de 01-registrar-y-entrar.yaml. Variable -e E2E_CONSIGNEE_LABEL (la escribe
# scripts/e2e-mobile-fixtures.sh: "{nombre de la ubicación} · {ciudad}", igual que dispatchApi.ts la arma).
appId: com.teikem.almacen
---
- launchApp

- assertVisible: "Teikem Almacén"
- tapOn: "Despacho"

# dispatch.tsx muestra el ScanField de producto de una vez (sin paso previo como Recibir); se auto-enfoca.
- assertVisible: "Escanea el producto"
- inputText: "E2E-BARCODE-DISP"
- pressKey: Enter

# Borrador de línea: la cantidad viene vacía (newPickLineDraft) y el ScanField de posición se auto-enfoca.
- assertVisible: "Cantidad"
- assertVisible: "Escanea de qué posición sale"
# Posición sin cantidad: no se agrega nada y sale el aviso rojo (el cursor pasa a la cantidad).
- inputText: "A01-R01-N1-P01"
- pressKey: Enter
- assertVisible: "Escribe la cantidad primero y luego escanea la posición."
- assertNotVisible: "Líneas recolectadas"

# Primero la cantidad (testID dispatch-qty)...
- tapOn:
    id: "dispatch-qty"
- inputText: "2"
# ...y luego la posición (testID dispatch-from-bin): la lectura agrega la línea al instante (escanear = Aceptar).
- scrollUntilVisible:
    element:
      id: "dispatch-from-bin"
- tapOn:
    id: "dispatch-from-bin"
- inputText: "A01-R01-N1-P01"
- pressKey: Enter

# De vuelta en la recolección, con la línea capturada y el aviso verde "Agregado: …" (con la cantidad escrita, no 1).
- assertVisible: "Líneas recolectadas"
- assertVisible: "Agregado: 2 E2E-SKU-DISP desde A01-R01-N1-P01"
# Lote A3 (mejoras del Zebra): el campo de escaneo ya no abre el teclado en pantalla al enfocarse, así que no hay
# teclado que cerrar (hideKeyboard en Android manda "Atrás" y sacaría de la pantalla). Si el botón queda abajo, se busca.
- scrollUntilVisible:
    element:
      text: "Empacar"
- tapOn: "Empacar"

# Resuelve las posiciones y busca los consignatarios (llamadas en línea) antes de mostrar la lista.
- assertVisible: "¿A quién se despacha?"
- assertVisible: "${E2E_CONSIGNEE_LABEL}"
- tapOn: "${E2E_CONSIGNEE_LABEL}"

- assertVisible: "Teikem Almacén"
